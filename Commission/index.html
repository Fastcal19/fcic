<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Commission</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  background: #f4f6f8;
}
.container {
  padding: 24px;
}

.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.filters select {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.card {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}
.card h3 {
  margin: 0;
  font-size: 16px;
  color: #777;
}
.value {
  margin-top: 10px;
  font-size: 32px;
  font-weight: bold;
  color: #0d47a1;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}
thead {
  background: orange;
  color: white;
}
th,
td {
  padding: 12px 14px;
  font-size: 14px;
}
tbody tr:nth-child(even) {
  background: #f2f4f7;
}
.right {
  text-align: right;
}

.expand-row:hover {
  cursor: pointer;
  background: #e3f2fd !important;
}

.details-row {
  display: none;
  background: #eef4ff;
}
.details-box {
  padding: 16px;
}

/* DETAILS TABLE */
.details-table {
  width: 100%;
  border-collapse: collapse;
}
.details-table th,
.details-table td {
  border: 1px solid #000;
  padding: 6px 8px;
  font-size: 13px;
}
.details-table th {
  background: #f28c28;
  color: #000;
  text-align: center;
}
.text-right {
  text-align: right;
}
.desc-line {
  margin-bottom: 4px;
}
</style>
</head>

<body>
<div class="container">

  <!-- SUMMARY -->
  <div class="summary">
    <div class="card"><h3>Total Sales</h3><div class="value" id="totalSales">₱0.00</div></div>
    <div class="card"><h3>Total Commissions</h3><div class="value" id="totalCommission">₱0.00</div></div>
    <div class="card"><h3>Paid Commissions</h3><div class="value" id="totalPaid">₱0.00</div></div>
    <div class="card"><h3>Commission Balance</h3><div class="value" id="totalBalance">₱0.00</div></div>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <select id="yearFilter"></select>
    <select id="monthFilter"></select>
    <select id="agentFilter">
      <option value="ALL">All</option>
    </select>
  </div>

  <!-- MAIN TABLE -->
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Invoice</th>
        <th>Client</th>
        <th>Agent</th>
        <th class="right">Sales</th>
        <th class="right">Expenses</th>
        <th class="right">Net</th>
        <th class="right">Rate</th>
        <th class="right">Commission</th>
        <th class="right">Paid</th>
        <th class="right">Balance</th>
      </tr>
    </thead>
    <tbody id="salesTable"></tbody>
  </table>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzADt7Ctsw3ZEnzgrU1A7d6opeH-SN8EC42wPj3njBYK0c6_gGPV1oAMQLQovb-x6PNVA/exec";

const yearFilter = document.getElementById("yearFilter");
const monthFilter = document.getElementById("monthFilter");
const agentFilter = document.getElementById("agentFilter");
const tbody = document.getElementById("salesTable");

const totalSalesEl = document.getElementById("totalSales");
const totalCommissionEl = document.getElementById("totalCommission");
const totalPaidEl = document.getElementById("totalPaid");
const totalBalanceEl = document.getElementById("totalBalance");

const now = new Date();
const months = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

monthFilter.innerHTML = `<option value="ALL">All</option>`;
months.forEach((m, i) => {
  monthFilter.innerHTML += `<option value="${i}">${m}</option>`;
});
monthFilter.value = "ALL";

// ✅ default = current month
monthFilter.value = now.getMonth().toString();


function peso(v) {
  return "₱" + Number(v || 0).toLocaleString("en-PH", { minimumFractionDigits: 2 });
}
function num(v) {
  return Number((v || "").toString().replace(/[₱,]/g, "")) || 0;
}
function getRate(total) {
  if (total >= 2000001) return 0.07;
  if (total >= 1000001) return 0.05;
  if (total >= 501000) return 0.03;
  return 0.025;
}
function parseDate(v) {
  const d = new Date(v);
  if (!isNaN(d)) return d;
  const p = v.split("/");
  return new Date(p[2], p[0] - 1, p[1]);
}

let salesData = [];

fetch(API_URL)
  .then(r => r.json())
  .then(raw => {
    const grouped = {};

    raw.forEach(r => {
  if (!r.invoice) return;
  const d = parseDate(r.date);

  if (!grouped[r.invoice]) {
    grouped[r.invoice] = {
      invoice: r.invoice,
      date: d,
      client: r.client || "",
      agent: r.agent || "",
      amount: 0,
      expenses: 0,
      net: 0,
      paid: 0,
      po: r.po || "N/A",
      descriptions: [],
      expensesList: []
    };
  }

  // ---------- SALES ----------
  if (r.type === "SALE") {
    grouped[r.invoice].amount += num(r.amount);
    grouped[r.invoice].descriptions.push({
      text: r.description,
      amount: num(r.amount)
    });
  }

  // ---------- EXPENSES ----------
  if (r.type === "EXPENSE") {
    grouped[r.invoice].expenses += num(r.amount);
    grouped[r.invoice].expensesList.push({
      date: parseDate(r.date),
      name: r.description,
      amount: num(r.amount)
    });
  }

  grouped[r.invoice].net =
    grouped[r.invoice].amount - grouped[r.invoice].expenses;
});


    salesData = Object.values(grouped).filter(s => s.date);

    yearFilter.innerHTML = `<option value="ALL">All</option>`;

[...new Set(salesData.map(s => s.date.getFullYear()))]
  .sort((a, b) => b - a)
  .forEach(y => {
    yearFilter.innerHTML += `<option value="${y}">${y}</option>`;
  });

yearFilter.value = "ALL";

// ✅ default = current year
yearFilter.value = now.getFullYear().toString();

    [...new Set(salesData.map(s => s.agent))]
      .sort()
      .forEach(a => agentFilter.innerHTML += `<option value="${a}">${a}</option>`);

    render();
  });

function render() {
  tbody.innerHTML = "";
  let ts = 0, tc = 0, tp = 0, tb = 0;

  const y = yearFilter.value;
const m = monthFilter.value;
  const agent = agentFilter.value;

  const filtered = salesData.filter(s =>
  (y === "ALL" || s.date.getFullYear() === Number(y)) &&
  (m === "ALL" || s.date.getMonth() === Number(m)) &&
  (agent === "ALL" || s.agent === agent)
);


  const agentTotals = {};
  filtered.forEach(s => agentTotals[s.agent] = (agentTotals[s.agent] || 0) + s.amount);

  filtered.forEach(s => {
    const rate = getRate(agentTotals[s.agent]);
    const commission = s.net * rate;
    const balance = commission - s.paid;

    ts += s.amount;
    tc += commission;
    tp += s.paid;
    tb += balance;

    const tr = document.createElement("tr");
    tr.className = "expand-row";
    tr.innerHTML = `
      <td>${months[s.date.getMonth()]} ${s.date.getDate()}, ${s.date.getFullYear()}</td>
      <td>${s.invoice}</td>
      <td>${s.client}</td>
      <td>${s.agent}</td>
      <td class="right">${peso(s.amount)}</td>
      <td class="right">${peso(s.expenses)}</td>
      <td class="right">${peso(s.net)}</td>
      <td class="right">${(rate * 100).toFixed(2)}%</td>
      <td class="right">${peso(commission)}</td>
      <td class="right">${peso(s.paid)}</td>
      <td class="right">${peso(balance)}</td>
    `;

    const dr = document.createElement("tr");
    dr.className = "details-row";
    dr.innerHTML = `
      <td colspan="11">
        <div class="details-box">
          <table class="details-table">
            <thead>
              <tr>
                <th>DATE</th>
                <th>DESCRIPTION</th>
                <th>GROSS INCOME</th>
                <th>EXPENSES</th>
              </tr>
            </thead>
            <tbody>
             

<!-- SALES DESCRIPTIONS -->
${
  s.descriptions.length
    ? s.descriptions.map(d => `
        <tr>
          <td>${months[s.date.getMonth()]} ${s.date.getDate()}, ${s.date.getFullYear()}</td>
          <td>${s.po} - ${d.text}</td>
          <td class="text-right">${peso(d.amount)}</td>
          <td></td>
        </tr>
      `).join("")
    : `
      <tr>
        <td>${months[s.date.getMonth()]} ${s.date.getDate()}, ${s.date.getFullYear()}</td>
        <td>${s.po || "N/A"}</td>
        <td class="text-right">₱0.00</td>
        <td></td>
      </tr>
    `
}

<!-- EXPENSES -->
${
  s.expensesList.map(exp => `
    <tr>
      <td>
        ${months[exp.date.getMonth()]} ${exp.date.getDate()}, ${exp.date.getFullYear()}
      </td>
      <td>${exp.name}</td>
      <td></td>
      <td class="text-right">${peso(exp.amount)}</td>
    </tr>
  `).join("")
}

<!-- TOTALS -->
<tr style="font-weight:bold; border-top:2px solid #000;">
  <td colspan="2" class="text-right">TOTAL</td>
  <td class="text-right">${peso(s.amount)}</td>
  <td class="text-right">${peso(s.expenses)}</td>
</tr>

<tr style="font-weight:bold; background:#f5f5f5;">
  <td colspan="3" class="text-right">NET</td>
  <td class="text-right">${peso(s.amount - s.expenses)}</td>
</tr>

</tbody>

          </table>
        </div>
      </td>
    `;

    tr.onclick = () => {
  // close all other expanded rows
  document.querySelectorAll(".details-row").forEach(row => {
    if (row !== dr) row.style.display = "none";
  });

  // toggle the clicked one
  dr.style.display = dr.style.display === "table-row" ? "none" : "table-row";
};


    tbody.appendChild(tr);
    tbody.appendChild(dr);
  });

  totalSalesEl.textContent = peso(ts);
  totalCommissionEl.textContent = peso(tc);
  totalPaidEl.textContent = peso(tp);
  totalBalanceEl.textContent = peso(tb);
}

yearFilter.onchange = render;
monthFilter.onchange = render;
agentFilter.onchange = render;
</script>
</body>
</html>
