<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monthly Contribution Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  padding:20px;
}
.container {
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:8px;
}
h2 {
  text-align:center;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-bottom:25px;
}
th, td {
  border:1px solid #ddd;
  padding:8px;
  font-size:14px;
}
th {
  background:#2c3e50;
  color:#fff;
}
.agency {
  background:#ecf0f1;
  font-weight:bold;
}
.total {
  background:#fafafa;
  font-weight:bold;
}
.right {
  text-align:right;
}

/* ================= PRINT STYLES ================= */
@media print {
  body, .container {
    background: #fff;
    padding: 0;
  }
  .unpaid-section, button {
    display: none !important;
  }
  #printDetails {
    display: block !important;
  }
  table {
    font-size: 12px;
  }
  th {
    background: #eee !important;
    color: #000 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .agency {
    background: #ddd !important;
  }
  .total {
    background: #f2f2f2 !important;
    font-weight: bold;
  }
  .page-break {
    page-break-before: always;
  }
  .print-header {
    text-align: center;
    margin-bottom: 15px;
  }
  .print-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .signatures {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }
  .sign-box {
    width: 30%;
    text-align: center;
  }
  .sign-line {
    margin-top: 40px;
    border-top: 1px solid #000;
  }
}
#printDetails {
  display: none;
}

/* ================= MOBILE STYLES ================= */
@media (max-width: 768px) {
  body {
    padding: 10px;
  }

  .container {
    padding: 12px;
  }

  h2, h3, h4 {
    font-size: 16px;
  }

  /* Stack unpaid section */
#pendingSection,
#paidSection,
.tabs,
button {
  display: none !important;
}

  /* Reduce table font size */
  table {
    font-size: 12px;
  }

  th, td {
    padding: 6px;
  }

  /* Make tables scrollable instead of squished */
  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
  }

  /* Buttons full width on mobile */
  button {
    width: 100%;
    font-size: 14px;
    padding: 10px;
  }

  /* Print meta spacing */
  .print-meta {
    font-size: 11px;
    flex-direction: column;
    gap: 4px;
  }
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.tab{
  padding:8px 16px;
  border:none;
  background:#ddd;
  cursor:pointer;
  border-radius:4px;
}

.tab.active{
  background:#2c3e50;
  color:white;
}

</style>
</head>

<body>
  <div style="margin-bottom:10px;">
  <label><strong>Filter Agency:</strong></label>
  <select id="agencyFilter" onchange="loadMonths()">
    <option value="">All</option>
    <option value="SSS">SSS</option>
    <option value="PHILHEALTH">PHILHEALTH</option>
    <option value="PAG-IBIG">PAG-IBIG</option>
  </select>
</div>
<div class="container">
  <h2></h2>

  <div class="tabs">
  <button class="tab active" onclick="switchTab('pending')">Unpaid / Pending</button>
  <button class="tab" onclick="switchTab('paid')">Paid</button>
</div>


<button onclick="window.print()" style="margin-bottom:15px">
🖨 Print Selected Contributions
</button>

  <!-- Unpaid section (screen only) -->
  <div id="pendingSection" class="unpaid-section" style="display:grid; grid-template-columns: 280px 1fr; gap:20px;">
    <div>
      <h4>UNPAID CONTRIBUTIONS</h4>
      <table>
        <tr>
          <th>Month</th>
          <th class="right">Amount</th>
        </tr>
        <tbody id="unpaidList"></tbody>
      </table>
    </div>
    <div id="details">
      <p style="color:red">Click an unpaid month to view details</p>
    </div>
  </div>


<div id="paidSection" style="display:none; grid-template-columns: 280px 1fr; gap:20px;">

  <!-- LEFT SIDE : Month List -->
  <div>
    <h4>PAID CONTRIBUTIONS</h4>
    <table>
      <tr>
        <th>Month</th>
        <th class="right">Amount</th>
      </tr>
      <tbody id="paidList"></tbody>
    </table>
  </div>

  <!-- RIGHT SIDE : Details -->
  <div id="paidDetails">
    <p style="color:green">Click a paid month to view details</p>
  </div>

</div>

  <!-- Selected unpaid contributions for printing -->
  <div id="printDetails"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxAIPmW-Es-gNkUSfVtVotUmldY2SEP5crfRqgy3xOQ1HhVwRMIKz_UyRvJ6ChhCwmKxg/exec";

let data = [];
let selectedMonth = null;
let currentStatus = "pending";
let selectedAgency = "";

fetch(API_URL)
  .then(res => res.json())
  .then(json => {
    data = json;
    loadMonths();
  });

function switchTab(status){

  currentStatus = status;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));

  if(status==="pending"){
    document.querySelectorAll(".tab")[0].classList.add("active");
    document.getElementById("pendingSection").style.display="grid";
    document.getElementById("paidSection").style.display="none";
  }else{
    document.querySelectorAll(".tab")[1].classList.add("active");
    document.getElementById("pendingSection").style.display="none";
    document.getElementById("paidSection").style.display="grid";
  }

  loadMonths();
}

/* Load unpaid contributions (screen only) */
function loadMonths(){

  selectedAgency = document.getElementById("agencyFilter")?.value || "";

  const filtered = data.filter(d => 
    d.status?.toLowerCase() === currentStatus &&
    (selectedAgency === "" || d.agency === selectedAgency)
  );

  const list = currentStatus==="pending"
    ? document.getElementById("unpaidList")
    : document.getElementById("paidList");

  if (!filtered.length) {
    list.innerHTML = `<tr><td colspan="2" style="text-align:center;color:#999">No records</td></tr>`;
    return;
  }

  const months = {};
  let grandTotal = 0;

  filtered.forEach(r => {
    months[r.month] = (months[r.month] || 0) + Number(r.total);
    grandTotal += Number(r.total);
  });

  // 👉 SORT months (latest first like your screenshot)
  const sortedMonths = Object.entries(months).sort((a,b)=>{
    return new Date(b[0]) - new Date(a[0]);
  });

  let html = "";

  sortedMonths.forEach(([m, amt]) => {
    html += `
      <tr onclick="selectMonth('${m}')" style="cursor:pointer">
        <td>${m}</td>
        <td class="right">${formatAmount(amt)}</td>
      </tr>
    `;
  });

  // ✅ TOTAL ROW (THIS IS WHAT YOU NEED)
  html += `
    <tr class="total" style="background:#2c3e50;color:#fff;">
      <td><strong>TOTAL</strong></td>
      <td class="right"><strong>${formatAmount(grandTotal)}</strong></td>
    </tr>
  `;

  list.innerHTML = html;
}

function loadPaid(){

  const paid = data.filter(d => d.status?.toLowerCase() === "paid");
  const paidList = document.getElementById("paidList");

  if(!paid.length){
    paidList.innerHTML = `<tr><td colspan="2" style="text-align:center;color:#999">No paid contributions</td></tr>`;
    return;
  }

  const months = {};
  paid.forEach(r => months[r.month] = (months[r.month] || 0) + Number(r.total));

  paidList.innerHTML = Object.entries(months).map(([m, amt]) =>
    `<tr>
      <td>${m}</td>
      <td class="right">${formatAmount(amt)}</td>
    </tr>`
  ).join("");

}

/* When user clicks a month */
function selectMonth(month) {
  selectedMonth = month;
  renderDetails(month);
  preparePrint(month);
}

function formatAmount(val){
  return Number(val || 0).toLocaleString("en-PH",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

/* Render unpaid details for screen */
function renderDetails(month) {

  const filtered = data.filter(d =>
  d.month === month &&
  d.status?.toLowerCase() === currentStatus &&
  (selectedAgency === "" || d.agency === selectedAgency)
);

  const agencies = [...new Set(filtered.map(d => d.agency))];

  let html = `<div class="print-meta"><div><strong>Month:</strong> ${month}</div></div>`;

  agencies.forEach((agency, idx) => {

    if (idx > 0) html += `<div class="page-break"></div>`;

    const rows = filtered.filter(r => r.agency === agency);

    let empTotal = 0,
        emprTotal = 0,
        tot = 0;

    html += `<table>
      <tr class="agency"><td colspan="4">${agency}</td></tr>
      <tr>
        <th>Employee</th>
        <th>Employee Share</th>
        <th>Employer Share</th>
        <th>Total</th>
      </tr>`;

    rows.forEach(r => {

      empTotal += r.empShare;
      emprTotal += r.emprShare;
      tot += r.total;

      html += `<tr>
        <td>${r.employee}</td>
        <td class="right">${formatAmount(r.emprShare)}</td>
        <td class="right">${formatAmount(r.empShare)}</td>
        <td class="right">${formatAmount(r.total)}</td>
      </tr>`;
    });

    html += `<tr class="total">
      <td>TOTAL</td>
      <td class="right">${formatAmount(emprTotal)}</td>
<td class="right">${formatAmount(empTotal)}</td>
<td class="right">${formatAmount(tot)}</td>
    </tr></table>`;
  });

  if(currentStatus === "pending"){
    document.getElementById("details").innerHTML = html;
  }else{
    document.getElementById("paidDetails").innerHTML = html;
  }

}


/* Prepare selected month for printing (each agency has its own signature) */
function preparePrint(month) {
  const filtered = data.filter(d =>
  d.month === month &&
  d.status?.toLowerCase() === currentStatus &&
  (selectedAgency === "" || d.agency === selectedAgency)
);
  const agencies = [...new Set(filtered.map(d => d.agency))];
  let html = `<div class="print-header"><h3>Monthly Contribution</h3></div>`;
  html += `<div class="print-meta"><div><strong>Month:</strong> ${month}</div></div>`;

  agencies.forEach((agency, idx) => {
    if (idx > 0) html += `<div class="page-break"></div>`;
    const rows = filtered.filter(r => r.agency === agency);
    let empTotal = 0, emprTotal = 0, tot = 0;

    html += `<table>
      <tr class="agency"><td colspan="4">${agency}</td></tr>
      <tr>
        <th>Employee</th>
        <th>Employee Share</th>
        <th>Employer Share</th>
        <th>Total</th>
      </tr>`;

    rows.forEach(r => {
  empTotal += r.empShare;
  emprTotal += r.emprShare;
  tot += r.total;

  html += `<tr>
    <td>${r.employee}</td>
    <td class="right">${formatAmount(r.emprShare)}</td>
    <td class="right">${formatAmount(r.empShare)}</td>
    <td class="right">${formatAmount(r.total)}</td>
  </tr>`;
});

html += `<tr class="total">
  <td>TOTAL</td>
  <td class="right">${formatAmount(emprTotal)}</td>
  <td class="right">${formatAmount(empTotal)}</td>
  <td class="right">${formatAmount(tot)}</td>
</tr></table>`;

    // Add signature lines **per agency**
    html += `<div class="signatures">
      <div class="sign-box"><div class="sign-line"></div>Prepared By</div>
      <div class="sign-box"><div class="sign-line"></div>Checked By</div>
      <div class="sign-box"><div class="sign-line"></div>Approved By</div>
    </div>`;
  });

  document.getElementById("printDetails").innerHTML = html;
}
</script>
</body>
</html>
