<!DOCTYPE html>
<html>
<head>
  <title>Project Reports</title>

  <style>
    :root {
      --orange: #ff7a00;
      --dark: #2f2f2f;
      --mid: #444;
      --light: #f2f2f2;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: var(--light);
    }

    .header {
      background: var(--dark);
      color: white;
      padding: 15px;
      border-bottom: 4px solid var(--orange);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls {
      padding: 15px;
      background: var(--mid);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      padding: 8px;
      border: none;
      border-radius: 4px;
    }

    button {
      background: var(--orange);
      border: none;
      color: white;
      padding: 8px 14px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }

    button:hover {
      background: #e86f00;
    }

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border: 1px solid #ccc;
  table-layout: fixed;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: left;
  vertical-align: top;
  overflow: hidden;
  text-overflow: ellipsis;
}

th {
  background: var(--dark);
  color: white;
  border-bottom: 3px solid var(--orange);
}

/* DATE */
th:nth-child(1),
td:nth-child(1) {
  width: 10%;
  white-space: nowrap;
}

/* PO */
th:nth-child(2),
td:nth-child(2) {
  width: 10%;
  white-space: nowrap;
}

/* DESCRIPTION */
th:nth-child(3),
td:nth-child(3) {
  width: calc(100% - 380px);
  white-space: normal;
  word-break: break-word;
}

/* STATUS */
th:nth-child(4),
td:nth-child(4) {
  width: 20%;
  text-align: center;
  white-space: nowrap;
}

    tr:hover {
      background: #fff3e6;
      cursor: pointer;
    }

    
    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 420px;
      padding: 20px;
      border-radius: 8px;
      border-top: 5px solid var(--orange);
    }

    .modal-content input {
      width: 100%;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    .close-btn {
      background: #777;
    }

    #dateDisplay {
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 4px;
      background: #f9f9f9;
      margin-bottom: 8px;
    }

    #fileLink {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
    }

    #desc {
  width: 100%;
}

.refresh-btn {
  width: 38px;
  height: 38px;
  padding: 0;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#search {
  width: 300px;
}

/* Loader Container */
.loader{
    position:absolute;
    width:180px;
    height:180px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 130px;
}

/* Logo */
.logo1{
    width:180px;
    height:180px;
    border-radius:50%;
    background:#fff;
    padding:6px;
    object-fit:contain;
    z-index:2;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    animation:pulse 1.5s ease-in-out infinite;
}


@keyframes glow{
    0%,100%{
        filter:drop-shadow(0 0 6px rgba(255,122,0,.3));
    }
    50%{
        filter:drop-shadow(0 0 20px rgba(255,122,0,.9));
    }
}



/* Rotating Ring */
@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* Logo Pulse */
@keyframes pulse{
    0%,100%{
        transform:scale(1);
        box-shadow:0 5px 15px rgba(0,0,0,.15);
    }
    50%{
        transform:scale(1.12);
        box-shadow:0 10px 30px rgba(255,152,0,.45);
    }
}

#spinnerOverlay{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.96);
    z-index:2;
}


/* Electric Ring */

.electric-ring{
    position:absolute;
    width:240px;
    height:240px;
    border-radius:50%;
    border:4px solid transparent;
    border-top:4px solid #ff9800;
    border-left:4px solid #ffd54f;
    
    animation:electricSpin 1.5s linear infinite;
}

/* Second Ring */

.ring2{
    width:220px;
    height:220px;
    animation-direction:reverse;
    animation-duration:.8s;
    border-top-color:#ffffff;
    border-right:4px solid #ff9800;
}

@keyframes electricSpin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes energyPulse{

    0%,100%{
        transform:scale(1);
        filter:drop-shadow(0 0 5px orange);
    }

    50%{
        transform:scale(1.08);
        filter:
            drop-shadow(0 0 10px orange)
            drop-shadow(0 0 25px orange);
    }

}

</style>
</head>

<div id="spinnerOverlay" style="display:none;">
    <div class="loader">
        <div class="electric-ring"></div>
        <div class="electric-ring ring2"></div>

        <img src="fcic logo.png" class="logo1" alt="FCIC Logo">
    </div>
</div>

<body>
<div class="controls">
  <button onclick="openCreateModal()">NEW</button>

  <input type="text" id="search" placeholder="Search..." onkeyup="filterTable()">

  <button class="refresh-btn" onclick="refreshTable()" title="Refresh">
    ⟳
  </button>
</div>

<table>
  <thead>
    <tr>
      <th>DATE</th>
      <th>PO</th>
      <th>PROJECT DESCRIPTION</th>
      <th>STATUS</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <h3 id="modalTitle">DETAILS</h3>

    <div id="dateDisplay" style="display:none;"></div>
    <input type="date" id="date">

    <input type="text" id="po" placeholder="Purchase Order Number">
    <textarea id="desc" rows="10" placeholder="Project description"></textarea>

    <div id="fileLink"></div>

    <label id="fileLabel">Attachment</label>
    <input type="file" id="file">

    <div class="modal-actions">
      <button id="saveBtn" onclick="saveData()">Save</button>

<div id="viewActions" style="display:none;">
  <button onclick="editRecord()">Edit</button>
  <button onclick="checkRecord()" style="background:#4f84d9;">Checked</button>
  <button onclick="approveRecord()" style="background:#28a745;">Approved</button>
  <button onclick="deleteRecord()" style="background:#d9534f;">Delete</button>
</div>

<button class="close-btn" onclick="closeModal()">Close</button>
    </div>

  </div>
  
</div>


</div>
<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyqsKCh3b2OetjgLV7VHOIoqwwgKp5nk0jiHIp_rSee65qXHNnyxW2p5mbqHtKYPhhe2Q/exec";

let currentMode = "create";
let selectedRecord = null;
let currentUser = null;

function showSpinner() {
    const spinner = document.getElementById("spinnerOverlay");
    if (spinner) spinner.style.display = "flex";
}

function hideSpinner() {
    const spinner = document.getElementById("spinnerOverlay");
    if (spinner) spinner.style.display = "none";
}

// ================= ROLE ACCESS =================
function applyRoleAccess() {

  const newBtn = document.querySelector(
    'button[onclick="openCreateModal()"]'
  );

  // HIDE BY DEFAULT
  newBtn.style.display = "none";

  // ONLY MAKER CAN CREATE
  if (currentUser.role === "Maker") {
    newBtn.style.display = "inline-block";
  }

  // ADMIN OPTIONAL:
  // Uncomment if admin should also create
  if (currentUser.role === "Admin") {
     newBtn.style.display = "inline-block";
   }
}



async function validateUser() {
  showSpinner();
  try {
    // GET EID FROM LOCAL STORAGE
    const eid = localStorage.getItem("eid");
    if (!eid) {
      hideSpinner();
      alert("No login session.");
      location.href = "/User/";
      return;
    }

    const res = await fetch(
      API_URL +
      "?action=validate&eid=" +
      encodeURIComponent(eid)
    );

    const result = await res.json();

    // INVALID USER
    if (!result.success) {
      hideSpinner();
      alert("Access denied.");
      localStorage.removeItem("eid");
      location.href = "/User/";
      return;
    }

    // VALID USER
    currentUser = result.user;
    console.log("CURRENT USER:", currentUser);
    // ROLE ACCESS
    applyRoleAccess();
    // LOAD REPORTS
    await loadData();
  } catch (err) {
    console.error(err);
    alert("Validation failed.");
  } finally {
    hideSpinner();
  }
}

// ================= BUTTON PERMISSIONS =================

function applyPermissions(r) {

  document.getElementById("viewActions").style.display = "block";

  const editBtn =
    document.querySelector('button[onclick="editRecord()"]');

  const checkBtn =
    document.querySelector('button[onclick="checkRecord()"]');

  const approveBtn =
    document.querySelector('button[onclick="approveRecord()"]');

  const deleteBtn =
    document.querySelector('button[onclick="deleteRecord()"]');

  // HIDE ALL FIRST
  editBtn.style.display = "none";
  checkBtn.style.display = "none";
  approveBtn.style.display = "none";
  deleteBtn.style.display = "none";


  // ================= MAKER =================
  // Edit only when:
  // - For Checking
  // - For Approval

  if (currentUser.role === "Maker") {

    if (
      r.status === "For Checking" ||
      r.status === "For Approval"
    ) {
      editBtn.style.display = "inline-block";
    }
  }


  // ================= CHECKER =================
  // Checked button only when status is For Checking

  if (currentUser.role === "Checker") {

    if (r.status === "For Checking") {
      checkBtn.style.display = "inline-block";
    }
  }


  // ================= APPROVER =================
  // Approved button only when status is For Approval

  if (currentUser.role === "Approver") {

    if (r.status === "For Approval") {
      approveBtn.style.display = "inline-block";
    }
  }


  // ================= ADMIN =================
  // Delete only for Admin

  if (currentUser.role === "Admin") {

    deleteBtn.style.display = "inline-block";
  }
}


// DELETE USER
function deleteUser(index) {

  if (!confirm("Delete this user?")) return;

  users.splice(index, 1);

  localStorage.setItem("users", JSON.stringify(users));

  loadUsers();
}

// ================= OPEN CREATE =================
function openCreateModal() {
  currentMode = "create";

  document.getElementById("modalTitle").innerText = "NEW PROJECT REPORT";

  document.getElementById("dateDisplay").style.display = "none";
  document.getElementById("date").style.display = "block";

  document.getElementById("date").disabled = false;
  document.getElementById("po").disabled = false;
  document.getElementById("desc").disabled = false;

  document.getElementById("date").value = "";
  document.getElementById("po").value = "";
  document.getElementById("desc").value = "";

  document.getElementById("file").style.display = "block";
  document.getElementById("file").value = "";

  document.getElementById("fileLink").innerHTML = "";

  document.getElementById("saveBtn").style.display = "inline-block";
  document.getElementById("fileLink").style.display = "none";
  document.getElementById("modal").style.display = "flex";
  document.getElementById("fileLabel").style.display = "block";
  document.getElementById("file").style.display = "block";
  document.getElementById("viewActions").style.display = "none";
  document.getElementById("viewActions").style.display = "none";

document.getElementById("saveBtn").innerText = "Save";
document.getElementById("saveBtn").style.display = "inline-block";
}

// ================= OPEN VIEW =================
function openViewModal(r) {
  currentMode = "view";
  selectedRecord = r;

  document.getElementById("modalTitle").innerText = "PROJECT DETAILS";

  document.getElementById("dateDisplay").style.display = "block";
  document.getElementById("dateDisplay").innerText = formatDate(r.date);

  document.getElementById("date").style.display = "none";

  document.getElementById("po").value = r.po || "";
  document.getElementById("desc").value = r.desc || "";

  document.getElementById("po").disabled = true;
  document.getElementById("desc").disabled = true;

  document.getElementById("file").style.display = "none";

  document.getElementById("fileLink").innerHTML = r.file
    ? `<a href="${r.file}" target="_blank">Open File</a>`
    : "No file attached";

  document.getElementById("saveBtn").style.display = "none";
  document.getElementById("fileLink").style.display = "block";
  document.getElementById("modal").style.display = "flex";
  document.getElementById("fileLabel").style.display = "none";
  document.getElementById("file").style.display = "none";
  document.getElementById("saveBtn").style.display = "none";

    applyPermissions(r);
}


// ================= CLOSE =================
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

// ================= LOAD DATA =================
async function loadData() {

  showSpinner();

  try {

    let res = await fetch(API_URL);
let data = await res.json();

// Sort by date (newest first)
data.sort((a, b) => new Date(b.date) - new Date(a.date));

let tbody = document.getElementById("tbody");
tbody.innerHTML = "";

data.forEach((r) => {

      const encoded = encodeURIComponent(JSON.stringify(r));

      tbody.innerHTML += `
        <tr onclick="openRow('${encoded}')">
          <td>${formatDate(r.date)}</td>
          <td>${r.po}</td>
          <td>${r.desc}</td>
          <td>${r.status || ""}</td>
        </tr>
      `;
    });

  } catch(err) {

    console.error(err);
    alert("Failed to load data.");

  } finally {

    hideSpinner();

  }
}

function openRow(encoded) {
  const r = JSON.parse(decodeURIComponent(encoded));
  openViewModal(r);
}

// ================= SAVE =================
async function saveData() {

  showSpinner();

  try {

    let date = document.getElementById("date").value;
    let po = document.getElementById("po").value;
    let desc = document.getElementById("desc").value;
    let file = document.getElementById("file").files[0];

    let fileBase64 = "";
    let fileType = "";
    let fileName = "";

    if (file) {

      let base64 = await toBase64(file);

      fileBase64 = base64.split(",")[1];
      fileType = file.type;
      fileName = file.name;
    }

    let payload = {
      date,
      po,
      desc,
      fileBase64,
      fileType,
      fileName
    };

    
    if (currentMode === "edit") {
      payload.action = "update";
      payload.row = selectedRecord.row;
      payload.oldFile = selectedRecord.file || "";
    }

    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    closeModal();

    await loadData();

  } catch(err) {

    console.error(err);
    alert("Save failed.");

  } finally {

    hideSpinner();

  }
}

// ================= BASE64 =================
function toBase64(file) {
  return new Promise((resolve, reject) => {
    let reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ================= SEARCH =================
function filterTable() {
  let input = document.getElementById("search").value.toLowerCase();
  let rows = document.querySelectorAll("#tbody tr");

  rows.forEach(r => {
    r.style.display = r.innerText.toLowerCase().includes(input)
      ? ""
      : "none";
  });
}

function editRecord() {
  currentMode = "edit";
  document.getElementById("date").style.display = "block";
  document.getElementById("date").value = selectedRecord.date;
  document.getElementById("dateDisplay").style.display = "none";
  document.getElementById("po").disabled = false;
  document.getElementById("desc").disabled = false;
  document.getElementById("fileLabel").style.display = "block";
  document.getElementById("file").style.display = "block";
  document.getElementById("fileLink").style.display = "none";
  document.getElementById("viewActions").style.display = "none";
  document.getElementById("saveBtn").innerText = "Update";
  document.getElementById("saveBtn").style.display = "inline-block";
  document.getElementById("modalTitle").innerText = "EDIT PROJECT";
}

function deleteRecord() {
  if (!confirm("Delete this project report?")) return;
  console.log("DELETE:", selectedRecord);
  // call API here
}

// Approver code
async function approveRecord() {
  if (!confirm("Approve this project report?")) return;
  showSpinner();
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "approve",
        row: selectedRecord.row
      })
    });
    closeModal();
    await loadData();
  } finally {
    hideSpinner();
  }
}

//Checker Code
async function checkRecord() {
  if (!confirm("Mark as checked?")) return;
  showSpinner();
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "check",
        row: selectedRecord.row
      })
    });
    closeModal();
    await loadData();
  } catch(err) {
    console.error(err);
    alert("Check failed.");
  } finally {
    hideSpinner();
  }
}
  
// ===== Refresh =====
function refreshTable() {
  document.getElementById("search").value = "";
  loadData();
}
  
// ================= FORMAT DATE =================
function formatDate(dateStr) {
  if (!dateStr) return "";
  const date = new Date(dateStr);
  return date.toLocaleDateString("en-US", {
    year: "numeric",
    month: "long",
    day: "2-digit"
  });
}

window.onclick = function(e) {
  if (e.target === document.getElementById("modal")) {
    closeModal();
  }
};

validateUser();

</script>

</body>
</html>
