<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Journal Entries Viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%);
        display: flex;
        justify-content: center;
        padding: 30px;
    }

    /* ⭐ MAIN CONTAINER ⭐ */
    .main-container {
        width: 100%;
        background: whitesmoke;
        padding: 25px 30px;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(0,0,0,0.12);
        height: 95%;
    }

    h2 {
        margin-bottom: 8px;
        font-size: 22px;
        letter-spacing: 0.6px;
    }
    .meta { color: #666; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    thead th {
        border-bottom: 2px solid #000;
        text-align: left;
        padding-bottom: 8px;
        padding-right: 6px;
    }
    .col-date { width: 12%; }
    .col-ref  { width: 12%; }
    .col-account { width: 46%; }
    .col-debit { width: 15%; text-align: right; }
    .col-credit { width: 15%; text-align: right; }

    .account-title { font-weight: bold; }
    .indent { padding-left: 25px; }
    .description { font-style: italic; color: #444; padding-top: 3px; }
    .spacer-row td { height: 18px; }
    .loading { color: #0b66c3; }
    .error { color: #b00020; font-weight: bold; }

    /* MODAL */
    #modalOverlay {
        display:none;
        position:fixed;
        top:0; left:0;
        width:100%; height:100%;
        background:rgba(0,0,0,0.5);
        justify-content:center;
        align-items:center;
        z-index:9999;
    }
    #modalContent {
        background:white;
        width:90%;
        max-width:900px;
        height: 1000px;
        border-radius:10px;
        padding:20px;
        box-shadow:0 0 20px rgba(0,0,0,0.3);
        max-height:90%;
        overflow-y:auto;
    }
    .close-btn {
        float:right;
        background:red;
        color:white;
        border:none;
        padding:5px 10px;
        border-radius:4px;
        cursor:pointer;
        margin-bottom:10px;
    }
</style>
</head>

<!-- ⭐ MODAL STRUCTURE ⭐ -->
<div id="modalOverlay">
    <div id="modalContent">
        <button class="close-btn" onclick="closeModal()">X</button>
        <iframe id="modalFrame" style="width:100%; height:100%; border:none;"></iframe>
    </div>
</div>

<body>

<div class="main-container">

<h2>Journal Entries</h2>

<button onclick="openModal('Add JE.html')"
        style="
            padding: 8px 16px;
            background:#0b66c3;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
            margin-bottom:15px;
            font-size:14px;
        ">
    + Add Entry
</button>

<div class="meta"><span id="status">Loading entries…</span></div>

<table>
<thead>
<tr>
  <th class="col-date">DATE</th>
  <th class="col-ref">REF</th>
  <th class="col-account">ACCOUNT TITLE</th>
  <th class="col-debit">DEBIT</th>
  <th class="col-credit">CREDIT</th>
</tr>
</thead>
<tbody id="entriesBody"></tbody>
</table>

</div>

<script>
function openModal(pageName) {
    document.getElementById("modalFrame").src = pageName;
    document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
    document.getElementById("modalFrame").src = "";
}

/* MAIN VIEWER LOGIC */
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwunmdcdGORboCfvao3KOeZinAc5JRDSYiI8ghXO-xW709kLdZ9Ab_om3Qd-444pNlK/exec";
const STATUS_EL = document.getElementById('status');
const TBODY = document.getElementById('entriesBody');

function fmt(num){
    if(num==null||num==='')return'';
    const n=Number(num);
    if(isNaN(n))return'';
    return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function safeStr(v){ return v==null?"":String(v); }

/* ⭐ FIXED normalizeLines — prevents double account codes ⭐ */
function normalizeLines(lines){
    if(!Array.isArray(lines)) return [];

    return lines.map(item => {
        if(Array.isArray(item))
            return { title: safeStr(item[0]), amount: Number(item[1] || 0) };

        if(typeof item === 'object'){
            const amount = Number(item.amount || item.value || item.amt || 0);
            const original = safeStr(item.title || "");
            const combined = `${item.accountName}`;

            if(item.accountCode && item.accountName){
                // Prevent double-code issues
                return {
                    title: original.includes(item.accountCode) ? original : combined,
                    amount
                };
            }

            const title = item.accountName || item.account || item.accountTitle || item.name || item.accountCode || "";
            return { title: safeStr(title), amount };
        }

        return { title: safeStr(item), amount: 0 };
    }).filter(l => l.title || l.amount);
}

function escapeHtml(t){
    return String(t)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
}

function renderEntry(entry){
    const date = formatDMY(entry.date);
    const ref=safeStr(entry.ref);
    const desc=safeStr(entry.description||"");
    const debit=normalizeLines(entry.debitEntries);
    const credit=normalizeLines(entry.creditEntries);
    const rows=[];

    if(debit.length>0){
        rows.push({
            date, ref,
            accountHtml:`<div class='account-title'>${escapeHtml(debit[0].title)}</div>`,
            debit:fmt(debit[0].amount), credit:""
        });

        for(let i=1;i<debit.length;i++)
            rows.push({
                date:"", ref:"",
                accountHtml:`<div class='indent'>${escapeHtml(debit[i].title)}</div>`,
                debit:fmt(debit[i].amount), credit:""
            });
    }

    credit.forEach(c=>{
        rows.push({
            date:"", ref:"",
            accountHtml:`<div class='indent'>${escapeHtml(c.title)}</div>`,
            debit:"", credit:fmt(c.amount)
        });
    });

    if(desc){
        rows.push({
            date:"", ref:"",
            accountHtml:`<div class='description'>${escapeHtml(desc)}</div>`,
            debit:"", credit:""
        });
    }

    return rows;
}

function displayEntries(entries){
    TBODY.innerHTML="";

    if(!Array.isArray(entries)||entries.length===0){
        STATUS_EL.innerHTML='<span class="error">No journal entries found.</span>';
        return;
    }

    STATUS_EL.innerHTML=`<span class='loading'>Showing ${entries.length} entries</span>`;

    entries.forEach(entry=>{
        const rowObjects=renderEntry(entry);
        rowObjects.forEach(r=>{
            const tr=document.createElement('tr');
            tr.innerHTML = `
                <td class='col-date'>${r.date}</td>
                <td class='col-ref'>${r.ref}</td>
                <td class='col-account'>${r.accountHtml}</td>
                <td class='col-debit'>${r.debit}</td>
                <td class='col-credit'>${r.credit}</td>`;
            TBODY.appendChild(tr);
        });

        const spacer=document.createElement('tr');
        spacer.className='spacer-row';
        spacer.innerHTML="<td colspan='5'>&nbsp;</td>";
        TBODY.appendChild(spacer);
    });
}

async function loadEntries(){
    try{
        STATUS_EL.textContent='Loading entries…';
        const url = new URL(WEBAPP_URL);
        url.searchParams.set('action','getEntries');

        const res=await fetch(url,{method:'GET',cache:'no-cache'});
        if(!res.ok) throw new Error('HTTP '+res.status);

        const data=await res.json();
        displayEntries(data);
    } catch(err){
        STATUS_EL.innerHTML=`<span class='error'>Error: ${escapeHtml(err.message)}</span>`;
    }
}

function formatDMY(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr);

    if (isNaN(d)) return dateStr; // fallback if invalid

    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = d.getFullYear();

    return `${day}-${month}-${year}`;
}

loadEntries();
</script>

</body>
</html>
