<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>New Project Entry</title>

<style>
body { font-family: Arial, sans-serif; background: orange; padding: 20px; }
.container { margin: auto; background: #FFD54F; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

label { display: block; margin-top: 10px; font-weight: 600; }
input, textarea, select, button { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border-radius: 5px;}

button { background: #007bff; color: #fff; border: 0; border-radius: 6px; padding: 12px; cursor: pointer; }

.msg { margin-top: 12px; font-weight: 700; text-align: center; }

/* Project Header */
.project-header { text-align: left; margin-bottom: 20px; }

#projectNo {
  font-size: 2em;
  border: none;
  font-weight: bold;
  background: transparent;
  color: red;
  display: block;
  margin-bottom: 4px;
  width: auto;
}

#date { width: auto; text-align: right; display: block; }

/* Buttons */
.button-group {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  width: 30%;
}

.button-group button {
  flex: 1;
  padding: 12px;
  font-size: 1em;
  border-radius: 6px;
  cursor: pointer;
}

#saveBtn { background: green; }
#closeBtn { background: red; }
</style>
</head>

<body>
<div class="container">

  <div class="project-header">
    <input id="projectNo" readonly />
    <input type="date" id="date" required />
  </div>  <!-- FIXED: missing closing div -->

  <label>Client ID</label>
  <input id="cid" />

  <label>Customer</label>
  <input id="customer" />

  <label>Reference</label>
  <input id="reference" />

  <label>Description</label>
  <textarea id="description"></textarea>

  <label>Location</label>
  <input id="location" />

  <label>Frequency</label>
  <select id="frequency">
    <option value="" selected> - Select Frequency -</option>
    <option value="Annual">Annual</option>
    <option value="Semi-Annual">Semi-Annual</option>
    <option value="Quarterly">Quarterly</option>
  </select>

  <label>Amount</label>
  <input id="amount" type="number" />

  <label>Status</label>
  <select id="status">
    <option value="Ongoing" selected>Ongoing</option>
    <option value="Completed">Completed</option>
    <option value="On Hold">On Hold</option>
  </select>

  <label>Attach PDF</label>
  <input type="file" id="pcPDF" accept="application/pdf">

  <div class="button-group">
    <button id="saveBtn">Save</button>
  </div>

  <div id="msg" class="msg"></div>

</div> <!-- container -->

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxulmLTZykrhNBm3U7PymbtvgZtr19F3pIDIRMDopERzHZpbJUYjg2HzAMrwZs3jghrkw/exec';

// Convert file to Base64
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Fetch next project number
async function getProjectNo() {
  const msg = document.getElementById('msg');
  try {
    const res = await fetch(`${WEB_APP_URL}?action=getProjectNo`);
    const data = await res.json();
    document.getElementById('projectNo').value = data.projectNo || '';
    msg.textContent = '';
  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = 'Failed to fetch project number.';
  }
}

// Save project
async function saveProject() {
  const msg = document.getElementById('msg');
  msg.style.color = 'blue';
  msg.textContent = 'Saving...';

  const projectNo = document.getElementById('projectNo').value;
  const date = document.getElementById('date').value.trim();
  const cid = document.getElementById('cid').value.trim();
  const customer = document.getElementById('customer').value.trim();
  const reference = document.getElementById('reference').value.trim();
  const description = document.getElementById('description').value.trim();
  const location = document.getElementById('location').value.trim();
  const frequency = document.getElementById('frequency').value;
  const amount = document.getElementById('amount').value;
  const status = document.getElementById('status').value;
  const pdfFile = document.getElementById('pcPDF').files[0];

  // Validation
  if (!date || !customer || !description) {
    msg.style.color = 'red';
    msg.textContent = 'Please fill in: Date, Customer, and Description.';
    return;
  }

  let pdfBase64 = '';
  if (pdfFile) {
    pdfBase64 = await fileToBase64(pdfFile);
  }

  const payload = {
    date, cid, customer, reference, description,
    location, frequency, amount, status, pdfBase64
  };

  const form = new URLSearchParams();
  form.append('payload', JSON.stringify(payload));

  try {
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: form.toString()
    });

    const result = await res.json();

    if (result.status === 'success') {
      msg.style.color = 'green';
      msg.textContent = `Saved — Project No: ${result.projectNo}`;

      document.querySelectorAll('#customer, #reference, #description, #location, #frequency, #amount, #status, #pcPDF')
        .forEach(el => el.value = '');

      await getProjectNo();
    } else {
      msg.style.color = 'red';
      msg.textContent = 'Error: ' + (result.message || 'Unknown error');
    }

  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = 'Failed to save project.';
  }
}



document.getElementById('saveBtn').addEventListener('click', saveProject);


// Load first project number
getProjectNo();
</script>

</body>
</html>
