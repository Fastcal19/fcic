<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Employee Leave Page</title>
<style>
/* (unchanged CSS, retained exactly as provided) */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  background: gray;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

/* ✅ Main container */
.main-container {
  flex: 1;
  background: linear-gradient(10deg, gold, orangered);
  margin: 10px;
  padding: 20px;
  border-radius: 12px;
  width: calc(100% - 20px);
  min-height: calc(100vh - 20px);
  max-height: 100%;
  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  overflow-y: auto;
}

.cards {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
  flex-wrap: nowrap;
}

.card {
  flex: 1 1 0;
  min-width: 0;
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  text-align: center;
}

.card h2 { margin: 0 0 10px 0; font-size: 16px; color: #555; }
.card .value { font-size: 28px; font-weight: bold; }

button {
  padding: 10px 20px;
  margin-bottom: 10px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  align-self: flex-start;
  width: auto;
}

button.new { background: #007bff; color: white; }
button.edit { background: #28a745; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  font-size: 14px;
  vertical-align: middle;
}

th { background: #e9ecef; text-align: left; }
.t-left { text-align: left; }
.t-center { text-align: center; }

.modal-bg {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 320px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.modal input, .modal textarea {
  width: 100%;
  margin-bottom: 10px;
  padding: 8px;
  font-size: 14px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

.close-btn { background: #dc3545; color: white; }

#eid, #name { display: none; }

#toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  padding: 12px 16px;
  border-radius: 6px;
  color: white;
  display: none;
  z-index: 2000;
  font-weight: 600;
}

#toast.success { background: #2e8b57; }
#toast.error { background: #c0392b; }
</style>
</head>
<body>

<div class="main-container">
  <div class="cards">
    <div class="card"><h2>Credits</h2><div class="value" id="totalCredits">10</div></div>
    <div class="card"><h2>Used</h2><div class="value" id="leaveApplied">0</div></div>
    <div class="card"><h2>Remaining</h2><div class="value" id="remainingLeave">10</div></div>
  </div>

  <button class="new" onclick="openModal()">Apply</button>

  <table>
    <thead>
      <tr>
        <th class="t-center">Date Filed</th>
        <th class="t-left">Reason</th>
        <th class="t-center">From</th>
        <th class="t-center">To</th>
        <th class="t-center"># of Days</th>
        <th class="t-center">Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Apply Leave</h3>
    <input type="text" id="eid" readonly>
    <input type="text" id="name" readonly>
    <input type="text" id="email" readonly>
    <input type="text" id="dateFiled" readonly>
    <textarea id="reason" placeholder="Reason"></textarea>
    <input type="date" id="fromDate">
    <input type="date" id="toDate">
    <input type="number" id="days" min="1" placeholder="Number of days">
    <div class="actions">
      <button class="close-btn" onclick="closeModal()">Close</button>
      <button id="cancelBtn" class="edit" onclick="cancelLeave()" style="display:none;">Cancel</button>
      <button id="submitBtn" class="new" onclick="submitLeave()" disabled>Submit</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE="https://script.google.com/macros/s/AKfycbwX5yUXERNNh4znf04N7a_4lxOFkFyU6CVriBG0jpVcxjYrRdt6rtRN8XtYl02aQmgh/exec";

/* ✅ Load local user data */
let applicantName = localStorage.getItem('full');
let applicantEID = localStorage.getItem('eid');
let applicantEmail = localStorage.getItem('email');

if(!applicantName){ applicantName = prompt("Enter your name:"); localStorage.setItem('full', applicantName); }
if(!applicantEID){ applicantEID = prompt("Enter your Employee ID:"); localStorage.setItem('eid', applicantEID); }
if(!applicantEmail){ applicantEmail = prompt("Enter your Email:"); localStorage.setItem('email', applicantEmail); }

const modalBg=document.getElementById('modalBg');
const submitBtn=document.getElementById('submitBtn');
const cancelBtn=document.getElementById('cancelBtn');
const requiredIds=['dateFiled','reason','fromDate','toDate','days'];
let currentLID=null;
let currentRow=null;

function pad(n){ return String(n).padStart(2,'0'); }
function formatDateOnly(v){ const d=new Date(v); return isNaN(d)?v: `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`; }
function formatDateTime(v){ const d=new Date(v); if(isNaN(d)) return v; let h=d.getHours(),ampm=h>=12?'PM':'AM'; h=h%12||12; return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()} ${pad(h)}:${pad(d.getMinutes())} ${ampm}`;}

function openModal(){
  currentLID=null;
  document.getElementById('eid').style.display="none";
  document.getElementById('name').style.display="none";
  document.getElementById('email').style.display="none";
  document.getElementById('eid').value=applicantEID;
  document.getElementById('name').value=applicantName;
  document.getElementById('email').value=applicantEmail;
  document.getElementById('dateFiled').value=formatDateTime(new Date());
  ['reason','fromDate','toDate','days'].forEach(id=>document.getElementById(id).value="");
  cancelBtn.style.display="none";
  refreshSaveState();
  modalBg.style.display='flex';
}

function openEditModal(record,index){
  currentLID=record.LID;
  currentRow=document.querySelector(`tbody tr[data-index='${index}']`);
  document.getElementById('eid').value=record.EID;
  document.getElementById('name').value=record.Name;
  document.getElementById('email').value=record.Email;
  document.getElementById('dateFiled').value=formatDateTime(record["Date Filed"]);
  document.getElementById('reason').value=record.Reason;
  document.getElementById('fromDate').value=record.From;
  document.getElementById('toDate').value=record.To;
  document.getElementById('days').value=record["# of Days"];
  cancelBtn.style.display=(record.Status?.toLowerCase()==="pending")?"inline-block":"none";
  refreshSaveState();
  modalBg.style.display='flex';
}

function closeModal(){ modalBg.style.display='none'; }
function validateForm(){ return requiredIds.every(id=>document.getElementById(id).value.trim()!==""); }
function refreshSaveState(){ submitBtn.disabled=!validateForm(); }
requiredIds.forEach(id=>document.getElementById(id).addEventListener('input',refreshSaveState));

/* ✅ 1. LOAD CREDITS FROM EMPLOYEE SHEET USING EID */
async function loadEmployeeCredits(){
  try{
    const res=await fetch(API_BASE+"?action=getEmployees");
    const employees=await res.json();
    const myEID=(localStorage.getItem("eid")||"").trim().replace(/^0+/,"");

    const me=employees.find(e =>
      String(e.EID || e["Employee ID"] || "").trim().replace(/^0+/,"") === myEID
    );

    if(me){
      const credits=parseFloat(me["Leave Credits"]||0);
      document.getElementById("totalCredits").textContent=credits;

      const used=parseFloat(document.getElementById("leaveApplied").textContent)||0;
      document.getElementById("remainingLeave").textContent=Math.max(0, credits - used);
    }
  }catch(err){
    console.error("Error loading credits:",err);
    showToast("Error loading credits","error");
  }
}

/* ✅ 2. LOAD LEAVES — SORT + SAVE TO LOCAL STORAGE */
async function loadLeaves(){
  const tbody=document.querySelector("tbody");
  tbody.innerHTML=`<tr><td colspan="6">Loading...</td></tr>`;
  try{
    const res=await fetch(API_BASE+"?action=getLeaves");
    const data=await res.json();

    const myEID=(localStorage.getItem("eid")||"").trim().replace(/^0+/,"");
    const myLeaves=data.filter(r => 
      String(r["EID"]||"").trim().replace(/^0+/,"") === myEID
    );

    const approved=myLeaves.filter(r=>String(r["Status"]||"").toLowerCase()==="approved");
    const usedDays=approved.reduce((sum,r)=>sum+(parseFloat(r["# of Days"]||0)||0),0);

    document.getElementById("leaveApplied").textContent=usedDays;

    /* ✅ Sort by Date Filed (desc) */
    myLeaves.sort((a, b) => new Date(b["Date Filed"]) - new Date(a["Date Filed"]));

    /* ✅ SAVE LEAVE LIST TO LOCAL STORAGE */
    localStorage.setItem("myLeaves", JSON.stringify(myLeaves));

    tbody.innerHTML=myLeaves.map((r,index)=>{
      const st=(r["Status"]||"").toLowerCase();
      const color = st==="approved"?"green":st==="disapproved"?"red":st==="pending"?"blue":st==="cancelled"?"orange":"black";
      return `
      <tr data-index="${index}" style="cursor:pointer">
        <td class="t-center">${formatDateTime(r["Date Filed"])}</td>
        <td class="t-left">${r.Reason||""}</td>
        <td class="t-center">${formatDateOnly(r.From)}</td>
        <td class="t-center">${formatDateOnly(r.To)}</td>
        <td class="t-center">${r["# of Days"]||""}</td>
        <td class="t-center"><span style="color:${color};font-weight:700">${r.Status}</span></td>
      </tr>`;
    }).join("");

    document.querySelectorAll("tbody tr[data-index]").forEach(tr=>{
      tr.addEventListener("click",()=>openEditModal(myLeaves[tr.dataset.index], tr.dataset.index));
    });

  }catch(err){
    console.error(err);
    tbody.innerHTML=`<tr><td colspan="6">Error loading data</td></tr>`;
  }
}

async function submitLeave(){
  if(!validateForm()) return;

  const payload={
    method:"submitLeave",
    eid:localStorage.getItem("eid"),
    name:localStorage.getItem("full"),
    email:localStorage.getItem("email"),
    dateFiled:document.getElementById('dateFiled').value,
    reason:document.getElementById('reason').value,
    fromDate:document.getElementById('fromDate').value,
    toDate:document.getElementById('toDate').value,
    days:document.getElementById('days').value
  };

  const res=await fetch(API_BASE, {
    method:"POST",
    headers:{ "Content-Type":"application/x-www-form-urlencoded" },
    body:"payload="+encodeURIComponent(JSON.stringify(payload))
  });

  const data=await res.json();
  if(data.status==="success"){
    showToast("Leave submitted","success");
    closeModal();
    await loadLeaves();
    await loadEmployeeCredits();
  } else {
    showToast("Failed: "+data.message,"error");
  }
}

async function cancelLeave(){
  if(!currentLID || !currentRow) return;
  cancelBtn.disabled=true;

  const payload={ method:"updateLeave", LID:currentLID, status:"Cancelled" };

  try{
    const body='payload='+encodeURIComponent(JSON.stringify(payload));
    const res=await fetch(API_BASE,{
      method:"POST",
      headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
      body
    });

    const text=await res.text();
    let data; try{ data=JSON.parse(text); }catch{ data={status:"error"} }

    if(res.ok && (data.status==="success")){
      showToast("Leave cancelled","success");
      closeModal();
      await loadLeaves();
      await loadEmployeeCredits();
    }else{
      showToast("Failed: "+(data.message||"Unknown error"),"error");
      cancelBtn.disabled=false;
    }
  }catch(err){
    console.error(err);
    showToast("Network error","error");
    cancelBtn.disabled=false;
  }
}

function showToast(msg,type){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.className=type;
  t.style.display='block';
  setTimeout(()=>t.style.display='none',3000);
}

/* ✅ 3. STARTUP SEQUENCE */
(async()=>{
  await loadLeaves();
  await loadEmployeeCredits();
})();
</script>
</body>
</html>
