<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATTENDANCE</title>
<style>
body {
    font-family: "Times New Roman", serif;
    background: #fff;
    margin: 20px;
}
/* ===== TABS ===== */
.tabs {
    display: flex;
    border-bottom: 2px solid #0b5c7d;
    margin-bottom: 15px;
}
.tab {
    padding: 10px 20px;
    cursor: pointer;
    border: 1px solid #0b5c7d;
    border-bottom: none;
    background: #f5f5f5;
    margin-right: 5px;
}
.tab.active {
    background: #0b5c7d;
    color: #fff;
    font-weight: bold;
}
.tab-content { display: none; }
.tab-content.active { display: block; }
/* ===== TABLES ===== */
.container { display: flex; gap: 30px; }
.left { width: 20%; }
.right { width: 80%; }
.info-table, .attendance-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 15px;
}
.info-table td { padding: 3px 5px; text-align: left; }
.attendance-table th, .attendance-table td {
    border: 1px solid #000;
    padding: 4px;
    font-size: 14px;
    text-align: center;
}
.amount { text-align: right; }
.rate-section { display: flex; justify-content: space-between; margin-top: 20px; }
.rate-box, .time-summary { width: 48%; font-size: 14px; }
.rate-box h4, .time-summary h4 { text-align: center; margin-bottom: 5px; }
.buttons { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
.buttons button { background: #0b5c7d; color: #fff; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; }
.num { text-align: right; }
.actions { text-align: center; white-space: nowrap; }
.actions button { padding: 3px 8px; margin: 0 2px; font-size: 12px; cursor: pointer; }
input[type="date"] { width: 48%; padding: 3px; margin-bottom: 5px; }
/* ===== EMPLOYEE LIST ===== */
#employeeList button {
    display: block;
    width: 100%;
    margin-bottom: 5px;
    padding: 6px 8px;
    text-align: left;              /* ✅ align left */
    background: #f5f5f5;
    border: 1px solid #ccc;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
}

/* Hover effect */
#employeeList button:hover {
    background: gray;
    color: #fff;
}

/* Active (clicked) employee */
#employeeList button.active {
    background: orange;
    color: #fff;
    font-weight: bold;
}

/* Weekend Highlight */
.saturday {
    background-color: lightsalmon;   /* light blue */
}

.sunday {
    background-color: lightsalmon;   /* light red */
}

table {
    table-layout: fixed;
}

#attendanceBody td, 
thead th {
    word-wrap: break-word;
}

/* Center align specific attendance columns */
#attendanceBody td:nth-child(2),
#attendanceBody td:nth-child(3),
#attendanceBody td:nth-child(4),
#attendanceBody td:nth-child(5),
#attendanceBody td:nth-child(6),
.attendance-table th:nth-child(2),
.attendance-table th:nth-child(3),
.attendance-table th:nth-child(4),
.attendance-table th:nth-child(5),
.attendance-table th:nth-child(6) {
    text-align: center;
}

</style>
<script>
function openTab(tabId) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    document.getElementById(tabId + '-btn').classList.add('active');
}
</script>
</head>
<body>

<!-- ===== TAB HEADERS ===== -->
<div class="tab-content active" id="payroll">
<div class="container">
  <div class="left">
        <table class="info-table">
            <tr>
              <td>YEAR:</td>
              <td>
                <select id="yearSelect"></select>
              </td>
            </tr>
            <tr>
              <td>MONTH:</td>
              <td>
                <select id="monthSelect"></select>
              </td>
            </tr>
            <tr><td> </td><td></td></tr>
            <tr><td> </td><td></td></tr>
            <tr>
  <td colspan="2">
    <strong>EMPLOYEES:</strong>
    <div id="employeeList"></div>
  </td>
</tr>

        </table>
    </div>
    <div class="right">
        <table border="1" width="100%" style="table-layout: fixed;">
  <thead>
    <tr>
      <th style="width:25%;">Date</th>
      <th style="width:10%;">Time In</th>
      <th style="width:10%;">Time Out</th>
      <th style="width:10%;">No of Hours</th>
      <th style="width:10%;">Late</th>
      <th style="width:10%;">Undertime</th>
      <th style="width:25%;">Remarks</th>
    </tr>
  </thead>
  <tbody id="attendanceBody"></tbody>
</table>

<script>

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxGCpauRlOwZRV-Isc5nKnfQ8rsR9aBXC-jsgR17jPJ0nNIDU7E2aHTsQXkidYZuBAFA/exec";

let selectedEmployee = null; // ✅ global

async function loadAttendance(en) {

  const year = parseInt(document.getElementById("yearSelect").value);
  const month = parseInt(document.getElementById("monthSelect").value);

  const url = `${WEB_APP_URL}?en=${en}&year=${year}&month=${month}`;

  const res = await fetch(url);
  const data = await res.json();

  const tbody = document.getElementById("attendanceBody");
  tbody.innerHTML = "";

  // ✅ Convert API data into a map (by date)
  const attendanceMap = {};

  data.forEach(row => {
    const dateKey = new Date(row.date).toISOString().split("T")[0];
    attendanceMap[dateKey] = row;
  });

  // ✅ Get number of days in selected month
  const daysInMonth = new Date(year, month, 0).getDate();

  for (let day = 1; day <= daysInMonth; day++) {

  const currentDate = new Date(year, month - 1, day);
  const dateKey = currentDate.toISOString().split("T")[0];

  const record = attendanceMap[dateKey] || {};

  const dayOfWeek = currentDate.getDay(); 
  // 0 = Sunday, 6 = Saturday

  let rowClass = "";
  if (dayOfWeek === 0) rowClass = "sunday";
  if (dayOfWeek === 6) rowClass = "saturday";

  tbody.innerHTML += `
    <tr class="${rowClass}">
      <td>${currentDate.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      })}</td>
      <td>${formatTime(record.timeIn)}</td>
      <td>${formatTime(record.timeOut)}</td>
      ${(() => {
  const timeInDate = parseTime(record.timeIn);
  const timeOutDate = parseTime(record.timeOut);

  const hours = computeHours(timeInDate, timeOutDate);
  const late = computeLate(timeInDate);

  return `
    <td>${hours}</td>
    <td>${late}</td>
  `;
})()}

      <td>${record.undertime || ""}</td>
      <td>${record.remarks || ""}</td>
    </tr>
    `;
  }
}

async function loadEmployees() {

  const res = await fetch(`${WEB_APP_URL}?list=employees`);
  const employees = await res.json();

  const container = document.getElementById("employeeList");
  container.innerHTML = "";

  employees.forEach(emp => {

    const btn = document.createElement("button");
    btn.textContent = `${emp.en} - ${emp.name}`;

    btn.onclick = () => {

      // Remove active from all buttons
      document.querySelectorAll("#employeeList button")
        .forEach(b => b.classList.remove("active"));

      // Add active to clicked button
      btn.classList.add("active");

      selectedEmployee = emp.en;
      loadAttendance(emp.en);
    };

    container.appendChild(btn);
  });
}

document.addEventListener("DOMContentLoaded", function () {

  const yearSelect = document.getElementById("yearSelect");
  const monthSelect = document.getElementById("monthSelect");

  const currentYear = new Date().getFullYear();
  const currentMonth = new Date().getMonth();

  // Generate Years
  for (let i = 4; i >= 0; i--) {
    const year = currentYear - i;
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    if (year === currentYear) option.selected = true;
    yearSelect.appendChild(option);
  }

  // Generate Months
  const months = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
  ];

  months.forEach((month, index) => {
    const option = document.createElement("option");
    option.value = index + 1;
    option.textContent = month;
    if (index === currentMonth) option.selected = true;
    monthSelect.appendChild(option);
  });

  // ✅ Reload attendance when month/year changes
  yearSelect.addEventListener("change", () => {
    if (selectedEmployee) loadAttendance(selectedEmployee);
  });

  monthSelect.addEventListener("change", () => {
    if (selectedEmployee) loadAttendance(selectedEmployee);
  });

  loadEmployees();
});

function formatTime(timeStr) {
  if (!timeStr) return "";

  const date = new Date(timeStr);

  let hours = date.getHours();
  const minutes = String(date.getMinutes()).padStart(2, "0");

  const ampm = hours >= 12 ? "PM" : "AM";

  hours = hours % 12;
  hours = hours ? hours : 12; // convert 0 to 12

  return `${String(hours).padStart(2, "0")}:${minutes}${ampm}`;
}

function parseTime(timeStr) {
  if (!timeStr) return null;
  return new Date(timeStr);
}

function computeHours(timeIn, timeOut) {
  if (!timeIn || !timeOut) return "";

  let diffMs = timeOut - timeIn;

  // Lunch break window
  const lunchStart = new Date(timeIn);
  lunchStart.setHours(12, 0, 0, 0);

  const lunchEnd = new Date(timeIn);
  lunchEnd.setHours(13, 0, 0, 0);

  // Deduct overlap with lunch
  const overlapStart = Math.max(timeIn, lunchStart);
  const overlapEnd = Math.min(timeOut, lunchEnd);

  if (overlapEnd > overlapStart) {
    diffMs -= (overlapEnd - overlapStart);
  }

  const totalMinutes = Math.floor(diffMs / (1000 * 60));

  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;

  return `${hours}h ${minutes}m`;
}

function computeLate(timeIn) {
  if (!timeIn) return "";

  // 8:00 official start
  const start = new Date(timeIn);
  start.setHours(8, 0, 0, 0);

  // Grace cutoff 8:15
  const grace = new Date(timeIn);
  grace.setHours(8, 15, 0, 0);

  // Within grace → no late
  if (timeIn <= grace) return "";

  // After grace → compute from 8:00
  const diffMin = Math.floor((timeIn - start) / (1000 * 60));

  return diffMin + " min";
}

function computeUndertime(timeOut) {
  if (!timeOut) return "";

  const end = new Date(timeOut);
  end.setHours(17, 0, 0, 0); // 5:00 PM

  if (timeOut >= end) return "";

  const diffMin = Math.floor((end - timeOut) / (1000 * 60));

  const hours = Math.floor(diffMin / 60);
  const minutes = diffMin % 60;

  if (hours > 0) {
    return `${hours}h ${minutes}m`;
  } else {
    return `${minutes} min`;
  }
}



</script>


</body>
</html>
