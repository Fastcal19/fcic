<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Client & Supplier Profile</title>

  <style>
    body { 
      font-family: Arial; 
      background: linear-gradient(100deg, orange, gold, orangered);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      padding: 25px 30px;
      margin: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 { margin-top: 0; }
    label { font-weight: bold; }
    h3 { margin-top: 30px; }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #999;
      margin-top: 4px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 20px;
    }
    .row > div { flex: 1; }

    .dynamic-box {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
      background: #fafafa;
      border-radius: 6px;
    }

    .remove-btn {
      display:none;
      background:#d9534f;
      color:#fff;
      padding:5px 10px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      margin-top:10px;
    }

    .add-btn {
      display:none;
      background:#0275d8;
      color:white;
      padding: 7px 12px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      margin-top:5px;
      width: 200px;
    }

    .attachments-box {
      border: 2px dashed #999;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
      background: #fafafa;
    }

    #msg { margin-top: 15px; font-weight: bold; }

    .empty-msg {
      color:#888;
      margin-top:5px;
      font-style:italic;
      display:none;
    }

    /* NEW: hide file inputs by default */
    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>
<div class="container">

<h2>Client & Supplier Profile</h2>

<!-- ACTION BUTTONS -->
<div style="display:flex; gap:10px; margin-bottom:15px;">
  <button id="editBtn" onclick="enableEdit()" 
    style="padding:10px 18px; background:#0275d8; color:white; border:none; border-radius:6px; cursor:pointer;">
    Edit
  </button>

  <button id="updateBtn" onclick="submitSupplier()" 
    style="display:none; padding:10px 18px; background:#28a745; color:white; border:none; border-radius:6px; cursor:pointer;">
    Update
  </button>

  <button id="closeBtn" onclick="disableEdit()" 
    style="display:none; padding:10px 18px; background:#6c757d; color:white; border:none; border-radius:6px; cursor:pointer;">
    Close
  </button>
</div>

<label>Supplier ID</label>
<input id="supplierID" readonly>

<div class="row">
  <div>
    <label>TIN</label>
    <input id="tin">
  </div>

  <div>
    <label>VAT Type</label>
    <select id="vatType">
      <option value="">-- Select VAT Type --</option>
      <option>VAT Registered</option>
      <option>Non-VAT</option>
      <option>Exempt</option>
    </select>
  </div>
</div>

<div class="row">
  <div>
    <label>Registration Type</label>
    <select id="regType">
      <option value="">-- Select Registration Type --</option>
      <option>DTI</option>
      <option>SEC</option>
      <option>Cooperative</option>
    </select>
  </div>

  <div>
    <label>Registration Number</label>
    <input id="regNo">
  </div>

  <div>
    <label>Date Issued</label>
    <input type="date" id="dateIssued">
  </div>
</div>

<label>Business Name</label>
<input id="bname">

<div class="row">
 <div>
    <label>Company Type</label>
    <select id="cType">
      <option value="">-- Select Company Type --</option>
      <option>Client</option>
      <option>Supplier</option>
      <option>Client & Supplier</option>
    </select>
  </div>

  <div>
    <label>Payment Terms</label>
    <input id="terms">
  </div>
</div>

<div class="row">
  <div>
    <label>Type</label>
    <select id="supplierType">
      <option value="">-- Select Type --</option>
      <option>Individual</option>
      <option>Partnership</option>
      <option>Corporation</option>
    </select>
  </div>

  <div>
    <label>Category</label>
    <select id="category">
      <option value="">-- Select Category --</option>
      <option>Goods</option>
      <option>Services</option>
      <option>Goods & Services</option>
    </select>
  </div>
</div>

<label>Address</label>
<textarea id="address" rows="2"></textarea>

<label>Nature of Business</label>
<input id="nature">

<!-- CONTACT PERSONS -->
<h3>Contact Persons</h3>
<div id="contactList"></div>
<div id="noContactMsg" class="empty-msg">No Contact Added</div>
<button class="add-btn" id="addContactBtn" onclick="addContact()">+ Add Contact</button>

<!-- BANK ACCOUNTS -->
<h3>Bank Accounts</h3>
<div id="bankList"></div>
<div id="noBankMsg" class="empty-msg">No Bank Account Added</div>
<button class="add-btn" id="addBankBtn" onclick="addBank()">+ Add Bank</button>

<h3>Attachments</h3>
<div class="attachments-box">
  <label>DTI / SEC</label>
  <input type="file" id="dtiSec">

  <label>Business Permit</label>
  <input type="file" id="permit">

  <label>BIR Certificate</label>
  <input type="file" id="bir">

  <label>Client List / Company Profile</label>
  <input type="file" id="clientList">
</div>

<div id="msg"></div>

</div>

<script>

const WEBAPP_URL =
  "https://script.google.com/macros/s/AKfycbwd_QA3xMJNBYJLP2w9NT38BxeIEQD1TBPYPOBIctyYeWtwJ9N408flzJ20ztfmkMRr7g/exec";

const urlParams = new URLSearchParams(window.location.search);
const supplierID_param = urlParams.get("id");

window.onload = () => {
    if (supplierID_param) loadSupplier(supplierID_param);
    setReadOnlyMode(true);
};

/* ============================================
   READ ONLY MODE CONTROL
============================================ */
function setReadOnlyMode(isReadOnly) {
    const inputs = document.querySelectorAll("input, select, textarea");

    inputs.forEach(inp => {
        if (inp.id === "supplierID") return;
        inp.readOnly = isReadOnly;
        inp.disabled = isReadOnly;
    });

    document.querySelectorAll(".remove-btn").forEach(btn => btn.style.display = isReadOnly ? "none" : "block");
    document.querySelectorAll(".add-btn").forEach(btn => btn.style.display = isReadOnly ? "none" : "inline-block");

    // previews will auto show/hide via enableEdit/disableEdit
}

function enableEdit() {
    setReadOnlyMode(false);

    // SHOW file inputs
    document.querySelectorAll('input[type="file"]').forEach(f => {
        f.style.display = "block";
    });

    editBtn.style.display = "none";
    updateBtn.style.display = "inline-block";
    closeBtn.style.display = "inline-block";
}

function disableEdit() {
    setReadOnlyMode(true);

    // HIDE file inputs
    document.querySelectorAll('input[type="file"]').forEach(f => {
        f.style.display = "none";
    });

    updateBtn.style.display = "none";
    closeBtn.style.display = "none";
    editBtn.style.display = "inline-block";

    if (supplierID_param) loadSupplier(supplierID_param);
}

/* ============================================
   LOAD SUPPLIER
============================================ */
async function loadSupplier(id) {
    msg.innerHTML = "Loading...";

    const res = await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getSupplierByID", supplierID: id })
    });

    const data = await res.json();

    if (!data || data.error) {
        msg.innerHTML = "<span style='color:red'>Supplier not found</span>";
        return;
    }

    fillForm(data);
    msg.innerHTML = "";
}

function fillForm(d) {
    supplierID.value = d.supplierID;
    tin.value = d.tin || "";
    vatType.value = d.vatType || "";
    regType.value = d.regType || "";
    regNo.value = d.regNo || "";
    dateIssued.value = d.dateIssued || "";
    bname.value = d.bname || "";
    cType.value = d.cType || "";
    terms.value = d.terms || "";
    supplierType.value = d.supplierType || "";
    category.value = d.category || "";
    address.value = d.address || "";
    nature.value = d.nature || "";

    /* Contacts */
    contactList.innerHTML = "";
    if (!d.contacts || d.contacts.length === 0) {
        noContactMsg.style.display = "block";
    } else {
        noContactMsg.style.display = "none";
        d.contacts.forEach(c => addContact(c));
    }

    /* Banks */
    bankList.innerHTML = "";
    if (!d.banks || d.banks.length === 0) {
        noBankMsg.style.display = "block";
    } else {
        noBankMsg.style.display = "none";
        d.banks.forEach(b => addBank(b));
    }

    showFilePreview("dtiSec", d.dtiSecFile);
    showFilePreview("permit", d.permitFile);
    showFilePreview("bir", d.bir2303File);
    showFilePreview("clientList", d.clientListFile);
}

/* ============================================
   FILE PREVIEW
============================================ */
function showFilePreview(fieldID, url) {
    const field = document.getElementById(fieldID);

    const nextDiv = field.nextElementSibling;
    if (nextDiv && nextDiv.classList.contains("file-preview")) nextDiv.remove();

    const div = document.createElement("div");
    div.className = "file-preview";
    div.style.marginTop = "4px";

    if (url) {
        div.innerHTML = `<a href="${url}" target="_blank" style="color:blue">View File</a>`;
        field.dataset.url = url;
    } else {
        div.textContent = "No file uploaded";
        div.style.color = "#888";
        div.style.fontStyle = "italic";
        field.dataset.url = "";
    }

    field.insertAdjacentElement("afterend", div);
}

/* ============================================
   CONTACTS
============================================ */
function addContact(data = {}) {
    const div = document.createElement("div");
    div.className = "dynamic-box contact-row";

    div.innerHTML = `
        <div class="row">
            <div><input class="c-name" placeholder="Name" value="${data.name || ""}"></div>
            <div><input class="c-position" placeholder="Position" value="${data.position || ""}"></div>
        </div>
        <div class="row">
            <div><input class="c-number" placeholder="Contact Number" value="${data.number || ""}"></div>
            <div><input class="c-email" placeholder="Email" value="${data.email || ""}"></div>
        </div>
        <button class="remove-btn" onclick="this.parentNode.remove(); checkEmptyContacts();">Remove</button>
    `;

    contactList.appendChild(div);
    noContactMsg.style.display = "none";
}

function checkEmptyContacts() {
    if (document.querySelectorAll(".contact-row").length === 0) {
        noContactMsg.style.display = "block";
    }
}

function collectContacts() {
    return [...document.querySelectorAll(".contact-row")].map(row => ({
        name: row.querySelector(".c-name").value,
        position: row.querySelector(".c-position").value,
        number: row.querySelector(".c-number").value,
        email: row.querySelector(".c-email").value
    }));
}

/* ============================================
   BANKS
============================================ */
function addBank(data = {}) {
    const div = document.createElement("div");
    div.className = "dynamic-box bank-row";

    div.innerHTML = `
        <div class="row">
            <div><input class="b-bankName" placeholder="Bank Name" value="${data.bankName || ""}"></div>
            <div><input class="b-accNo" placeholder="Account Number" value="${data.accNo || ""}"></div>
        </div>
        <div class="row">
            <div><input class="b-accName" placeholder="Account Name" value="${data.accName || ""}"></div>
        </div>
        <button class="remove-btn" onclick="this.parentNode.remove(); checkEmptyBanks();">Remove</button>
    `;

    bankList.appendChild(div);
    noBankMsg.style.display = "none";
}

function checkEmptyBanks() {
    if (document.querySelectorAll(".bank-row").length === 0) {
        noBankMsg.style.display = "block";
    }
}

function collectBanks() {
    return [...document.querySelectorAll(".bank-row")].map(row => ({
        bankName: row.querySelector(".b-bankName").value,
        accName: row.querySelector(".b-accName").value,
        accNo: row.querySelector(".b-accNo").value
    }));
}

/* ============================================
   FILE HELPERS
============================================ */
function fileToBase64(file) {
    return new Promise(resolve => {
        if (!file) return resolve("");
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.readAsDataURL(file);
    });
}

async function uploadFileIfChanged(input, existingURL) {
    const file = input.files[0];
    if (!file) return existingURL || "";

    const base64 = await fileToBase64(file);

    const res = await fetch(WEBAPP_URL, {
        method: "POST",
        body: JSON.stringify({
            action: "uploadFile",
            fileName: file.name,
            mimeType: file.type,
            fileData: base64
        })
    });

    const r = await res.json();
    return r.url || existingURL || "";
}

/* ============================================
   UPDATE
============================================ */
async function submitSupplier() {
    msg.innerHTML = "Saving...";

    const dtiURL = await uploadFileIfChanged(dtiSec, dtiSec.dataset.url);
    const permitURL = await uploadFileIfChanged(permit, permit.dataset.url);
    const birURL = await uploadFileIfChanged(bir, bir.dataset.url);
    const clientListURL = await uploadFileIfChanged(clientList, clientList.dataset.url);

    const data = {
        action: "updateSupplier",
        supplierID: supplierID.value,
        tin: tin.value,
        vatType: vatType.value,
        regType: regType.value,
        regNo: regNo.value,
        dateIssued: dateIssued.value,
        bname: bname.value,
        cType: cType.value,
        terms: terms.value,
        supplierType: supplierType.value,
        category: category.value,
        address: address.value,
        nature: nature.value,

        contacts: collectContacts(),
        banks: collectBanks(),

        dtiSecFile: dtiURL,
        permitFile: permitURL,
        bir2303File: birURL,
        clientListFile: clientListURL
    };

    const res = await fetch(WEBAPP_URL, { 
        method: "POST", 
        body: JSON.stringify(data)
    });

    const r = await res.json();
    msg.innerHTML = `<span style="color:green">${r.message}</span>`;

    disableEdit();
}

</script>

</body>
</html>
