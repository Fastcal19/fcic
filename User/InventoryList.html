<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory & Transactions</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
.tab-container { margin-top:20px; }
.tab-buttons { display:flex; gap:5px; }
.tab-buttons button { flex:1; padding:8px; cursor:pointer; border:none; background:#ccc; }
.tab-buttons button.active { background:#0d47a1; color:#fff; }

.tab-content { display:none; margin-top:10px; }
.tab-content.active { display:block; }

.gridview, #txn-table { width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; background:#fff8f0; }
.gridview th, #txn-table th { background:#f4a460; padding:10px; border:1px solid #ccc; }
.gridview td, #txn-table td { padding:6px; border:1px solid #ccc; text-align:center; font-size:12px; }
.gridview td.col-desc { text-align:left; }

button { font-size:11px; padding:4px 6px; cursor:pointer; border-radius: 5px;width: 80px;text-align: center;}
.btn-add { background:#4caf50; color:#fff; border:none; }
.btn-return { background:#2196f3; color:#fff; border:none; }
.btn-out { background:#f44336; color:#fff; border:none; }
.btn-new { background:#ff9800; color:#fff; border:none; }

.summary { margin-top:10px; padding:8px; background:#faf0e6; border:1px solid #f4a460; }
.summary span { margin-right:15px; font-weight:bold; }

.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.filters input, .filters select { padding:4px; }

#addItemForm { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
#addItemForm input { padding:4px; width:150px; }
</style>
</head>
<body>

<div class="tab-container">
  <div class="tab-buttons">
    <button class="active" onclick="openTab('inventory', event)">Inventory</button>
    <button onclick="openTab('history', event)">Transaction History</button>
  </div>

  <!-- Inventory Tab -->
  <div id="inventory" class="tab-content active">
    <div class="filters">
      <div>
        <label>Filter by Category:</label>
        <select id="invCategory"></select>
      </div>
      <div>
        <label>Search:</label>
        <input type="text" id="invSearch" placeholder="Item code or name">
      </div>
    </div>

    <div class="summary" id="invSummary">Loading...</div>

    <!-- Add New Item Form -->
    <form id="addItemForm" onsubmit="return addItem(event)">
      <input type="text" id="newItemName" placeholder="Description" required>
      <input type="text" id="newItemCategory" placeholder="Category" required>
      <input type="number" id="newItemStock" placeholder="Initial Stock" min="0" required>
      <input type="text" id="newItemImage" placeholder="Image URL (optional)">
      <button class="btn-new">Add Item</button>
    </form>

    <table class="gridview">
      <thead>
        <tr>
          <th>ITEM CODE</th>
          <th>DESCRIPTION</th>
          <th>AVAILABLE STOCKS</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="inventoryBody"></tbody>
    </table>
  </div>

  <!-- Transaction History Tab -->
  <div id="history" class="tab-content">
    <div class="filters">
      <div>
        <label>From:</label>
        <input type="date" id="txnFrom">
      </div>
      <div>
        <label>To:</label>
        <input type="date" id="txnTo">
      </div>
      <div>
        <label>Search:</label>
        <input type="text" id="txnSearch" placeholder="Item, Type, Remarks">
      </div>
    </div>
    <table id="txn-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Item Code</th>
          <th>Description</th>
          <th>Type</th>
          <th>Quantity</th>
          <th>Remarks</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody id="txnBody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzYq7nPRcHSod6nvWwmv-sMTg70a_jLbmkqKAkSZI2BhEQmVtBORlw0X6YMTSwqGZXftA/exec"; // Replace with your deployed Apps Script URL

let inventoryData = [];
let currentFilteredInventory = [];
let transactionData = [];

// Inventory elements
const invCategory = document.getElementById("invCategory");
const invSearch = document.getElementById("invSearch");
const invBody = document.getElementById("inventoryBody");
const invSummary = document.getElementById("invSummary");

// Transaction elements
const txnFrom = document.getElementById("txnFrom");
const txnTo = document.getElementById("txnTo");
const txnSearch = document.getElementById("txnSearch");
const txnBody = document.getElementById("txnBody");

// Filter event listeners
invCategory.onchange = applyInvFilter;
invSearch.onkeyup = applyInvFilter;
txnFrom.onchange = applyTxnFilter;
txnTo.onchange = applyTxnFilter;
txnSearch.onkeyup = applyTxnFilter;

// Load Inventory
async function loadInventory() {
  const res = await fetch(API_URL);
  inventoryData = await res.json();
  populateInvCategories();
  applyInvFilter();
  loadTransactions();
}

function populateInvCategories() {
  const cats = [...new Set(inventoryData.map(i => i.category))];
  invCategory.innerHTML = `<option value="All">All</option>` + cats.map(c => `<option>${c}</option>`).join("");
}

function renderInventory(data) {
  currentFilteredInventory = data;
  invBody.innerHTML = "";
  data.forEach(item => {
    invBody.innerHTML += `
      <tr>
        <td>${item.id}</td>
        <td class="col-desc">${item.name}</td>
        <td>${item.stock}</td>
        <td>
          <button class="btn-add" onclick="txn('${item.id}','PURCHASES')">Purchases</button>
          <button class="btn-return" onclick="txn('${item.id}','RETURN')">Return</button>
          <button class="btn-out" onclick="txn('${item.id}','PULLOUT')">Pullout</button>
        </td>
      </tr>
    `;
  });
}

function applyInvFilter() {
  let filtered = inventoryData;
  if (invCategory.value !== "All") filtered = filtered.filter(i => i.category === invCategory.value);
  if (invSearch.value)
    filtered = filtered.filter(i =>
      i.id.toLowerCase().includes(invSearch.value.toLowerCase()) ||
      i.name.toLowerCase().includes(invSearch.value.toLowerCase())
    );
  renderInventory(filtered);
  invSummary.innerHTML = `<b>Total Items:</b> ${filtered.length}`;
}

// Transactions
async function txn(itemCode, type) {
  const item = inventoryData.find(i => i.id === itemCode);
  const qty = parseInt(prompt("Quantity:"), 10);
  if (!qty || qty <= 0) return;

  const remarks = prompt("Remarks:") || "";
  if (type === "PULLOUT" && qty > item.stock) {
    alert("Insufficient stock");
    return;
  }

  const newBalance = type === "PULLOUT" ? item.stock - qty : item.stock + qty;

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      itemCode: item.id,
      description: item.name,
      type,
      qty,
      remarks,
      balance: newBalance
    })
  });
  const result = await res.json();
  if(result.status !== "success") { alert("Transaction failed: "+(result.message||"")); return; }

  item.stock = newBalance;
  currentFilteredInventory.forEach(fItem => { if(fItem.id===item.id) fItem.stock=newBalance; });
  renderInventory(currentFilteredInventory);
  loadTransactions();
}

// Add new item
async function addItem(e) {
  e.preventDefault();

  const newItem = {
    description: document.getElementById("newItemName").value.trim(),
    category: document.getElementById("newItemCategory").value.trim(),
    stock: parseInt(document.getElementById("newItemStock").value,10),
    image: document.getElementById("newItemImage").value.trim(),
    type: "NEW"
  };

  if(!newItem.description || !newItem.category) return alert("Please fill all required fields");

  try {
    const res = await fetch(API_URL, {method:"POST", body:JSON.stringify(newItem)});
    const result = await res.json();
    if(result.status !== "success") { alert("Failed to add item: "+(result.message||"")); return; }

    const itemCode = result.itemCode;

    // Add locally
    inventoryData.push({id:itemCode,name:newItem.description,category:newItem.category,stock:newItem.stock,url:newItem.image});
    transactionData.push({date:new Date().toISOString(),itemCode,itemCode,description:newItem.description,type:"NEW",qty:newItem.stock,remarks:"Initial stock",balance:newItem.stock});

    populateInvCategories();
    applyInvFilter();
    applyTxnFilter();
    document.getElementById("addItemForm").reset();

  } catch(err) { alert("Error: "+err.message); }
}

// Tab switch
function openTab(tabName,e){
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-buttons button").forEach(b=>b.classList.remove("active"));
  document.getElementById(tabName).classList.add("active");
  e.currentTarget.classList.add("active");
}

// Load transactions
async function loadTransactions() {
  const res = await fetch(API_URL + "?sheet=Transactions");
  transactionData = await res.json();
  applyTxnFilter();
}

// Transaction filters
function applyTxnFilter() {
  let filtered = transactionData;
  const from = txnFrom.value ? new Date(txnFrom.value) : null;
  const to = txnTo.value ? new Date(txnTo.value) : null;
  const s = txnSearch.value.toLowerCase();

  filtered = filtered.filter(txn=>{
    const txnDate = new Date(txn.date);
    let dateMatch = true;
    if(from) dateMatch = txnDate>=from;
    if(to) dateMatch = dateMatch && txnDate<=to;

    let textMatch=true;
    if(s) textMatch = txn.itemCode.toLowerCase().includes(s) || txn.description.toLowerCase().includes(s) || txn.type.toLowerCase().includes(s) || (txn.remarks && txn.remarks.toLowerCase().includes(s));

    return dateMatch && textMatch;
  });

  txnBody.innerHTML = "";
  filtered.forEach(txn=>{
    txnBody.innerHTML+=`
      <tr>
        <td>${new Date(txn.date).toLocaleString()}</td>
        <td>${txn.itemCode}</td>
        <td>${txn.description}</td>
        <td>${txn.type}</td>
        <td>${txn.qty}</td>
        <td>${txn.remarks}</td>
        <td>${txn.balance}</td>
      </tr>`;
  });
}

loadInventory();
</script>
</body>
</html>
