<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Management</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f8;
}

.main-container{
    max-width:1200px;
    margin:20px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h2{
    margin-bottom:15px;
    color:#0d47a1;
}

.tab-buttons{
    display:flex;
    gap:5px;
    margin-bottom:15px;
}

.tab-buttons button{
    flex:1;
    padding:10px;
    border:none;
    background:#ccc;
    cursor:pointer;
    font-weight:bold;
}

.tab-buttons button.active{
    background:#f19a04;
    color:#fff;
}

.tab-content{
    display:none;
}

.tab-content.active{
    display:block;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.filters input,
.filters select{
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

.summary{
    margin-bottom:15px;
    padding:10px;
    background:#fff8e1;
    border:1px solid #ffcc80;
    border-radius:5px;
}

#addItemForm{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-bottom:20px;
}

#addItemForm input,
#addItemForm select{
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

#addItemForm button{
    background:#4caf50;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    padding:10px;
}

#addItemForm button:hover{
    background:#43a047;
}

.image-preview{
    width:120px;
    height:120px;
    border:2px dashed #ccc;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:5px;
    background:#fafafa;
}

.image-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

thead{
    background:#e77d05;
    color:#fff;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

tbody tr:nth-child(even){
    background:#f9f9f9;
}

tbody tr:hover{
    background:#ffe0b2;
}

.item-image{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:5px;
}

.btn{
    border:none;
    color:white;
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
    margin:2px;
}

.btn-add{
    background:#4caf50;
    border-radius: 5px;
    width: 50px;
}

.btn-return{
    background:#2196f3;
    border-radius: 5px;
    width: 50px;
}

.btn-out{
    background:#f44336;
    border-radius: 5px;
    width: 50px;
}

.btn:hover{
    opacity:.9;
}

.loading{
    text-align:center;
    padding:20px;
    color:#777;
}

</style>
</head>

<body>

<div class="main-container">

  <div class="tab-container">
    <div class="tab-buttons">
      <button class="active" onclick="openTab('inventory',event)">Inventory</button>
      <button onclick="openTab('history',event)">Transaction History</button>
    </div>

    <!-- INVENTORY -->
    <div id="inventory" class="tab-content active">

      <div class="filters">
        <select id="invCategory"></select>
        <input type="text" id="invSearch" placeholder="Search item">
      </div>

      <div class="summary" id="invSummary"></div>

      <form id="addItemForm" onsubmit="return addItem(event)">
  <input id="newItemName" placeholder="Description" required>
  <input id="newItemCategory" placeholder="Category" required>
  <input id="newItemStock" type="number" min="0" placeholder="Initial Stock" required>
  <input type="file" id="newItemImage" accept="image/*" required>
  <button class="btn-new">Add Item</button>
</form>

      <table class="gridview">
        <thead>
          <tr>
            <th>ITEM CODE</th>
            <th>DESCRIPTION</th>
            <th>AVAILABLE STOCKS</th>
            <th>ACTIONS</th>
          </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>

    <!-- TRANSACTIONS -->
    <div id="history" class="tab-content">
      <div class="filters">
        <input type="text" id="txnSearch" placeholder="Search transaction">
      </div>

      <table id="txn-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Item</th>
            <th>Description</th>
            <th>Type</th>
            <th>Qty</th>
            <th>Remarks</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody id="txnBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxAdUwnrN_K508XoiPJvo68X62HOXJUxnMUw-ljJhsDH26XqmKdJHHbm6fzTLMndeiLug/exec";

let inventoryData = [];
let transactionData = [];

const invCategory = document.getElementById("invCategory");
const invSearch = document.getElementById("invSearch");
const invBody = document.getElementById("inventoryBody");
const invSummary = document.getElementById("invSummary");

const txnSearch = document.getElementById("txnSearch");
const txnBody = document.getElementById("txnBody");

invCategory.onchange = applyInvFilter;
invSearch.onkeyup = applyInvFilter;
txnSearch.onkeyup = applyTxnFilter;

function computeStocks() {
  const map = {};
  inventoryData.forEach(i => map[i.id] = 0);

  transactionData.forEach(t => {
    if (!(t.itemCode in map)) return;
    const q = Number(t.qty);
    if (t.type === "PULLOUT") map[t.itemCode] -= q;
    else map[t.itemCode] += q;
  });

  inventoryData.forEach(i => i.stock = map[i.id]);
}

async function loadInventory() {
  inventoryData = await (await fetch(API_URL)).json();
  transactionData = await (await fetch(API_URL + "?sheet=Transactions")).json();
  computeStocks();
  populateInvCategories();
  applyInvFilter();
  applyTxnFilter();
}

function populateInvCategories() {
  const cats = [...new Set(inventoryData.map(i => i.category))];
  invCategory.innerHTML =
    `<option value="All">All</option>` +
    cats.map(c => `<option>${c}</option>`).join("");
}

function renderInventory(data) {
  invBody.innerHTML = "";
  data.forEach(i => {
    invBody.innerHTML += `
      <tr>
        <td>${i.id}</td>
        <td class="col-desc">${i.name}</td>
        <td><b>${i.stock}</b> ${i.uom}</td>
        <td>
          <button class="btn-add" onclick="txn('${i.id}','PURCHASES')">Add</button>
          <button class="btn-return" onclick="txn('${i.id}','RETURN')">Return</button>
          <button class="btn-out" onclick="txn('${i.id}','PULLOUT')">Out</button>
        </td>
      </tr>`;
  });
}

function applyInvFilter() {
  let f = inventoryData;
  if (invCategory.value !== "All")
    f = f.filter(i => i.category === invCategory.value);
  if (invSearch.value)
    f = f.filter(i =>
      i.id.toLowerCase().includes(invSearch.value.toLowerCase()) ||
      i.name.toLowerCase().includes(invSearch.value.toLowerCase())
    );
  renderInventory(f);
  invSummary.innerHTML = `<b>Total Items:</b> ${f.length}`;
}

async function txn(code, type) {
  const item = inventoryData.find(i => i.id === code);
  const qty = Number(prompt(`Quantity (${item.uom}):`));
  if (!qty || qty <= 0) return;

  if (type === "PULLOUT" && qty > item.stock)
    return alert("Insufficient stock");

  const balance =
    type === "PULLOUT"
      ? item.stock - qty
      : item.stock + qty;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      itemCode: item.id,
      description: item.name,
      uom: item.uom,
      type,
      qty,
      remarks: prompt("Remarks:") || "",
      balance
    })
  });

  loadInventory();
}

function applyTxnFilter() {
  const s = txnSearch.value.toLowerCase();

  // Filter first
  let f = transactionData.filter(t =>
    !s ||
    t.itemCode.toLowerCase().includes(s) ||
    t.description.toLowerCase().includes(s)
  );

  // Sort by date descending (latest first)
  f.sort((a, b) => new Date(b.date) - new Date(a.date));

  // Render
  txnBody.innerHTML = "";
  f.forEach(t => {
    txnBody.innerHTML += `
      <tr>
        <td>${new Date(t.date).toLocaleString()}</td>
        <td>${t.itemCode}</td>
        <td>${t.description}</td>
        <td>${t.type}</td>
        <td>${t.qty}</td>
        <td>${t.remarks}</td>
        <td>${t.balance ?? ""} ${t.uom ?? ""}</td>
      </tr>`;
  });
}


function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = () => resolve(reader.result);

    reader.onerror = error => reject(error);
  });
}

async function addItem(e) {

  e.preventDefault();

  try {

    const fileInput = document.getElementById("newItemImage");
    const file = fileInput.files[0];

    if (!file) {
      alert("Please select an image");
      return;
    }

    // Convert image to Base64
    const base64 = await toBase64(file);

    // Upload image to Apps Script
    const uploadRes = await fetch(
      API_URL +
      "?action=uploadImage" +
      "&name=" + encodeURIComponent(newItemName.value) +
      "&mimeType=" + encodeURIComponent(file.type),
      {
        method: "POST",
        body: base64.split(",")[1]
      }
    );

    const uploadText = await uploadRes.text();

console.log(uploadText);

const uploadData = JSON.parse(uploadText);

    if (!uploadData.fileId) {
      alert("Image upload failed");
      return;
    }

    // Save item
    const saveRes = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({
        description: newItemName.value,
        category: newItemCategory.value,
        stock: Number(newItemStock.value),
        image: uploadData.fileId,
        uom: "PCS",
        type: "NEW"
      })
    });

    const result = await saveRes.text();

    console.log(result);

    alert("Item added successfully");

    e.target.reset();

    loadInventory();

  } catch (err) {

    console.error(err);

    alert("Error: " + err.message);
  }
}


function openTab(id,e){
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-buttons button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  e.currentTarget.classList.add("active");
}

loadInventory();
</script>

</body>
</html>
