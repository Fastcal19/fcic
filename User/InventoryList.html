<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory & Transactions</title>

<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; }
.tab-container { margin-top:20px; }
.tab-buttons { display:flex; gap:5px; }
.tab-buttons button { flex:1; padding:8px; cursor:pointer; border:none; background:#ccc; }
.tab-buttons button.active { background:#0d47a1; color:#fff; }

.tab-content { display:none; margin-top:10px; }
.tab-content.active { display:block; }

.gridview, #txn-table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:13px;
  background:#fff8f0;
}
.gridview th, #txn-table th {
  background:#f4a460;
  padding:10px;
  border:1px solid #ccc;
}
.gridview td, #txn-table td {
  padding:6px;
  border:1px solid #ccc;
  text-align:center;
  font-size:12px;
}
.gridview td.col-desc { text-align:left; }

button {
  font-size:11px;
  padding:4px 6px;
  cursor:pointer;
  border-radius:5px;
  width:80px;
}
.btn-add { background:#4caf50; color:#fff; }
.btn-return { background:#2196f3; color:#fff; }
.btn-out { background:#f44336; color:#fff; }
.btn-new { background:#ff9800; color:#fff; }

.summary {
  margin-top:10px;
  padding:8px;
  background:#faf0e6;
  border:1px solid #f4a460;
}

.filters {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

#addItemForm {
  display:flex;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}
#addItemForm input, #addItemForm select {
  padding:4px;
  width:150px;
}
</style>
</head>

<body>

<div class="tab-container">
  <div class="tab-buttons">
    <button class="active" onclick="openTab('inventory',event)">Inventory</button>
    <button onclick="openTab('history',event)">Transaction History</button>
  </div>

  <!-- INVENTORY -->
  <div id="inventory" class="tab-content active">

    <div class="filters">
      <select id="invCategory"></select>
      <input type="text" id="invSearch" placeholder="Search item">
    </div>

    <div class="summary" id="invSummary"></div>

    <form id="addItemForm" onsubmit="return addItem(event)">
      <input id="newItemName" placeholder="Description" required>
      <input id="newItemCategory" placeholder="Category" required>

      <select id="newItemUOM" required>
        <option value="">UOM</option>
        <option>pcs</option>
        <option>box</option>
        <option>kg</option>
        <option>g</option>
        <option>liter</option>
        <option>pack</option>
      </select>

      <input id="newItemStock" type="number" min="0" placeholder="Initial Stock" required>
      <button class="btn-new">Add Item</button>
    </form>

    <table class="gridview">
      <thead>
        <tr>
          <th>ITEM CODE</th>
          <th>DESCRIPTION</th>
          <th>AVAILABLE STOCKS</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="inventoryBody"></tbody>
    </table>
  </div>

  <!-- TRANSACTIONS -->
  <div id="history" class="tab-content">
    <div class="filters">
      <input type="text" id="txnSearch" placeholder="Search transaction">
    </div>

    <table id="txn-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Item</th>
          <th>Description</th>
          <th>Type</th>
          <th>Qty</th>
          <th>UOM</th>
          <th>Remarks</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody id="txnBody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyvrJwigbO5c0p_-z8IqN_Z1syiKv3K2Bu30x9ZgKMIypKOWCcmqx6n3mE7lutUSmy2tA/exec";

let inventoryData = [];
let transactionData = [];

const invCategory = document.getElementById("invCategory");
const invSearch = document.getElementById("invSearch");
const invBody = document.getElementById("inventoryBody");
const invSummary = document.getElementById("invSummary");

const txnSearch = document.getElementById("txnSearch");
const txnBody = document.getElementById("txnBody");

invCategory.onchange = applyInvFilter;
invSearch.onkeyup = applyInvFilter;
txnSearch.onkeyup = applyTxnFilter;

/* ===== COMPUTE STOCK ===== */
function computeStocks() {
  const map = {};
  inventoryData.forEach(i => map[i.id] = 0);

  transactionData.forEach(t => {
    if (!(t.itemCode in map)) return;
    const q = Number(t.qty);
    if (t.type === "PULLOUT") map[t.itemCode] -= q;
    else map[t.itemCode] += q;
  });

  inventoryData.forEach(i => i.stock = map[i.id]);
}

/* ===== LOAD ===== */
async function loadInventory() {
  inventoryData = await (await fetch(API_URL)).json();
  transactionData = await (await fetch(API_URL + "?sheet=Transactions")).json();
  computeStocks();
  populateInvCategories();
  applyInvFilter();
  applyTxnFilter();
}

function populateInvCategories() {
  const cats = [...new Set(inventoryData.map(i => i.category))];
  invCategory.innerHTML =
    `<option value="All">All</option>` +
    cats.map(c => `<option>${c}</option>`).join("");
}

function renderInventory(data) {
  invBody.innerHTML = "";
  data.forEach(i => {
    invBody.innerHTML += `
      <tr>
        <td>${i.id}</td>
        <td class="col-desc">${i.name}</td>
        <td><b>${i.stock}</b> ${i.uom}</td>
        <td>
          <button class="btn-add" onclick="txn('${i.id}','PURCHASES')">Buy</button>
          <button class="btn-return" onclick="txn('${i.id}','RETURN')">Return</button>
          <button class="btn-out" onclick="txn('${i.id}','PULLOUT')">Out</button>
        </td>
      </tr>`;
  });
}

function applyInvFilter() {
  let f = inventoryData;
  if (invCategory.value !== "All")
    f = f.filter(i => i.category === invCategory.value);
  if (invSearch.value)
    f = f.filter(i =>
      i.id.toLowerCase().includes(invSearch.value.toLowerCase()) ||
      i.name.toLowerCase().includes(invSearch.value.toLowerCase())
    );
  renderInventory(f);
  invSummary.innerHTML = `<b>Total Items:</b> ${f.length}`;
}

/* ===== TRANSACTION ===== */
async function txn(code, type) {
  const item = inventoryData.find(i => i.id === code);
  const qty = Number(prompt(`Quantity (${item.uom}):`));
  if (!qty || qty <= 0) return;

  if (type === "PULLOUT" && qty > item.stock)
    return alert("Insufficient stock");

  const balance =
    type === "PULLOUT"
      ? item.stock - qty
      : item.stock + qty;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      itemCode: item.id,
      description: item.name,
      uom: item.uom,
      type,
      qty,
      remarks: prompt("Remarks:") || "",
      balance
    })
  });

  loadInventory();
}

function applyTxnFilter() {
  const s = txnSearch.value.toLowerCase();
  const f = transactionData.filter(t =>
    !s ||
    t.itemCode.toLowerCase().includes(s) ||
    t.description.toLowerCase().includes(s)
  );

  txnBody.innerHTML = "";
  f.forEach(t => {
    txnBody.innerHTML += `
      <tr>
        <td>${new Date(t.date).toLocaleString()}</td>
        <td>${t.itemCode}</td>
        <td>${t.description}</td>
        <td>${t.type}</td>
        <td>${t.qty}</td>
        <td>${t.uom}</td>
        <td>${t.remarks}</td>
        <td>${t.balance ?? ""} ${t.uom ?? ""}</td>
      </tr>`;
  });
}

/* ===== ADD ITEM ===== */
async function addItem(e) {
  e.preventDefault();

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      description: newItemName.value,
      category: newItemCategory.value,
      uom: newItemUOM.value,
      stock: +newItemStock.value,
      type: "NEW"
    })
  });

  e.target.reset();
  loadInventory();
}

function openTab(id,e){
  document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".tab-buttons button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  e.currentTarget.classList.add("active");
}

loadInventory();
</script>

</body>
</html>
