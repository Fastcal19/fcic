<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sales Report</title>
  <style>
    :root{--accent:orangered;--muted:#666}
    body{font-family:Segoe UI, Tahoma, Verdana, sans-serif;margin:0;background:orange;color:#222}
    header{background:var(--accent);color:#fff;padding:14px 18px;font-size:1.25rem;text-align:center}
    main{padding:18px}
    .controls{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap}
    select{padding:8px;border-radius:6px;border:1px solid #ccc}
    button{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid #ccc;background:#fff;}
    .card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:14px;border:1px solid #ccc}
    th,td{padding:10px;border:1px solid #ccc;word-break:break-word}
    th{position:sticky;top:0;background:var(--accent);color:#fff;text-align:center}
    td:nth-child(1){text-align:center;width:110px;}
    td:nth-child(2){text-align:center;width:120px;}
    td:nth-child(3){width:250px;}
    td:nth-child(4){text-align:center;width:150px;}
    td:nth-child(5){width:auto;}
    td:nth-child(6){text-align:right;width:130px;}
    .total-row{font-weight:700;background:#f1f3f5}
    .loading{padding:30px 0;text-align:center;color:var(--muted)}
    .spinner{display:inline-block;width:28px;height:28px;border:4px solid #e9eef5;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:8px}
    #lastUpdated{font-size:12px;color:#444;margin-left:auto}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:600px){th,td{padding:8px;font-size:13px}}
  </style>
</head>
<body>

<main>
  <div class="controls">
    <label>Year:
      <select id="yearFilter"></select>
    </label>

    <label>Month:
      <select id="monthFilter">
        <option value="">All</option>
        <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
        <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
        <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option>
        <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
      </select>
    </label>

    <button onclick="loadSales(true)" title="Refresh">🔄 Refresh</button>

    <div id="hdrTotal" style="font-weight:700;white-space:nowrap">Total: 0.00</div>
    <div id="lastUpdated"></div>
  </div>

  <div class="card">
    <div id="loading" class="loading">
      <span class="spinner"></span>Loading sales data…
    </div>

    <table id="srTable" style="display:none">
      <thead>
        <tr>
          <th>DATE</th>
          <th>INVOICE</th>
          <th>CUSTOMER</th>
          <th>PURCHASE ORDER NO</th>
          <th>DESCRIPTION</th>
          <th>AMOUNT</th>
        </tr>
      </thead>
      <tbody id="srBody"></tbody>
    </table>
  </div>
</main>

<script>
const webAppSales = "https://script.google.com/macros/s/AKfycbyesH41EA5Va9e7LNR_bL_I65C-8P-t5pcO7ZBIwxEGY5kAvdFVmfGGYpYnmTH9Xjs6/exec";

function safeNum(v){
  if(v===null||v===undefined||v==="") return 0;
  const n = typeof v==="number" ? v : parseFloat(String(v).replace(/[, ]+/g,""));
  return isNaN(n)?0:n;
}

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d);
  if(isNaN(dt)) return String(d);
  return `${String(dt.getDate()).padStart(2,'0')}-${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][dt.getMonth()]}-${dt.getFullYear()}`;
}

function detectAmountKey(row){
  const keys = Object.keys(row||{});
  const c = keys.filter(k=>/^(amount|amt|total|gross|net|invoiceamount)$/i.test(k));
  return c[0] || keys[keys.length-1];
}

function populateYearFilter(){
  const sel=document.getElementById('yearFilter');
  sel.innerHTML="<option value=''>All</option>";
  const cur=new Date().getFullYear();
  for(let y=cur;y>=cur-5;y--){
    const o=document.createElement('option');
    o.value=y; o.textContent=y;
    sel.appendChild(o);
  }
  sel.value=cur;
}

async function loadSales(forceRefresh=false){
  const loading=document.getElementById('loading');
  const table=document.getElementById('srTable');
  const tbody=document.getElementById('srBody');
  const hdrTotal=document.getElementById('hdrTotal');
  const lastUpdated=document.getElementById('lastUpdated');

  loading.style.display='block';
  table.style.display='none';

  try{
    let data=null;

    if(!forceRefresh){
      const cached=localStorage.getItem('salesData');
      if(cached){
        const parsed=JSON.parse(cached);
        data=parsed.data;
        lastUpdated.textContent=`Last updated: ${new Date(parsed.timestamp).toLocaleString()}`;
      }
    }

    if(!data||forceRefresh){
      const res=await fetch(
        `${webAppSales}?sheet=sales&t=${Date.now()}`,
        {cache:"no-store"}
      );
      if(!res.ok) throw new Error(res.status);
      data=await res.json();

      localStorage.setItem('salesData',JSON.stringify({
        data,
        timestamp:new Date().toISOString()
      }));

      lastUpdated.textContent=`Last updated: ${new Date().toLocaleString()}`;
    }

    if(!Array.isArray(data)||!data.length){
      loading.textContent="No sales data found.";
      hdrTotal.textContent="Total: 0.00";
      return;
    }

    const yf=document.getElementById('yearFilter').value;
    const mf=document.getElementById('monthFilter').value;

    const rows=data.filter(r=>{
      const s=(r.STATUS||"").toString().toUpperCase();
      if(s==="CANCELLED"||!s) return false;
      const d=new Date(r.DATE);
      if(isNaN(d)) return false;
      if(yf && d.getFullYear()!=yf) return false;
      if(mf!=="" && d.getMonth()!=mf) return false;
      return true;
    });

    const grouped={};
    rows.forEach(r=>{
      const inv=String(r.INVOICE||"NO-INVOICE");
      if(!grouped[inv]){
        grouped[inv]={DATE:r.DATE,INVOICE:inv,CUSTOMER:r.CUSTOMER||"",PO:r.PO||"",DESC:[],TOTAL:0};
      }
      if(r.DESCRIPTION) grouped[inv].DESC.push(r.DESCRIPTION);
      grouped[inv].TOTAL+=safeNum(r[detectAmountKey(r)]);
    });

    const sorted=Object.values(grouped).sort((a,b)=>{
      return (parseInt(b.INVOICE.replace(/\D/g,''))||0)-(parseInt(a.INVOICE.replace(/\D/g,''))||0);
    });

    tbody.innerHTML="";
    let total=0;

    sorted.forEach(r=>{
      total+=r.TOTAL;
      tbody.insertAdjacentHTML("beforeend",`
        <tr>
          <td>${fmtDate(r.DATE)}</td>
          <td>${r.INVOICE}</td>
          <td>${escapeHtml(r.CUSTOMER)}</td>
          <td>${escapeHtml(r.PO)}</td>
          <td>${escapeHtml(r.DESC.join(', '))}</td>
          <td>${numberFormat(r.TOTAL)}</td>
        </tr>
      `);
    });

    tbody.insertAdjacentHTML("beforeend",`
      <tr class="total-row">
        <td colspan="5" style="text-align:right">TOTAL</td>
        <td>${numberFormat(total)}</td>
      </tr>
    `);

    hdrTotal.textContent="Total: "+numberFormat(total);
    loading.style.display="none";
    table.style.display="table";

  }catch(e){
    console.error(e);
    loading.textContent="Failed to load sales data.";
  }
}

function numberFormat(n){
  return (Number(n)||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m]));
}

document.addEventListener('DOMContentLoaded',()=>{
  populateYearFilter();
  loadSales();
  yearFilter.onchange=()=>loadSales();
  monthFilter.onchange=()=>loadSales();
});
</script>
</body>
</html>
