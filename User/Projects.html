<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Projects</title>

<style>
html,body { height:100%; margin:0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%);
}

.page { position: relative; padding:20px; z-index:2; }
h2 { margin-bottom:12px; color:#2c3e50; }

/* Filters */
.filters {
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
}
.filters label { display:flex; gap:6px; align-items:center; font-size:14px; }
.filters select, .filters button {
  padding:6px 10px; border-radius:6px;
  border:1px solid #ccc; background:#fff; cursor:pointer;
}
#pcSearchFilter { min-width:260px; max-width:360px; }

/* Spinner */
#spinner-pc {
  display:none; position:fixed; top:50%; left:50%;
  width:48px; height:48px; margin:-24px;
  border:6px solid #eee; border-top:6px solid #3498db;
  border-radius:50%; animation:spin 1s linear infinite;
  z-index:2000;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* Table */
table { width:100%; background:orange;
      margin-top:8px; box-shadow:0 6px 18px rgba(0,0,0,0.15);
      border-radius:6px; overflow:hidden;
    }
thead th {
  background:#4a4a4a; color:#fff; padding:10px;
}
th, td { padding:8px 10px; border-bottom:1px solid #eee; word-wrap:break-word; text-align:left; }
    #pcTable tbody tr:nth-child(odd) { background: #f9f9f9; }
    #pcTable tbody tr:nth-child(even){ background: #ffffff; }
    #pcTable tbody tr:hover { background: orange; cursor: pointer; transition: background-color 0.25s; }
#pcTable tbody tr:nth-child(odd){ background:#fff3e0; }
#pcTable tbody tr:nth-child(even){ background:#ffe0b2; }
#pcTable tbody tr:hover{ background:#ffb74d; cursor:pointer; }

/* Column widths */
#pcTable th:nth-child(1),td:nth-child(1){ width:7%; }
#pcTable th:nth-child(2),td:nth-child(2){ width:18%; }
#pcTable th:nth-child(3),td:nth-child(3){ width:8%; }
#pcTable th:nth-child(4),td:nth-child(4){ width:38%; }
#pcTable th:nth-child(5),td:nth-child(5){ width:9%; }
#pcTable th:nth-child(6),td:nth-child(6){ width:9%; }
#pcTable th:nth-child(7),td:nth-child(7){ width:11%; }

.empty-msg { text-align:center; color:#777; padding:12px; }

/* Modals */
.modal {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.45); z-index:1001;
}
.modal-content {
  background:#fff; margin:6% auto;
  width:90%; max-width:900px; height:80%;
  border-radius:10px; overflow:hidden;
  position:relative;
}
.modal iframe { width:100%; height:100%; border:none; }
.close-btn {
  position:absolute; top:10px; right:15px;
  font-size:22px; color:black; cursor:pointer;
}
</style>
</head>

<body>

<div id="spinner-pc"></div>

<div class="page">
<h2>📊 Projects</h2>

<div class="filters">
<label>Project / Description:
<select id="pcSearchFilter"><option value="">All Projects</option></select>
</label>

<label>Customer:
<select id="pcCustomerFilter"><option value="">All Customers</option></select>
</label>

<label>Year:
<select id="pcYearFilter"><option value="">All Years</option></select>
</label>

<label>Status:
<select id="pcStatusFilter">
<option value="">All</option>
<option value="ongoing">Ongoing</option>
<option value="done">Done</option>
</select>
</label>

<button id="pcAddBtn">+ Add New Project</button>
<button id="pcCostingBtn" hidden>+ Add Costing</button>
<button id="pcRefreshBtn">⟳ Refresh</button>
</div>

<table id="pcTable">
<thead>
<tr>
<th>PROJECT NO</th>
<th>CUSTOMER</th>
<th>REFERENCE</th>
<th>DESCRIPTION</th>
<th>FREQUENCY</th>
<th>LOCATION</th>
<th>STATUS</th>
</tr>
</thead>
<tbody id="pcBody">
<tr><td colspan="7" class="empty-msg">Loading…</td></tr>
</tbody>
</table>
</div>

<!-- Project Details Modal -->
<div id="projectDetailsModal" class="modal">
<div class="modal-content" style="height:auto;max-width:700px;">
<span class="close-btn" id="closeProjectDetails">&times;</span>
<div style="padding:20px;">
<h3 id="pdTitle"></h3>
<table><tbody id="pdBody"></tbody></table>
</div>
</div>
</div>

<!-- Add Project Modal -->
<div id="addProjectModal" class="modal">
<div class="modal-content">
<span class="close-btn" id="closeAddProjectModal">&times;</span>
<iframe id="addProjectFrame"></iframe>
</div>
</div>

<!-- Costing Modal -->
<div id="costingModal" class="modal">
<div class="modal-content">
<span class="close-btn" id="closeCostingModal">&times;</span>
<iframe id="costingFrame"></iframe>
</div>
</div>

<script>
const webAppProjectCosting =
"https://script.google.com/macros/s/AKfycbxulmLTZykrhNBm3U7PymbtvgZtr19F3pIDIRMDopERzHZpbJUYjg2HzAMrwZs3jghrkw/exec";

let pcRows = [];

const el = {
spinner:document.getElementById('spinner-pc'),
pcBody:document.getElementById('pcBody'),
customerFilter:document.getElementById('pcCustomerFilter'),
yearFilter:document.getElementById('pcYearFilter'),
statusFilter:document.getElementById('pcStatusFilter'),
searchFilter:document.getElementById('pcSearchFilter'),
refreshBtn:document.getElementById('pcRefreshBtn'),
addBtn:document.getElementById('pcAddBtn'),
costingBtn:document.getElementById('pcCostingBtn'),
addModal:document.getElementById('addProjectModal'),
costingModal:document.getElementById('costingModal'),
addFrame:document.getElementById('addProjectFrame'),
costingFrame:document.getElementById('costingFrame')
};

function normalizeData(raw){
if(Array.isArray(raw[0])){
const h=raw[0]; raw=raw.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])));
}
return raw.map(r=>({
PROJECT_NO:r.PROJECT_NO||'',
CUSTOMER:r.CUSTOMER||'',
REFERENCE:r.REFERENCE||'',
REFERENCE_LINK:r.PDF||r.URL||'',
DESCRIPTION:r.DESCRIPTION||'',
FREQUENCY:r.FREQUENCY||'',
LOCATION:r.LOCATION||'',
STATUS:r.STATUS||'',
DATE:r.DATE||''
}));
}

function renderReference(text,link){
if(link) return `<a href="${link}" target="_blank" onclick="event.stopPropagation()">${text}</a>`;
return text;
}

function renderTable(){
const rows=pcRows.filter(r=>{
if(el.customerFilter.value && r.CUSTOMER!==el.customerFilter.value) return false;
if(el.statusFilter.value && r.STATUS!==el.statusFilter.value) return false;
if(el.yearFilter.value && new Date(r.DATE).getFullYear()!=el.yearFilter.value) return false;
if(el.searchFilter.value && !r.PROJECT_NO.includes(el.searchFilter.value.split(' - ')[0])) return false;
return true;
});

el.pcBody.innerHTML='';
if(!rows.length){
el.pcBody.innerHTML='<tr><td colspan="7" class="empty-msg">No data</td></tr>';
return;
}

rows.forEach(r=>{
const tr=document.createElement('tr');
tr.onclick=()=>openDetails(r);
tr.innerHTML=`
<td>${r.PROJECT_NO}</td>
<td>${r.CUSTOMER}</td>
<td>${renderReference(r.REFERENCE,r.REFERENCE_LINK)}</td>
<td>${r.DESCRIPTION}</td>
<td>${r.FREQUENCY}</td>
<td>${r.LOCATION}</td>
<td>${r.STATUS}</td>`;
el.pcBody.appendChild(tr);
});
}

function populateFilters(){
const cust=new Set(), year=new Set(), proj=new Set();
pcRows.forEach(r=>{
cust.add(r.CUSTOMER);
year.add(new Date(r.DATE).getFullYear());
proj.add(`${r.PROJECT_NO} - ${r.DESCRIPTION}`);
});
el.customerFilter.innerHTML='<option value="">All</option>'+[...cust].map(v=>`<option>${v}</option>`).join('');
el.yearFilter.innerHTML='<option value="">All</option>'+[...year].sort((a,b)=>b-a).map(v=>`<option>${v}</option>`).join('');
el.searchFilter.innerHTML='<option value="">All</option>'+[...proj].map(v=>`<option>${v}</option>`).join('');
}

async function loadData(){
el.spinner.style.display='block';
const res=await fetch(webAppProjectCosting);
pcRows=normalizeData(await res.json());
populateFilters();
renderTable();
el.spinner.style.display='none';
}

function openDetails(r){
document.getElementById('pdTitle').textContent=`Project ${r.PROJECT_NO}`;
document.getElementById('pdBody').innerHTML=`
<tr><td>Customer</td><td>${r.CUSTOMER}</td></tr>
<tr><td>Reference</td><td>${renderReference(r.REFERENCE,r.REFERENCE_LINK)}</td></tr>
<tr><td>Description</td><td>${r.DESCRIPTION}</td></tr>
<tr><td>Frequency</td><td>${r.FREQUENCY}</td></tr>
<tr><td>Location</td><td>${r.LOCATION}</td></tr>
<tr><td>Status</td><td>${r.STATUS}</td></tr>`;
document.getElementById('projectDetailsModal').style.display='block';
}

document.getElementById('closeProjectDetails').onclick=()=>projectDetailsModal.style.display='none';

el.refreshBtn.onclick=loadData;
el.customerFilter.onchange=renderTable;
el.yearFilter.onchange=renderTable;
el.statusFilter.onchange=renderTable;
el.searchFilter.onchange=renderTable;

el.addBtn.onclick=()=>{ el.addFrame.src='Add New Project.html'; el.addModal.style.display='block'; };
el.costingBtn.onclick=()=>{ el.costingFrame.src='Costing Details.html'; el.costingModal.style.display='block'; };

document.getElementById('closeAddProjectModal').onclick=()=>el.addModal.style.display='none';
document.getElementById('closeCostingModal').onclick=()=>el.costingModal.style.display='none';

loadData();
</script>

</body>
</html>
