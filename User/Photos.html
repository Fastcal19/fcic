<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 16px;
}

/* Layout */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  max-width: 1200px;
  margin: auto;
}

/* Mobile layout */
@media (max-width: 768px) {
  .layout {
    grid-template-columns: 1fr;
  }
  .left {
    border-right: none;
    border-bottom: 1px solid #ddd;
    padding-bottom: 16px;
  }
}

/* Left panel */
.left {
  border-right: 1px solid #ddd;
  padding-right: 16px;
}

/* Inputs */
textarea, input, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Spinner */
.spinner {
  display: none;
  margin-top: 10px;
  text-align: center;
}

.spinner::after {
  content: "";
  width: 24px;
  height: 24px;
  border: 3px solid #ccc;
  border-top-color: #333;
  border-radius: 50%;
  display: inline-block;
  animation: spin 0.8s linear infinite;
}

/* Grid & photos */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 8px;
}

@media (min-width: 768px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  }
}

@media (min-width: 1024px) {
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
}

.grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
}

/* Photo wrapper */
.photo {
  position: relative;
}

/* Action buttons */
.actions {
  position: absolute;
  bottom: 6px;
  right: 6px;
  display: flex;
  gap: 6px;
}

.actions button {
  background: rgba(0, 0, 0, 0.65);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 14px;
  cursor: pointer;
  line-height: 1;
}

.actions button:hover {
  background: rgba(0, 0, 0, 0.85);
}

/* Caption text */
.caption {
  font-weight: bold;
  margin: 14px 0 6px;
}

.select-photo {
  position: absolute;
  top: 6px;
  left: 6px;
  width: 18px;
  height: 18px;
  cursor: pointer;
  z-index: 5;
}

/* Spinner animation */
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Fullscreen viewer */
.viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.viewer.show {
  display: flex;
  opacity: 1;
}

.viewer img {
  max-width: 95%;
  max-height: 95%;
  border-radius: 8px;
}

.viewer .close {
  position: absolute;
  top: 16px;
  right: 20px;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
}

.select-photo {
  pointer-events: auto;
}

</style>
</head>
<body>
<div id="pullIndicator" style="
  position: fixed;
  top: -50px;
  left: 0;
  right: 0;
  height: 50px;
  background: #f4f6f8;
  color: #333;
  text-align: center;
  line-height: 50px;
  font-size: 14px;
  z-index: 1000;
  transition: top 0.25s ease;
">
  ↓ Pull to refresh
</div>

<!-- Fullscreen Viewer -->
<div id="viewer" class="viewer" onclick="closeViewer()">
  <span class="close" onclick="event.stopPropagation(); closeViewer()">✕</span>
  <img id="viewerImg" onclick="event.stopPropagation()">
</div>

<div class="layout">

  <!-- LEFT -->
  <div class="left">
    <h3>Upload Photos</h3>
    


    <textarea id="caption" placeholder="Enter caption"></textarea>
    <input type="file" id="photos" multiple accept="image/*">

    <button id="uploadBtn" onclick="upload()">Upload</button>
    <button onclick="deleteSelected()" style="margin-top:8px;background:#c62828;color:#fff">
    Delete Selected
    </button>
    <div class="spinner" id="spinner"></div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h3>All Uploaded Photos</h3>
    <div id="uploads"></div>
  </div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzM4XTiLqwM5QnbOAyT2UktqkII6S5V9tIip9x0nlBAhI0mPat93xe6fvDjFQ4ytGer/exec";

window.onload = loadAll;

function setUploading(state) {
  document.getElementById("spinner").style.display = state ? "block" : "none";
  const btn = document.getElementById("uploadBtn");
  btn.disabled = state;
  btn.textContent = state ? "Uploading..." : "Upload";
}

function loadAll() {
  fetch(`${WEB_APP_URL}?action=list`)
    .then(r => r.json())
    .then(renderAll);
}

function renderAll(data) {
  const uploads = document.getElementById("uploads");
  uploads.innerHTML = "";

  Object.keys(data).forEach(caption => {
    const cap = document.createElement("div");
cap.className = "caption";

const selectAll = document.createElement("input");
selectAll.type = "checkbox";
selectAll.style.marginRight = "6px";

selectAll.onchange = () => {
  grid.querySelectorAll(".select-photo").forEach(cb => {
    cb.checked = selectAll.checked;
  });
};

cap.append(selectAll, document.createTextNode(caption));


    const grid = document.createElement("div");
    grid.className = "grid";

    data[caption].forEach(item => {
      const photo = document.createElement("div");
      photo.className = "photo";

      // Checkbox
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.className = "select-photo";
      checkbox.dataset.id = item.id;

      // Thumbnail
      const img = document.createElement("img");
      img.src = `https://drive.google.com/thumbnail?id=${item.id}&sz=w600`;
      img.onclick = (e) => {
        e.stopPropagation();
        openViewer(`https://drive.google.com/thumbnail?id=${item.id}&sz=w2000`);
      };
      
      let pressTimer;

img.addEventListener("touchstart", (e) => {
  pressTimer = setTimeout(() => {
    checkbox.checked = !checkbox.checked;
  }, 500);
});

img.addEventListener("touchend", () => {
  clearTimeout(pressTimer);
});

img.addEventListener("touchmove", () => {
  clearTimeout(pressTimer);
});

      // Actions
      const actions = document.createElement("div");
      actions.className = "actions";

      const del = document.createElement("button");
      del.textContent = "🗑";
      del.onclick = (e) => {
        e.stopPropagation();
        if (confirm("Delete this photo?")) modify("delete", item.id);
      };

      const edit = document.createElement("button");
      edit.textContent = "✏️";
      edit.onclick = (e) => {
        e.stopPropagation();
        const newCap = prompt("New caption:", caption);
        if (newCap) modify("edit", item.id, newCap);
      };

      actions.append(edit, del);
      photo.append(checkbox, img, actions);
      grid.appendChild(photo);
    });

    // 🔥 THIS WAS MISSING
    uploads.append(cap, grid);
  });
}


function upload() {
  const captionEl = document.getElementById("caption");
  const filesEl = document.getElementById("photos");

  const caption = captionEl.value.trim();
  const files = filesEl.files;

  if (!caption || files.length === 0) {
    alert("Caption + at least 1 photo required");
    return;
  }

  setUploading(true);

  const uploads = [];
  let done = 0;

  [...files].forEach(f => {
    const r = new FileReader();
    r.onload = e => {
      uploads.push({
        name: f.name,
        type: f.type,
        data: e.target.result.split(",")[1]
      });
      if (++done === files.length) send("upload", { caption, files: uploads });
    };
    r.readAsDataURL(f);
  });
}


function modify(action, fileId, caption = "") {
  send(action, { fileId, caption });
}

function send(action, payload) {
  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({ action, ...payload })
  })
  .then(() => {
    loadAll();
    if (action === "upload") {
      document.getElementById("caption").value = "";
      document.getElementById("photos").value = "";
      setUploading(false);
    }
  });
}

function openViewer(src) {
  const viewer = document.getElementById("viewer");
  document.getElementById("viewerImg").src = src;
  viewer.classList.add("show");
}

function closeViewer() {
  const viewer = document.getElementById("viewer");
  viewer.classList.remove("show");
  setTimeout(() => document.getElementById("viewerImg").src = "", 300);
}

function deleteSelected() {
  const checked = document.querySelectorAll(".select-photo:checked");

  if (checked.length === 0) {
    alert("No photos selected");
    return;
  }

  if (!confirm(`Delete ${checked.length} selected photo(s)?`)) return;

  let count = 0;

  checked.forEach(cb => {
    send("delete", { fileId: cb.dataset.id });
    cb.checked = false; // auto clear
    count++;
  });

  setTimeout(() => {
    loadAll();
  }, 600);
}

let startY = 0;
let pulling = false;

window.addEventListener("touchstart", e => {
  if (window.scrollY === 0) {
    startY = e.touches[0].clientY;
    pulling = true;
  }
});

window.addEventListener("touchmove", e => {
  if (!pulling) return;

  const currentY = e.touches[0].clientY;
  const diff = currentY - startY;

  if (diff > 0 && diff < 120) {
    e.preventDefault();
    document.getElementById("pullIndicator").style.top =
      Math.min(diff - 50, 10) + "px";
  }
});

window.addEventListener("touchend", e => {
  if (!pulling) return;

  const indicator = document.getElementById("pullIndicator");
  const finalY = indicator.getBoundingClientRect().top;

  indicator.style.top = "-50px";
  pulling = false;

  if (finalY > -10) {
    indicator.textContent = "⟳ Refreshing...";
    indicator.style.top = "0px";
    loadAll();

    setTimeout(() => {
      indicator.textContent = "↓ Pull to refresh";
      indicator.style.top = "-50px";
    }, 800);
  }
});

</script>

</body>
</html>
