<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Photo Gallery</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  padding: 16px;
}

/* Two-column layout */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  max-width: 1200px;
  margin: auto;
}

/* Left panel */
.left {
  border-right: 1px solid #ddd;
  padding-right: 16px;
}

/* Inputs */
textarea, input, button {
  width: 100%;
  margin-top: 8px;
  padding: 8px;
}

/* Gallery grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.grid img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  border-radius: 6px;
}

.caption {
  font-weight: bold;
  margin: 14px 0 6px;
}

.photo {
  position: relative;
}

.actions {
  position: absolute;
  bottom: 4px;
  right: 4px;
  display: flex;
  gap: 4px;
}

.actions button {
  font-size: 11px;
  padding: 4px 6px;
}
</style>
</head>

<body>

<div class="layout">

  <!-- LEFT: Upload -->
  <div class="left">
    <h3>Upload Photos</h3>
    <textarea id="caption" placeholder="Enter caption"></textarea>
    <input type="file" id="photos" multiple accept="image/*">
    <button onclick="upload()">Upload</button>
  </div>

  <!-- RIGHT: Gallery -->
  <div class="right">
    <h3>All Uploaded Photos</h3>
    <div id="uploads"></div>
  </div>

</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzM4XTiLqwM5QnbOAyT2UktqkII6S5V9tIip9x0nlBAhI0mPat93xe6fvDjFQ4ytGer/exec";

window.onload = loadAll;

function loadAll() {
  fetch(`${WEB_APP_URL}?action=list`)
    .then(r => r.json())
    .then(renderAll);
}

function renderAll(data) {
  const uploads = document.getElementById("uploads");
  uploads.innerHTML = "";

  Object.keys(data).forEach(caption => {
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = caption;

    const grid = document.createElement("div");
    grid.className = "grid";

    data[caption].forEach(item => {
      const photo = document.createElement("div");
      photo.className = "photo";

      const img = document.createElement("img");
      img.src = `https://drive.google.com/thumbnail?id=${item.id}&sz=w600`;

      const actions = document.createElement("div");
      actions.className = "actions";

      const del = document.createElement("button");
      del.textContent = "🗑";
      del.onclick = () => modify("delete", item.id);

      const edit = document.createElement("button");
      edit.textContent = "✏️";
      edit.onclick = () => {
        const newCap = prompt("New caption:", caption);
        if (newCap) modify("edit", item.id, newCap);
      };

      actions.append(edit, del);
      photo.append(img, actions);
      grid.appendChild(photo);
    });

    uploads.append(cap, grid);
  });
}

function upload() {
  const caption = document.getElementById("caption").value.trim();
  const files = document.getElementById("photos").files;

  if (!caption || files.length === 0 || files.length > 3) {
    alert("Caption + 1–3 photos required");
    return;
  }

  const uploads = [];
  let done = 0;

  [...files].forEach(f => {
    const r = new FileReader();
    r.onload = e => {
      uploads.push({
        name: f.name,
        type: f.type,
        data: e.target.result.split(",")[1]
      });
      if (++done === files.length) send("upload", { caption, files: uploads });
    };
    r.readAsDataURL(f);
  });
}

function modify(action, fileId, caption = "") {
  send(action, { fileId, caption });
}

function send(action, payload) {
  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify({ action, ...payload })
  }).then(loadAll);
}
</script>

</body>
</html>
