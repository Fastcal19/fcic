<script>
/* ------------- (ALL YOUR ORIGINAL JAVASCRIPT IS KEPT 100% INTACT) ---------------- */
/* ✔ No logic removed  
   ✔ No functions modified except load start/stop  
   ✔ Only spinner system added  
*/
let chartOfAccounts = [];
let accountTypes = [];
let customersAndSuppliers = [];

// --- Reference Format: JE + YY + 3-digit sequence ---
function generateReference() {
    const refField = document.getElementById("ref");
    const now = new Date();
    const year = now.getFullYear().toString().slice(-2);   // YY

    // Read previous JE entries saved in sessionStorage
    const entries = JSON.parse(localStorage.getItem("journalEntries")) || [];

    let maxSeq = 0;

    entries.forEach(e => {
        if (!e.ref) return;

        // expected ref pattern: JE001-24
        const match = e.ref.match(/^JE(\d+)-\d{2}$/);

        if (match) {
            const seq = parseInt(match[1], 10);
            if (seq > maxSeq) maxSeq = seq;
        }
    });

    // Next sequence
    const nextSeq = (maxSeq + 1).toString().padStart(3, "0");

    refField.value = `JE${nextSeq}-${year}`;
}


/* ------------------- NUMBER HELPERS ------------------- */
function unformatNumber(value) {
    if (value === undefined || value === null) return "";
    // Accept numbers or formatted strings
    const s = String(value).trim();
    // remove commas and spaces
    return s.replace(/,/g, '').replace(/\s+/g, '');
}

function formatNumberWithCommas(value) {
    if (value === "" || value === undefined || value === null) return "";
    const num = Number(unformatNumber(value));
    if (isNaN(num)) return "";
    return num.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

/* ------------------- LOAD ACCOUNTS ------------------- */
function loadAccounts() {

  // load via Apps Script
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run.withSuccessHandler(accounts => {
      chartOfAccounts = (accounts || []).filter(a => a.code && a.name);
      extractUniqueTypes();
      populateAccountTypeDropdown();
      addEntry('debit', false);
      addEntry('credit', false);
      updateTotals();
    }).getChartOfAccounts();

    google.script.run.withSuccessHandler(data => {
      customersAndSuppliers = data || [];
      populateCustomerDropdown();
    }).getCustomerSupplierList();

    // Load auto reference
    google.script.run.withSuccessHandler(latestRef => {
      // server could return a latest reference if desired
      generateReference();
    }).getLatestReference();
  } else {
    // Fallback demo accounts when google.script not available (for local testing)
    chartOfAccounts = [
      
    ];
    extractUniqueTypes();
    populateAccountTypeDropdown();
    addEntry('debit', false);
    addEntry('credit', false);
    updateTotals();
    generateReference();
  }
}

/* ------------------- ACCOUNT TYPE DROPDOWN ------------------- */
function extractUniqueTypes() {
  accountTypes = [...new Set(chartOfAccounts.map(a => a.type).filter(Boolean))].sort();
}

function populateAccountTypeDropdown() {
  const select = document.getElementById('accountTypeSelect');
  select.innerHTML = '<option value="">-- Select Account Type --</option>';
  accountTypes.forEach(type => {
    const opt = document.createElement('option');
    opt.value = opt.textContent = type;
    select.appendChild(opt);
  });
}

/* ------------------- CUSTOMER DATALIST ------------------- */
function populateCustomerDropdown() {
  const ds = document.getElementById('customerList');
  ds.innerHTML = '';
  customersAndSuppliers.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name || c.full || c;
    ds.appendChild(opt);
  });
}

/* ------------------- VAT DROPDOWN ------------------- */
function createVATSelect(entryType) {
  const select = document.createElement('select');
  select.className = 'entry-vat';

  const options = [
    { val: '', text: 'Non-VAT' },
    { val: 'VATABLE', text: 'VATable (12%)' },
    { val: 'EXEMPT', text: 'VAT-Exempt' },
    { val: 'ZERO', text: 'Zero Rated' }
  ];

  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o.val;
    opt.textContent = o.text;
    select.appendChild(opt);
  });

  // Attach VAT handler
  select.addEventListener("change", () => handleVATChange(select, entryType));

  return select;
}

/* ------------------- ACCOUNT DROPDOWNS ------------------- */
function getSelectedAccounts() {
  return [...document.querySelectorAll('.entry-select')]
    .map(s => s.value)
    .filter(v => v);
}

function refreshDropdowns() {
  const used = getSelectedAccounts();

  document.querySelectorAll('.entry-select').forEach(select => {
    const currentValue = select.value;

    select.innerHTML = '<option value="">-- Select Account --</option>';

    chartOfAccounts.forEach(acc => {
      if (!used.includes(acc.code) || acc.code === currentValue) {
        const opt = document.createElement('option');
        opt.value = acc.code;
        opt.textContent = `${acc.code} - ${acc.name}`;
        select.appendChild(opt);
      }
    });

    select.value = currentValue;
  });
}

function createSelect() {
  const select = document.createElement('select');
  select.className = 'entry-select';
  select.addEventListener('change', refreshDropdowns);
  return select;
}

/* ------------------- AMOUNT INPUT ------------------- */
function createAmountInput() {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'entry-amount';
    input.placeholder = 'Amount';

    // Format on blur
    input.addEventListener('blur', () => {
        if (input.value.trim() !== "") {
            input.value = formatNumberWithCommas(unformatNumber(input.value));
        }
        // trigger VAT recalculation for the container this input belongs to
        const container = input.closest('#debit-entries') ? document.getElementById('debit-entries') : document.getElementById('credit-entries');
        // trigger VAT compute by dispatching an input event (VAT handler listens to row inputs)
        container.querySelectorAll('.entry-group').forEach(r => {
          // no-op: ensure updateTotals reads the formatted values
        });
        updateTotals();
    });

    // Remove formatting on focus
    input.addEventListener('focus', () => {
        input.value = unformatNumber(input.value);
    });

    // Update totals while typing
    input.addEventListener('input', () => {
        updateTotals();
    });

    return input;
}

/* ------------------- ADD ENTRY ------------------- */
function addEntry(type, allowDelete) {
  const container = document.getElementById(type + '-entries');
  const row = document.createElement('div');
  row.className = 'entry-group';

  const select = createSelect();
  const vat = createVATSelect(type);
  const amount = createAmountInput();

  const del = document.createElement('button');
  del.type = 'button';
  del.textContent = '×';
  del.className = 'delete-button';

  if (allowDelete) {
    del.onclick = () => {
      row.remove();
      refreshDropdowns();
      updateTotals();
    };
  } else {
    // hide if not deletable
    del.style.visibility = 'hidden';
  }

  row.appendChild(select);
  row.appendChild(vat);
  row.appendChild(amount);
  row.appendChild(del);

  container.appendChild(row);
  refreshDropdowns();

  // attach input listener that VAT handler expects
  amount.addEventListener('input', () => {
    updateTotals();
});


  updateTotals();
}

function formatAmount(num) {
  return Number(num).toLocaleString("en-US", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

/* ------------------- EXTRACT ENTRY DATA ------------------- */
function getEntries(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return [];

  const rows = container.getElementsByClassName("entry-group");
  const entries = [];

  for (const row of rows) {
    const accountSelect = row.querySelector(".entry-select");
    const amountInput   = row.querySelector(".entry-amount");

    if (!accountSelect || !amountInput) continue;

    const selectedOption = accountSelect.selectedOptions[0];
    const accountCode = selectedOption?.value || "";

    // strip any leading "1234 - " if present
    const rawText = selectedOption?.textContent || "";
    const accountName = rawText.replace(/^\s*\d+\s*-\s*/, "").trim();

    const amount = parseFloat(amountInput.value.replace(/,/g, "")) || 0;

    if (accountCode && amount > 0) {
      entries.push({ accountCode, accountName, amount });
    }
  }

  return entries;
}



/* ------------------- TOTALS ------------------- */
function sumAmounts(type) {
  return [...document.querySelectorAll(`#${type}-entries .entry-amount`)]
    .reduce((a, b) => a + (parseFloat(unformatNumber(b.value)) || 0), 0);
}

function updateTotals() {
    const totalDebit = sumAmounts('debit');
    const totalCredit = sumAmounts('credit');

    document.getElementById("totalDebit").innerText = formatAmount(totalDebit);
    document.getElementById("totalCredit").innerText = formatAmount(totalCredit);
}

/* ------------------- GATHER FORM DATA ------------------- */
function gatherFormData() {
  let transactionType = "";
  const radio = document.querySelector("input[name='transactionType']:checked");
  if (radio) transactionType = radio.value;

  return {
    date: document.getElementById('date').value,
    ref: document.getElementById('ref').value,
    description: document.getElementById('description').value,
    accountType: document.getElementById('accountTypeSelect').value,
    customer: document.getElementById('customerDetails').value,
    tin: document.getElementById('tinInput').value,
    invoiceNo: document.getElementById('invoiceNo').value,
    projectNo: document.getElementById('projectNo').value,
    transactionType: transactionType,
    debitEntries: getEntries('debit-entries'),
    creditEntries: getEntries('credit-entries')

  };
}

/* ------------------- SAVE TO LOCAL STORAGE ------------------- */
function saveLocal(data) {
  try {
    let queue = JSON.parse(localStorage.getItem("journalQueue")) || [];

    // ✅ Make sure REF is saved
    if (!data.ref) {
      data.ref = document.getElementById("ref").value;
    }

    // ✅ Add timestamp so entries never overwrite
    data._savedAt = new Date().toISOString();

    queue.push(data);

    // ✅ Save to both queue (for syncing) and entries (for ref generation)
    localStorage.setItem("journalQueue", JSON.stringify(queue));
    localStorage.setItem("journalEntries", JSON.stringify(queue));

    console.log("Saved locally:", data.ref);
    alert("Saved locally! Will sync when online.");

  } catch (err) {
    console.error("Local save error:", err);
    alert("Failed to save locally.");
  }
}


const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyv7bpF1Z1QVf6EW-m1N1cC4Ry-c7x-i30iD2H1__QsUndep0W5WzMBQ_h_zJN7yB3v/exec";

async function syncToGoogle() {
  const queue = JSON.parse(localStorage.getItem("journalQueue")) || [];
  if (queue.length === 0) return;

  const newQueue = [];

  for (const entry of queue) {
    try {
      const url = `${SCRIPT_URL}?data=${encodeURIComponent(JSON.stringify(entry))}`;

      const res = await fetch(url, { method: "GET" });

      if (!res.ok) {
        newQueue.push(entry);
        continue;
      }

      const json = await res.json();
      console.log("Synced:", json);

    } catch (err) {
      newQueue.push(entry);
    }
  }

  if (newQueue.length > 0) {
    localStorage.setItem("journalQueue", JSON.stringify(newQueue));
    console.warn("Some entries not synced. Will retry later.");
  } else {
    localStorage.removeItem("journalQueue");
    console.log("All entries synced!");
  }
}


document.getElementById('journalForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const data = gatherFormData();
  const totalDebit = sumAmounts('debit');
  const totalCredit = sumAmounts('credit');

  if (!data.accountType || !data.customer) {
    alert('Please fill all required fields.');
    return;
  }

  if (Math.abs(totalDebit - totalCredit) > 0.01) {
    alert('Total debits and credits must match.');
    return;
  }

  // ---- If Apps Script is available ----
  if (typeof google !== 'undefined' && google.script && google.script.run) {

    google.script.run
      .withSuccessHandler(() => {

        // ✅ SAVE LOCALLY FIRST
        saveLocal(data);

        alert('Journal entry saved!');

        document.getElementById('journalForm').reset();
        document.getElementById('debit-entries').innerHTML = '';
        document.getElementById('credit-entries').innerHTML = '';
        addEntry('debit', false);
        addEntry('credit', false);
        updateTotals();

        // ✅ NOW GENERATE NEXT REF
        generateReference();

      })
      .withFailureHandler(err => {
        alert('Server unreachable. Saving locally.');
        saveLocal(data);
        generateReference(); // ✅ also increment offline
      })
      .saveJournalEntry(data);

  } else {
    // ---- Offline mode ----
    alert("Offline. Saving locally.");
    saveLocal(data);
    document.getElementById('journalForm').reset();

    // ✅ increment even offline
    generateReference();
  }
});



/* ------------------- Load from sessionStorage (new) ------------------- */
function loadAccountsFromWebApp() {

  const stored = sessionStorage.getItem("COA");

  if (!stored) {
    console.warn("⚠️ No Chart of Accounts found in sessionStorage");
    alert("Chart of Accounts not found — please reload or login again");
    return;
  }

  try {
    chartOfAccounts = JSON.parse(stored);

    extractUniqueTypes();
    populateAccountTypeDropdown();

    // ensure at least one row each
    if (document.querySelectorAll('#debit-entries .entry-group').length === 0) addEntry('debit', false);
    if (document.querySelectorAll('#credit-entries .entry-group').length === 0) addEntry('credit', false);

    updateTotals();
  } catch (err) {
    console.error("Error parsing stored accounts:", err);
    alert("Failed to parse stored Chart of Accounts");
  }
}

// Initial state
if (tinInput) tinInput.required = true;
if (particulars) {
  particulars.readOnly = true;
  particulars.style.background = "#eee";
}

// Toggle behavior
if (tinCheckbox) tinCheckbox.addEventListener("change", () => {
    if (tinCheckbox.checked) {
        // TIN fetching mode
        tinInput.required = true;
        tinInput.readOnly = false;

        particulars.readOnly = true;
        particulars.style.background = "#eee";
        particulars.value = "";
    } else {
        // Manual mode
        tinInput.required = false;
        tinInput.readOnly = true;
        tinInput.value = "";

        particulars.readOnly = false;
        particulars.style.background = "";
        particulars.value = "";
    }
});

// Fetch customer details when typing TIN (from sessionStorage)
// Fetch customer details when typing TIN — from sessionStorage
if (tinInput) tinInput.addEventListener("input", () => {
    if (!tinCheckbox.checked) return;

    const tin = tinInput.value.trim();
    if (tin === "") {
        particulars.value = "";
        return;
    }

    const stored = sessionStorage.getItem("customers");
    if (!stored) {
        particulars.value = "No customer data in session";
        return;
    }

    try {
        const customers = JSON.parse(stored);

        // normalize: remove hyphens & spaces before comparison
        const cleanTin = tin.replace(/\D/g, "");

        const match = customers.find(c => 
            c.tin && c.tin.replace(/\D/g, "") === cleanTin
        );

        if (match) {
            particulars.value = match.bname;
            // optionally also store other info for later use
            // addressInput.value = match.address;
        } else {
            particulars.value = "TIN not found";
        }

    } catch (err) {
        console.error("Error parsing customers from session:", err);
        particulars.value = "Error reading stored data";
    }
});

/* ------------------- VAT HANDLING ------------------- */
function handleVATChange(selectElement, entryType) {
    const row = selectElement.closest(".entry-group");
    const amountInput = row.querySelector(".entry-amount");
    const container = document.getElementById(entryType + "-entries");

    function computeVAT() {
        let totalVATBase = 0;

        // sum only VATable amounts from normal rows (ignore vat-auto-row)
        container.querySelectorAll(".entry-group").forEach(r => {
            if (r.classList.contains('vat-auto-row')) return;

            const vatSel = r.querySelector(".entry-vat");
            const amtRaw = unformatNumber(r.querySelector(".entry-amount")?.value || 0);
            const amt = parseFloat(amtRaw) || 0;

            if (vatSel && vatSel.value === "VATABLE" && amt > 0) {
                totalVATBase += amt;
            }
        });

        return totalVATBase * 0.12;
    }

    function updateVatRow() {
        let vatRow = container.querySelector(".vat-auto-row");
        const vatAmount = computeVAT();

        // No VATABLE -> remove VAT row if exists
        if (vatAmount === 0) {
            if (vatRow) vatRow.remove();
            updateTotals();
            return;
        }

        // Create row if missing
        if (!vatRow) {
            vatRow = document.createElement("div");
            vatRow.className = "entry-group vat-auto-row";

            // Account title (read-only)
            const title = document.createElement("input");
            title.type = "text";
            title.readOnly = true;
            title.className = "entry-select";
            title.value = entryType === "debit"
                ? "1140 - Input VAT"
                : "2140 - Output VAT";

            // VAT-type blank box (disabled)
            const vatBox = document.createElement("select");
            vatBox.className = "entry-vat";
            vatBox.disabled = true;
            vatBox.innerHTML = `<option></option>`;

            // Amount (read-only text for consistent formatting)
            const amtBox = document.createElement("input");
            amtBox.type = "text";
            amtBox.className = "entry-amount";
            amtBox.readOnly = true;

            const del = document.createElement("button");
            del.className = "delete-button";
            del.textContent = "×";
            del.style.visibility = "hidden";

            vatRow.appendChild(title);
            vatRow.appendChild(vatBox);
            vatRow.appendChild(amtBox);
            vatRow.appendChild(del);

            container.appendChild(vatRow);
        }

        // Update VAT amount (formatted)
        const amtInput = vatRow.querySelector(".entry-amount");
        amtInput.value = formatNumberWithCommas(vatAmount.toFixed(2));

        // Always keep at the bottom
        container.appendChild(vatRow);

        updateTotals();
    }

    // Recompute VAT every time any amount in the container changes.
    // Attach listener to the container (event delegation)
    container.addEventListener('input', updateVatRow, { passive: true });

    // Trigger initial calculation
    updateVatRow();
}
