<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts Receivables</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 20px;
      background: linear-gradient(70deg, gold, orange, orangered);
      color: #222;
    }
    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    .refresh {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #2c3e50;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1a242f; }
    
    .card {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  padding: 15px;

  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
    }
    th {
      background: #34495e;
      color: #fff;
      text-align: center;
    }
    td:nth-child(1) { width: 7%; text-align: center; }
    td:nth-child(2) { width: 7%; text-align: center; }
    td:nth-child(3) { width: 7%; text-align: center; }
    td:nth-child(4) { width: 4%; text-align: center; }
    td:nth-child(5) { width: 17%; }
    td:nth-child(6) { width: 8%; text-align: center; }
    td:nth-child(7) { width: 40%; text-align: left; }
    td:nth-child(8) { width: 10%; text-align: right; }
    .total-row {
      font-weight: bold;
      background: #f1f1f1;
    }

    @media (max-width: 768px) {

  table {
    min-width: 700px;
  }

}

    .loading {
      text-align: center;
      padding: 30px 0;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="refresh">
    <button onclick="refreshReceivables()">🔄 Refresh</button>
  </div>

  <div class="card">
    <div id="loading" class="loading">Loading receivables data...</div>
    <table id="arTable" style="display:none;">
      <thead>
        <tr>
          <th>DATE</th>
          <th>COUNTERED</th>
          <th>DUE DATE</th>
          <th>INVOICE</th>
          <th>CUSTOMER</th>
          <th>PO#</th>
          <th>DESCRIPTION</th>
          <th>AMOUNT</th>
        </tr>
      </thead>
      <tbody id="arBody"></tbody>
    </table>
  </div>

<script>
const webAppURL = "https://script.google.com/macros/s/AKfycbyesH41EA5Va9e7LNR_bL_I65C-8P-t5pcO7ZBIwxEGY5kAvdFVmfGGYpYnmTH9Xjs6/exec";

function formatDate(val) {
  if (!val) return "";
  
  const d = new Date(val);
  
  if (isNaN(d.getTime())) return val;

  return `${d.getDate().toString().padStart(2, "0")}-${d.toLocaleString("en-US", {
    month: "short"
  })}-${d.getFullYear()}`;
}

async function loadReceivables(fromCache = true) {

  const loading = document.getElementById("loading");
  const table = document.getElementById("arTable");
  const tbody = document.getElementById("arBody");

  tbody.innerHTML = "";
  loading.style.display = "block";
  table.style.display = "none";

  let data = null;

  // =========================
  // LOAD FROM CACHE
  // =========================
  if (fromCache) {
    const cached = localStorage.getItem("receivablesData");

    if (cached) {
      try {
        data = JSON.parse(cached);
        console.log("Loaded from localStorage");
      } catch (e) {
        console.error("Cache parse error", e);
        data = null;
      }
    }
  }

  // =========================
  // FETCH FROM GOOGLE SCRIPT
  // =========================
  if (!data) {
    try {

      const res = await fetch(webAppURL + "?sheet=sales");

      if (!res.ok) {
        throw new Error("Network response not OK");
      }

      data = await res.json();

      // Ensure array
      if (!Array.isArray(data)) {
        console.error("Invalid JSON:", data);
        loading.textContent = "Invalid data received.";
        return;
      }

      localStorage.setItem("receivablesData", JSON.stringify(data));

      console.log("Fetched fresh data");

    } catch (err) {
      console.error(err);
      loading.textContent = "Error loading data.";
      return;
    }
  }

  // =========================
  // FILTER PENDING
  // =========================
  const pending = data.filter(r =>
    (r.STATUS || "").toString().toUpperCase() === "PENDING"
  );

  // =========================
  // GROUP BY INVOICE
  // =========================
  const grouped = {};

  pending.forEach(r => {

    const inv = r.INVOICE || "NO-INVOICE";

    if (!grouped[inv]) {
      grouped[inv] = {
        DATE: r.DATE || "",
        COUNTERED: r.COUNTERED || "",
        DUE: r.DUE || "",
        INVOICE: inv,
        CUSTOMER: r.CUSTOMER || "",
        PO: r.PO|| "",
        DESCRIPTION: r.DESCRIPTION || "",
        TOTAL: 0
      };
    }

    grouped[inv].TOTAL += parseFloat(r.TOTAL) || 0;

  });

  // =========================
  // SORT
  // =========================
  const sorted = Object.values(grouped).sort((a, b) =>
    new Date(b.DATE) - new Date(a.DATE)
  );

  // =========================
  // DISPLAY TABLE
  // =========================
  let grandTotal = 0;

  sorted.forEach(item => {

    grandTotal += item.TOTAL;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${formatDate(item.DATE)}</td>
      <td>${formatDate(item.COUNTERED)}</td>
      <td>${formatDate(item.DUE)}</td>
      <td>${item.INVOICE}</td>
      <td>${item.CUSTOMER}</td>
      <td>${item.PO}</td>
      <td>${item.DESCRIPTION}</td>
      <td style="text-align:right;">
        ${item.TOTAL.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        })}
      </td>
    `;

    tbody.appendChild(tr);

  });

  // =========================
  // TOTAL ROW
  // =========================
  const trTotal = document.createElement("tr");

  trTotal.className = "total-row";

  trTotal.innerHTML = `
    <td colspan="7" style="text-align:right;">TOTAL</td>
    <td style="text-align:right;">
      ${grandTotal.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}
    </td>
  `;

  tbody.appendChild(trTotal);

  loading.style.display = "none";
  table.style.display = "table";
}

function refreshReceivables() {
  localStorage.removeItem("receivablesData");
  loadReceivables(false);
}

function scheduleMidnightRefresh() {
const now = new Date();

// Calculate the next 12:00 AM
const nextMidnight = new Date();
nextMidnight.setHours(24, 0, 0, 0);

const timeUntilMidnight = nextMidnight.getTime() - now.getTime();

console.log(`Next automatic refresh in ${Math.round(timeUntilMidnight / 1000)} seconds`);

setTimeout(() => {
console.log("Auto refreshing receivables data at midnight...");


// Clear old cached data
localStorage.removeItem("receivablesData");

// Load fresh data
loadReceivables(false);

// Schedule the next midnight refresh
scheduleMidnightRefresh();


}, timeUntilMidnight);
}

// AUTO LOAD
document.addEventListener("DOMContentLoaded", () => {
loadReceivables(true);
scheduleMidnightRefresh();
});

</script>
</body>
</html>
