<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts Receivables</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 20px;
      background: linear-gradient(70deg, gold, orange, orangered);
      color: #222;
    }
    h2 {
      text-align: center;
      margin-bottom: 15px;
      color: #2c3e50;
    }
    .refresh {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: #2c3e50;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #1a242f; }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 15px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      word-break: break-word;
    }
    th {
      background: #34495e;
      color: #fff;
      text-align: center;
    }
    td:nth-child(1) { width: 120px; text-align: center; }
    td:nth-child(2) { width: 120px; text-align: center; }
    td:nth-child(3) { width: 250px; }
    td:nth-child(4) { width: 130px; text-align: right; }
    td:nth-child(5) { width: auto; }
    .total-row {
      font-weight: bold;
      background: #f1f1f1;
    }
    .loading {
      text-align: center;
      padding: 30px 0;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="refresh">
    <button onclick="refreshReceivables()">🔄 Refresh</button>
  </div>

  <div class="card">
    <div id="loading" class="loading">Loading receivables data...</div>
    <table id="arTable" style="display:none;">
      <thead>
        <tr>
          <th>DATE</th>
          <th>INVOICE</th>
          <th>CUSTOMER</th>
          <th>AMOUNT</th>
          <th>REMARKS</th>
        </tr>
      </thead>
      <tbody id="arBody"></tbody>
    </table>
  </div>

<script>
const webAppURL = "https://script.google.com/macros/s/AKfycbyesH41EA5Va9e7LNR_bL_I65C-8P-t5pcO7ZBIwxEGY5kAvdFVmfGGYpYnmTH9Xjs6/exec";

function formatDate(val) {
  if (!val) return "";
  const d = new Date(val);
  if (isNaN(d)) return val;
  return `${d.getDate().toString().padStart(2,"0")}-${d.toLocaleString("en-US",{month:"short"})}-${d.getFullYear()}`;
}

async function loadReceivables(fromCache = true) {
  const loading = document.getElementById("loading");
  const table = document.getElementById("arTable");
  const tbody = document.getElementById("arBody");
  tbody.innerHTML = "";
  loading.style.display = "block";
  table.style.display = "none";

  let data = null;
  if (fromCache) {
    const cached = localStorage.getItem("receivablesData");
    if (cached) {
      try {
        data = JSON.parse(cached);
        console.log("Loaded from localStorage");
      } catch(e) { data = null; }
    }
  }

  if (!data) {
    try {
      const res = await fetch(webAppURL + "?sheet=sales");
      data = await res.json();
      localStorage.setItem("receivablesData", JSON.stringify(data));
      console.log("Fetched new data and saved to cache");
    } catch(err) {
      console.error(err);
      loading.textContent = "Error loading data.";
      return;
    }
  }

  // Filter only PENDING
  const pending = data.filter(r => (r.STATUS || "").toUpperCase() === "PENDING");

  // Group by invoice
  const grouped = {};
  pending.forEach(r => {
    const inv = r.INVOICE || "NO-INVOICE";
    if (!grouped[inv]) {
      grouped[inv] = {
        DATE: r.DATE,
        INVOICE: inv,
        CUSTOMER: r.CUSTOMER || "",
        TOTAL: 0,
        REMARKS: r.REMARKS || ""
      };
    }
    grouped[inv].TOTAL += parseFloat(r.AMOUNT) || 0;
  });

  // Sort by date descending
  const sorted = Object.values(grouped).sort((a,b)=> new Date(b.DATE)-new Date(a.DATE));

  let grandTotal = 0;
  sorted.forEach(item => {
    grandTotal += item.TOTAL;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${formatDate(item.DATE)}</td>
      <td>${item.INVOICE}</td>
      <td>${item.CUSTOMER}</td>
      <td>${item.TOTAL.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td>${item.REMARKS}</td>
    `;
    tbody.appendChild(tr);
  });

  const trTotal = document.createElement("tr");
  trTotal.className = "total-row";
  trTotal.innerHTML = `<td colspan="3" style="text-align:right;">TOTAL</td><td>${grandTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td></td>`;
  tbody.appendChild(trTotal);

  loading.style.display = "none";
  table.style.display = "table";
}

function refreshReceivables() {
  localStorage.removeItem("receivablesData");
  loadReceivables(false);
}

document.addEventListener("DOMContentLoaded", ()=> loadReceivables(true));
</script>
</body>
</html>
