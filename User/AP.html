<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts Payables</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: linear-gradient(90deg, gold, orange, orangered);
  }
  h2 {
    margin-bottom: 10px;
  }
  .ap-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ap-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ap-total {
    font-weight: bold;
    font-size: 16px;
  }
  .refresh-btn {
    cursor: pointer;
    font-size: 18px;
    background: none;
    border: none;
  }
  .refresh-btn:hover {
    color: #007BFF;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    background: white;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px;
  }
  th {
    background-color: #f1f1f1;
    text-align: center;
  }
  td {
    text-align: left;
  }
  tr:hover {
    background-color: #f0f8ff;
  }
  .total-row {
    font-weight: bold;
    background-color: #f9f9f9;
  }
  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.4);
  }
  .modal-content {
    background-color: #fff;
    margin: 5% auto;
    padding: 20px;
    border: 1px solid #ccc;
    width: 80%;
    max-height: 80%;
    overflow-y: auto;
    border-radius: 8px;
    position: relative;
  }
  .close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
  }
  .close:hover {
    color: #000;
  }
  .spinner, .modal-spinner {
    display: none;
    border: 6px solid #f3f3f3;
    border-top: 6px solid #3498db;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
  }
  .spinner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .modal-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }

  
</style>
</head>
<body>

  <div class="ap-header">
    <div class="ap-actions">
      <div class="ap-total">Total: 0.00</div>
      <button class="refresh-btn" onclick="loadAccountsPayables()" title="Refresh">🔄</button>
    </div>
  </div>

  <div id="spinner-ap" class="spinner"></div>
  <table id="apTable">
    <thead>
      <tr>
        <th>No.</th>
        <th>NAME</th>
        <th>AMOUNT</th>
        <th>REMARKS</th>
      </tr>
    </thead>
    <tbody id="apBody"></tbody>
  </table>

  <!-- Modal -->
  <div id="apModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeApModal()">&times;</span>
      <div id="spinner-apModal" class="modal-spinner"></div>
      <h3 id="apModalTitle"></h3>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Debit</th>
            <th>Credit</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody id="apModalBody"></tbody>
      </table>
    </div>
  </div>

<script>
const webAppPayables = "https://script.google.com/macros/s/AKfycbwf2NPUcNlKaGE7LPf5NsXfZuhM1xz_xfA7AMQQv3qdw9FB4bFQk-Ik2V0OVH5YQckh1Q/exec";

async function loadAccountsPayables() {
  const spinner = document.getElementById("spinner-ap");
  spinner.style.display = "block";
  try {
    const res = await fetch(webAppPayables + "?type=summary");
    const data = await res.json();
    const tbody = document.getElementById("apBody");
    tbody.innerHTML = "";
    let grandTotal = 0;
    let counter = 1;

    const filtered = data
      .map(row => ({
        ...row,
        AMOUNT: parseFloat(row.AMOUNT) || 0
      }))
      .filter(row => row.AMOUNT > 0)
      .sort((a, b) => b.AMOUNT - a.AMOUNT);

    filtered.forEach(row => {
      grandTotal += row.AMOUNT;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td style="text-align:center">${counter++}</td>
        <td><a href="#" onclick="openApModal('${row.NAME}')">${row.NAME}</a></td>
        <td style="text-align:right">${row.AMOUNT.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
        <td>${row.REMARKS || ""}</td>
      `;
      tbody.appendChild(tr);
    });

    const trTotal = document.createElement("tr");
    trTotal.classList.add("total-row");
    trTotal.innerHTML = `
      <td colspan="2" style="text-align:right">TOTAL</td>
      <td style="text-align:right">${grandTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td></td>
    `;
    tbody.appendChild(trTotal);

    document.querySelector(".ap-total").textContent =
      "Total: " + grandTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  } catch (err) {
    console.error("Error loading payables:", err);
  } finally {
    spinner.style.display = "none";
  }
}

async function openApModal(name) {
  const modal = document.getElementById("apModal");
  const spinner = document.getElementById("spinner-apModal");
  const title = document.getElementById("apModalTitle");
  const tbody = document.getElementById("apModalBody");

  modal.style.display = "block";
  spinner.style.display = "block";
  tbody.innerHTML = "";
  title.textContent = name;

  try {
    const res = await fetch(webAppPayables + "?type=details&name=" + encodeURIComponent(name));
    const data = await res.json();

    data.forEach(row => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${row.DATE || ""}</td>
        <td>${row.DESCRIPTION || ""}</td>
        <td style="text-align:right">${row.DEBIT || ""}</td>
        <td style="text-align:right">${row.CREDIT || ""}</td>
        <td style="text-align:right">${row.BALANCE || ""}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error("Error loading details:", err);
  } finally {
    spinner.style.display = "none";
  }
}

function closeApModal() {
  document.getElementById("apModal").style.display = "none";
}

window.onclick = function(event) {
  const modal = document.getElementById("apModal");
  if (event.target === modal) modal.style.display = "none";
};

document.addEventListener("DOMContentLoaded", loadAccountsPayables);
</script>
</body>
</html>
