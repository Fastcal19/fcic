<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts Payables</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: linear-gradient(90deg, gold, orange, orangered);
    color: #000;
  }
  h2 { margin-bottom: 10px; }

  .ap-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .ap-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ap-total {
    font-weight: bold;
    font-size: 16px;
  }
  .refresh-btn {
    cursor: pointer;
    font-size: 18px;
    background: none;
    border: none;
  }
  .refresh-btn:hover { color: #007BFF; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px;
  }
  th { background-color: #f1f1f1; text-align: center; }
  td { text-align: left; }
  tr:hover { background-color: #f0f8ff; }
  .total-row {
    font-weight: bold;
    background-color: #f9f9f9;
  }
  #apTable a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
  }
  #apTable a:hover { text-decoration: underline; }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.4);
  }
  .modal-content {
    background-color: #fff;
    margin: 5% auto;
    padding: 20px;
    border: 1px solid #ccc;
    width: 80%;
    max-height: 80%;
    overflow-y: auto;
    border-radius: 8px;
    position: relative;
  }
  .close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
  }
  .close:hover { color: #000; }

  /* Spinners */
  .spinner, .modal-spinner {
    display: none;
    border: 6px solid #f3f3f3;
    border-top: 6px solid #3498db;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    z-index: 1100;
  }
  .spinner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  .modal-spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes spin {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="ap-header">
    <h2></h2>
    <div class="ap-actions">
      <div class="ap-total">Total: 0.00</div>
      <button class="refresh-btn" onclick="loadAccountsPayables(true)" title="Refresh">🔄</button>
    </div>
  </div>

  <div id="spinner-ap" class="spinner"></div>
  <table id="apTable">
    <thead>
      <tr>
        <th>No.</th>
        <th>NAME</th>
        <th>AMOUNT</th>
        <th>REMARKS</th>
      </tr>
    </thead>
    <tbody id="apBody"></tbody>
  </table>

  <!-- Modal -->
  <div id="apModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeApModal()">&times;</span>
      <div id="spinner-apModal" class="modal-spinner"></div>
      <h3 id="apModalTitle"></h3>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Description</th>
            <th>Debit</th>
            <th>Credit</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody id="apModalBody"></tbody>
      </table>
    </div>
  </div>

<script>
const webAppPayables = "https://script.google.com/macros/s/AKfycbwf2NPUcNlKaGE7LPf5NsXfZuhM1xz_xfA7AMQQv3qdw9FB4bFQk-Ik2V0OVH5YQckh1Q/exec";

// ✅ Load main Accounts Payables summary
async function loadAccountsPayables(forceRefresh = false) {
  const spinner = document.getElementById("spinner-ap");
  spinner.style.display = "block";

  let data = [];

  try {
    // ✅ Clear all cached transaction data if refreshing
    if (forceRefresh) {
      Object.keys(localStorage)
        .filter(k => k.startsWith("transactions_"))
        .forEach(k => localStorage.removeItem(k));
      console.log("Cleared all cached transaction data ✅");
    }

    // ✅ Try to load from localStorage
    if (!forceRefresh) {
      const cached = localStorage.getItem("accountsPayablesData");
      if (cached) {
        data = JSON.parse(cached);
        console.log("Loaded from localStorage ✅");
      }
    }

    // ✅ If no data or refresh requested → fetch from Google Apps Script
    if (data.length === 0 || forceRefresh) {
      const res = await fetch(webAppPayables + "?type=summary");
      const text = await res.text();
      try { data = JSON.parse(text); } 
      catch (err) { console.error("Invalid JSON:", text); data = []; }

      // 💾 Save to localStorage
      localStorage.setItem("accountsPayablesData", JSON.stringify(data));
      console.log("Saved to localStorage ✅");
    }

    renderPayablesTable(data);

  } catch (err) {
    console.error("Error loading payables:", err);
  } finally {
    spinner.style.display = "none";
  }
}

function renderPayablesTable(data) {
  const tbody = document.getElementById("apBody");
  tbody.innerHTML = "";
  let grandTotal = 0, counter = 1;

  const filtered = data
    .map(row => ({ ...row, AMOUNT: parseFloat(row.AMOUNT) || 0 }))
    .filter(row => row.AMOUNT > 0)
    .sort((a, b) => b.AMOUNT - a.AMOUNT);

  filtered.forEach(row => {
    grandTotal += row.AMOUNT;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="text-align:center">${counter++}</td>
      <td><a href="#" onclick="openApModal('${row.NAME.replace(/'/g, "\\'")}', false)">${row.NAME}</a></td>
      <td style="text-align:right">${row.AMOUNT.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td>${row.REMARKS || ""}</td>
    `;
    tbody.appendChild(tr);
  });

  const trTotal = document.createElement("tr");
  trTotal.classList.add("total-row");
  trTotal.innerHTML = `
    <td colspan="2" style="text-align:right">TOTAL</td>
    <td style="text-align:right">${grandTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
    <td></td>
  `;
  tbody.appendChild(trTotal);

  document.querySelector(".ap-total").textContent =
    "Total: " + grandTotal.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

// === Modal for AP Transactions ===
function formatAmount(val) {
  const num = parseFloat(val) || 0;
  return num === 0 ? "" : num.toLocaleString(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

async function openApModal(name, forceRefresh = false) {
  const modal = document.getElementById("apModal");
  const title = document.getElementById("apModalTitle");
  const tbody = document.getElementById("apModalBody");
  const spinner = document.getElementById("spinner-apModal");

  modal.style.display = "block";
  title.textContent = name;
  tbody.innerHTML = "";
  spinner.style.display = "block";

  try {
    const cacheKey = "transactions_" + name;
    let transactions = null;

    // ✅ If forceRefresh is true, clear cache
    if (forceRefresh) {
      localStorage.removeItem(cacheKey);
    } else {
      transactions = JSON.parse(localStorage.getItem(cacheKey)) || null;
    }

    // ✅ Fetch fresh data if no cache or after refresh
    if (!transactions) {
      const txRes = await fetch(webAppPayables + "?name=" + encodeURIComponent(name));
      const text = await txRes.text();
      try { transactions = JSON.parse(text); }
      catch { transactions = []; }

      // 💾 Save fresh copy
      localStorage.setItem(cacheKey, JSON.stringify(transactions));
      console.log(`Updated transactions for ${name} ✅`);
    }

    const summaryData = JSON.parse(localStorage.getItem("accountsPayablesData")) || [];
    const supplierSummary = summaryData.find(r => r.NAME === name);
    let runningBalance = supplierSummary ? (parseFloat(supplierSummary.BEGINNING) || 0) : 0;

    if (runningBalance > 0) {
      const year = new Date().getFullYear();
      const balRow = document.createElement("tr");
      balRow.innerHTML = `
        <td>01-Jan-${year}</td>
        <td>Balance forwarded</td>
        <td></td><td></td>
        <td style="text-align:right">${runningBalance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      `;
      tbody.appendChild(balRow);
    }

    if (transactions && transactions.length > 0) {
      transactions.forEach(row => {
        const debit = parseFloat(row.Debit) || 0;
        const credit = parseFloat(row.Credit) || 0;
        runningBalance = runningBalance - debit + credit;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.Date ? formatDate(row.Date) : ""}</td>
          <td>${row.Description || ""}</td>
          <td style="text-align:right">${formatAmount(debit)}</td>
          <td style="text-align:right">${formatAmount(credit)}</td>
          <td style="text-align:right">${runningBalance.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
        `;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:gray">No transactions found</td></tr>`;
    }

  } catch (err) {
    console.error("Error loading transactions:", err);
    tbody.innerHTML = `<tr><td colspan="5" style="color:red;text-align:center">Failed to load data</td></tr>`;
  } finally {
    spinner.style.display = "none";
  }
}

function formatDate(val) {
  if (!val) return "";
  try {
    const d = new Date(val);
    if (isNaN(d)) return val;
    const day = String(d.getDate()).padStart(2, '0');
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", 
                        "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const month = monthNames[d.getMonth()];
    const year = String(d.getFullYear()).slice(-2);
    return `${day}-${month}-${year}`;
  } catch (e) {
    return val;
  }
}

function closeApModal() {
  document.getElementById("apModal").style.display = "none";
}

window.onclick = function(event) {
  const modal = document.getElementById("apModal");
  if (event.target === modal) modal.style.display = "none";
};

// ✅ Auto-load summary when page opens
document.addEventListener("DOMContentLoaded", () => loadAccountsPayables(false));
</script>
</body>
</html>
