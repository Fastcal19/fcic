<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; display:flex; height:100vh; }
    .main{ flex:1; background:#e6e7ea; padding:20px; overflow:hidden; display:flex; flex-direction:column;}
  
    .calendar-container{ flex:1; display:flex; flex-direction:column; overflow:hidden;}
    .calendar{ flex:1; background:#fb923c; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.2); padding:15px; display:flex; flex-direction:column; overflow:hidden;}
    .calendar-header{ display:flex; justify-content:center; align-items:center; margin-bottom:4px; gap:10px;}
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(6, 1fr);
      flex: 1;
      gap: 5px;
      height: 100%;
    }
    .day-name {
      font-weight: bold;
      text-align: center;
      background: #FFC107;
      border-radius: 6px;
      display: flex;
      padding: 10px;
      align-items: center;
      justify-content: center;
      font-size: 0.9em;
    }
    .day{ padding:5px; border-radius:5px; cursor:pointer; background:#f5deb3; position:relative; overflow:hidden; display:flex; flex-direction:column;}
    .day * {pointer-events: none;}
    .day{cursor:default;}
    .day.has-note { cursor: hand; }
    .day.has-note:hover { background: #deb887; }
    .day-number{ font-size:0.85em; font-weight:bold; color:darkred; position:absolute; top:5px; right:6px;}
    .today{ background:linear-gradient(135deg, #FFA500, #FFD700); font-weight:bold; box-shadow:0 0 6px rgba(0,0,0,0.4);}
    .note{ font-size:0.7em; margin-top:18px; color:darkgreen; text-align:left; word-break:break-word; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;}
    .faded{ background:#eee !important; color:#999 !important; cursor:default !important; pointer-events:none;}

    /* 📱 Mobile layout */
@media (max-width: 768px) {
  body { display: block; }
  .header, .cards, .notes-columns, #approvalModal { display: none !important; }
  .calendar-container { width: 100%; height: 100vh; display: flex; }
  .calendar { width: 100%; height: 100%; border-radius: 0; padding: 10px; padding-bottom: env(safe-area-inset-bottom); }
}

#noteModal {
  display: none;
  position: fixed;
  inset: 0;
  width: 450px;
  height: auto;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 9999;
  margin: auto;
}

#noteModal .modal-content {
  width: 100%;
  height: 100%;
  max-width: none;
  border-radius: 0;
  background: #fff;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
}

#noteModal h3 {
  margin: 0 0 10px 0;
  text-align: center;
  font-size: 1.2em;
  background: #f97316;
  color: white;
  padding: 10px;
  border-radius: 8px;
}

#noteText {
  flex: 1;
  width: 100%;
  font-size: 1em;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px;
  box-sizing: border-box;
  resize: none;
  outline: none;
  margin-top: 10px;
  overflow-y: auto;
}

#noteModal .modal-footer {
  position: sticky;
  bottom: 0;
  background: #fff;
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-between;
  gap: 10px;
  z-index: 2;
}

.close-btn {
  flex: 1;
  padding: 14px;
  font-size: 1em;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  background: #b22222;
}
  </style>
</head>
<body>
  <div class="main">
      <div class="calendar-container">
        <div class="calendar">
          <div class="calendar-header">
            <button onclick="prevMonth()">&#8592;</button>
            <h2 id="monthYear"></h2>
            <button onclick="nextMonth()">&#8594;</button>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Notes Modal -->
  <div id="noteModal" class="modal">
    <div class="modal-content">
      <h3>Notes</h3>
      <h4 id="modalDate" style="text-align:center; color:#333; margin-top:-5px;"></h4>
      <textarea id="noteText" placeholder="Enter your note..."></textarea>
      <div class="modal-footer">
        <button class="close-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxfQ_h4sW1QHUHR9zImCxpJ4h1lDajPJWIO6PVUk04MNkDyGV3poXMjijL3KQh6XilOWA/exec";

  const calendarGrid = document.getElementById("calendarGrid");
  const monthYear = document.getElementById("monthYear");
  const noteModal = document.getElementById("noteModal");
  const modalDate = document.getElementById("modalDate");
  const noteText = document.getElementById("noteText");

  let currentDate = new Date();
  let selectedDate = null;
  let notes = {};

  // 🔧 Normalize any date format to YYYY-MM-DD
  function normalizeDateKey(dateInput) {
    if (!dateInput) return "";
    const d = new Date(dateInput);
    if (isNaN(d)) {
      const t = String(dateInput).split("T")[0];
      return t;
    }
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  async function loadNotes() {
    try {
      const res = await fetch(API_URL + "?type=notes");
      const json = await res.json();
      notes = {};
      json.forEach(n => {
        const key = normalizeDateKey(n.date);
        notes[key] = n.note;
      });
      renderCalendar();
    } catch (err) {
      console.error("Error loading notes:", err);
    }
  }

  function renderCalendar() {
    calendarGrid.innerHTML = "";
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    monthYear.textContent = currentDate.toLocaleString("default", { month: "long" }) + " " + year;

    const isMobile = window.innerWidth <= 768;
    const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    dayNames.forEach(d => {
      const dn = document.createElement("div");
      dn.className = "day-name";
      dn.textContent = isMobile ? d.slice(0,3) : d.toUpperCase();
      calendarGrid.appendChild(dn);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    for (let i = firstDay - 1; i >= 0; i--) {
      const dayDiv = document.createElement("div");
      dayDiv.className = "day faded";
      dayDiv.innerHTML = `<div class="day-number">${daysInPrevMonth - i}</div>`;
      calendarGrid.appendChild(dayDiv);
    }

    const today = new Date();
    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = normalizeDateKey(`${year}-${month+1}-${day}`);
      const savedNote = notes[dateKey] || "";
      const dayDiv = document.createElement("div");
      dayDiv.className = "day";
      if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
        dayDiv.classList.add("today");
      }
      if (savedNote.trim() !== "") {
        dayDiv.classList.add("has-note");
      }
      dayDiv.innerHTML = `
        <div class="day-number">${day}</div>
        ${savedNote ? `<div class="note">${savedNote}</div>` : ""}
      `;
      dayDiv.onclick = () => {
        if (savedNote.trim() !== "") openModal(dateKey, savedNote);
        else console.log("No note for this day");
      };
      calendarGrid.appendChild(dayDiv);
    }

    const totalCells = firstDay + daysInMonth;
    const nextDays = 42 - totalCells;
    for (let i = 1; i <= nextDays; i++) {
      const dayDiv = document.createElement("div");
      dayDiv.className = "day faded";
      dayDiv.innerHTML = `<div class="day-number">${i}</div>`;
      calendarGrid.appendChild(dayDiv);
    }
  }

  function openModal(dateKey, savedNote) {
    selectedDate = dateKey;
    modalDate.textContent = "Notes for " + dateKey;
    noteText.value = savedNote;
    noteModal.style.display = "flex";
  }
  function closeModal() { noteModal.style.display = "none"; }

  function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
  function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

  document.querySelector("#noteModal .close-btn").addEventListener("click", closeModal);

  loadNotes();
  </script>
</body>
</html>
