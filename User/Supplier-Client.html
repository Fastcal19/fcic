<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Client & Supplier Management</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    margin:0;
    background:linear-gradient(100deg,orange,gold,orangered);
}

/*=============================
Container
=============================*/

.container{
    width:95%;
    margin:20px auto;
    background:#fff;
    border-radius:8px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:15px;
}

.section-title{
    font-size:22px;
    font-weight:bold;
    border-left:5px solid #1a73e8;
    padding-left:10px;
}

/*=============================
Search
=============================*/

#searchInput{
    width:350px;
    padding:10px 15px;
    border:2px solid #1a73e8;
    border-radius:5px;
    outline:none;
    font-size:14px;
}

#searchInput:focus{
    box-shadow:0 0 6px rgba(26,115,232,.35);
}

/*=============================
Buttons
=============================*/

.add-btn{
    background:#1a73e8;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:5px;
    cursor:pointer;
    transition:.2s;
}

.add-btn:hover{
    background:#1257be;
}

/*=============================
Table
=============================*/

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    font-size:13px;
}

thead th{
    background:#eaf2ff;
    text-align:center;
    font-weight:bold;
}

tbody td{
    vertical-align:top;
}

/* widths */

th:nth-child(1){width:45px;}
th:nth-child(2){width:90px;}
th:nth-child(3){width:170px;}
th:nth-child(4){width:35%;}
th:nth-child(5){width:35%;}
th:nth-child(6){width:120px;}
th:nth-child(7){width:18%;}

/*=============================
Main Row
=============================*/

.main-row{
    cursor:pointer;
    transition:.2s;
}

.main-row:hover{
    background:#fff5e0;
}

/*=============================
Expanded Row
=============================*/

.detail-row{
    display:none;
    background:#fafafa;
}

.expandCell{
    padding:0 !important;
    border-top:none !important;
}

.expandBox{
    padding:12px 18px;
    background:#fafafa;
    line-height:1.7;
    font-size:14px;
}

.expandItem{
    margin:3px 0;
}

.expandLabel{
    display:inline-block;
    width:180px;
    font-weight:bold;
}

/*=============================
Contacts
=============================*/

.contactGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:12px;
}

.contactCard{
    background:#fff;
    border:1px solid #ddd;
    border-left:4px solid #1976d2;
    border-radius:6px;
    padding:12px 14px;
}

.contactName{
    font-weight:700;
    color:#1565c0;
    margin-bottom:3px;
}

.contactPosition{
    color:#666;
    font-size:13px;
    margin-bottom:10px;
}

.contactItem{
    font-size:13px;
    margin:3px 0;
}

/*=============================
Attachments
=============================*/

.attachments{
    margin-left:180px;
    margin-top:5px;
}

.attachments a{
    display:inline-block;
    margin:3px 8px 3px 0;
    padding:4px 10px;
    background:#1a73e8;
    color:#fff;
    border-radius:4px;
    text-decoration:none;
    font-size:12px;
}

.attachments a:hover{
    background:#1257be;
}

/*=============================
Spinner
=============================*/

#spinnerOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:9999;
}

#spinnerOverlay.active{
    opacity:1;
    pointer-events:auto;
}

.loader{
    width:60px;
    height:60px;
    border-radius:50%;
    border:8px solid #eee;
    border-top:8px solid #1a73e8;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/*=============================
Modal
=============================*/

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:999;
}

.modal-content{
    width:90%;
    max-width:900px;
    margin:40px auto;
    background:#fff;
    border-radius:8px;
    position:relative;
    overflow:hidden;
}

.close-btn{
    position:absolute;
    right:15px;
    top:8px;
    font-size:28px;
    cursor:pointer;
    z-index:5;
}

iframe{
    width:100%;
    height:820px;
    border:none;
}

.expandSection{
    margin-top:18px;
}

.expandSection h4{
    margin:0 0 10px;
    color:#1a73e8;
    font-size:15px;
    border-bottom:2px solid #e5e5e5;
    padding-bottom:5px;
}

.miniTable{
    width:100%;
    border-collapse:collapse;
    margin-top:8px;
    table-layout:auto;
    font-size:13px;
}

.miniTable th{
    background:#f4f7fb;
    color:#333;
    padding:8px;
    border:1px solid #ddd;
    text-align:left;
}

.miniTable td{
    padding:8px;
    border:1px solid #ddd;
}

.miniTable tr:nth-child(even){
    background:#fcfcfc;
}

.miniTable tr:hover{
    background:#eef5ff;
}

.fileButtons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.fileBtn{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:6px 12px;
    border-radius:5px;
    background:#1a73e8;
    color:#fff;
    text-decoration:none;
    font-size:13px;
}

.fileBtn:hover{
    background:#1257be;
}

.fileBtn{
    display:inline-block;
    padding:6px 12px;
    background:#1976d2;
    color:#fff;
    text-decoration:none;
    border-radius:4px;
    font-size:13px;
}

.fileBtn:hover{
    background:#0d5cb6;
}

.infoCard{
    background:#fff;
    border:1px solid #ddd;
    border-left:4px solid #1976d2;
    border-radius:6px;
    padding:10px 14px;
    margin-bottom:8px;
    line-height:1.6;
}

.infoCard strong{
    font-size:15px;
    color:#1976d2;
}

.infoCard small{
    color:#666;
}

.sectionHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #ddd;
    padding-bottom:8px;
    margin-bottom:15px;
}

.sectionHeader h4{
    margin:0;
    color:#1a73e8;
    font-size:18px;
}

.editBtn{
    background:#ff9800;
    color:#fff;
    border:none;
    border-radius:5px;
    padding:7px 16px;
    cursor:pointer;
    font-size:13px;
    font-weight:bold;
    transition:.2s;
}

.editBtn:hover{
    background:#f57c00;
}

.attachmentIcons{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.attachBtn{
    display:flex;
    align-items:center;
    gap:6px;

    padding:8px 14px;

    background:#1976d2;
    color:#fff;
    text-decoration:none;

    border-radius:6px;

    font-size:13px;
    font-weight:600;

    transition:.2s;
}

.attachBtn:hover{
    background:#1258c7;
    transform:translateY(-1px);
}
</style>
</head>

<body>

<div id="spinnerOverlay">
    <div class="loader"></div>
</div>

<div class="container">

    <div class="section-header">

        <div class="section-title">
            Client & Supplier Management
        </div>

        <div style="display:flex;gap:10px;align-items:center;">

            <input
                id="searchInput"
                placeholder="🔍 Search by Name, TIN, Address..."
                onkeyup="searchSupplier()">

            <button
                class="add-btn"
                onclick="openModal()">
                + Add
            </button>

            <button
                class="add-btn"
                style="background:#28a745"
                onclick="refreshData()">
                ⟳ Refresh
            </button>

        </div>

    </div>

    <table id="supplierTable">

        <thead>

        <tr>

            <th>No</th>
            <th>ID</th>
            <th>TIN</th>
            <th>Business Name</th>
            <th>Address</th>
        </tr>

        </thead>

        <tbody></tbody>

    </table>

</div>

<!-- Add Supplier Modal -->

<div id="addModal" class="modal">

    <div class="modal-content">

        <span class="close-btn"
              onclick="closeModal()">&times;</span>

        <iframe src="AddNew.html"></iframe>

    </div>

</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyfpAo2Gl5pOWvx4Es2gdOOfZL2pq7MyHKvfCz9qI4prwanJne3_cLtVqsHFao927YBig/exec";

let supplierData = [];

/*========================================
Spinner
========================================*/

function showSpinner(){
    document.getElementById("spinnerOverlay").classList.add("active");
}

function hideSpinner(){
    document.getElementById("spinnerOverlay").classList.remove("active");
}

/*========================================
Load
========================================*/

window.onload=()=>{

    const cache=localStorage.getItem("supplierData");

    if(cache){

        supplierData=JSON.parse(cache);
        displayTable(supplierData);

    }else{

        fetchSuppliers();

    }

};

/*========================================
Fetch
========================================*/

function fetchSuppliers(){

    showSpinner();

    fetch(WEBAPP_URL,{
        method:"POST",
        body:JSON.stringify({
            action:"loadData"
        })
    })

    .then(r=>r.json())

    .then(data=>{

        supplierData=data.sort((a,b)=>
            (a.bname||"").localeCompare(b.bname||"")
        );

        localStorage.setItem(
            "supplierData",
            JSON.stringify(supplierData)
        );

        displayTable(supplierData);

    })

    .finally(hideSpinner);

}

/*========================================
Search
========================================*/

function searchSupplier(){

    const txt=document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered=supplierData.filter(r=>

        (r.bname||"").toLowerCase().includes(txt) ||

        (r.tin||"").toLowerCase().includes(txt) ||

        (r.address||"").toLowerCase().includes(txt) ||

        (r.cType||"").toLowerCase().includes(txt) ||

        (r.nature||"").toLowerCase().includes(txt)

    );

    displayTable(filtered);

}

/*========================================
Display
========================================*/

function displayTable(data){

    const tbody=document.querySelector("#supplierTable tbody");
    tbody.innerHTML="";

    data.forEach((r,index)=>{

        /*==========================
        Main Row
        ==========================*/

        const row=document.createElement("tr");
        row.className="main-row";

        row.innerHTML=`
            <td>${index+1}</td>
            <td>${r.supplierID||""}</td>
            <td>${r.tin||""}</td>
            <td>${r.bname||""}</td>
            <td>${r.address||""}</td>
        `;

        /*==========================
        CONTACTS TABLE
        ==========================*/

        const contacts = Array.isArray(r.contacts)
    ? r.contacts
    : JSON.parse(r.contacts || "[]");

console.log(contacts);

let contactsTable = "";

if (contacts.length) {

contactsTable = `

${contacts.length ? `

<div class="expandSection">

    <div class="sectionHeader">
        <h4>Contact Persons</h4>
    </div>

    <div class="contactGrid">

        ${contacts.map(c=>`

        <div class="contactCard">

            <div class="contactName">
                ${c.name || "-"}
            </div>

            <div class="contactPosition">
                ${c.position || ""}
            </div>

            ${c.number ? `
            <div class="contactItem">
                📞 ${c.number}
            </div>
            ` : ""}

            ${c.email ? `
            <div class="contactItem">
                ✉ ${c.email}
            </div>
            ` : ""}

        </div>

        `).join("")}

    </div>

</div>

` : ""}
`;

}
        /*==========================
        BANKS TABLE
        ==========================*/

const banks = Array.isArray(r.banks)
    ? r.banks
    : (typeof r.banks === "string" && r.banks
        ? JSON.parse(r.banks)
        : []);

let banksTable = "";

if (banks.length) {

banksTable = `
<div class="expandSection">

<h4>Bank Accounts</h4>

${banks.map(b=>`

<div class="infoCard">

    <strong>${b.bankName || "-"}</strong><br>

    Account Name: ${b.accName || "-"}<br>

    Account No.: ${b.accNo || "-"}

</div>

`).join("")}

</div>
`;

}
        /*==========================
        ATTACHMENTS
        ==========================*/

        const attachmentsHTML = `

<div class="expandSection">

    <div class="sectionHeader">
        <h4>Attachments</h4>
    </div>

    <div class="attachmentIcons">

        ${
            r.dtiSecFile
            ? `<a class="attachBtn" href="${r.dtiSecFile}" target="_blank">
                    📄 DTI / SEC
               </a>`
            : ""
        }

        ${
            r.permitFile
            ? `<a class="attachBtn" href="${r.permitFile}" target="_blank">
                    📄 Permit
               </a>`
            : ""
        }

        ${
            r.bir2303File
            ? `<a class="attachBtn" href="${r.bir2303File}" target="_blank">
                    📄 BIR 2303
               </a>`
            : ""
        }

        ${
            r.clientListFile
            ? `<a class="attachBtn" href="${r.clientListFile}" target="_blank">
                    📄 Company Profile
               </a>`
            : ""
        }

    </div>

</div>

`;

        /*==========================
        DETAIL ROW
        ==========================*/

        const detail=document.createElement("tr");
        detail.className="detail-row";
        detail.style.display="none";

        detail.innerHTML=`

        <td colspan="5" class="expandCell">

            <div class="expandBox">

                <div class="expandSection">

                    <div class="sectionHeader">

    <h4>Company Information</h4>

    <button class="editBtn"
        onclick="event.stopPropagation();openCompanyProfile('${r.supplierID}')">
        ✏ Edit
    </button>

</div>

                    <table class="miniTable">

                        <tr>
                           <th style="width:220px;">VAT Type</th>
                            <td>${r.vatType||""}</td>
                        </tr>

                        <tr>
                            <th>Registration Type</th>
                            <td>${r.regType||""}</td>
                        </tr>

                        <tr>
                            <th>Registration No.</th>
                            <td>${r.regNo||""}</td>
                        </tr>

                        <tr>
                            <th>Role</th>
                            <td>${r.cType||""}</td>
                        </tr>

                        <tr>
                            <th>Supplier Type</th>
                            <td>${r.supplierType||""}</td>
                        </tr>

                        <tr>
                            <th>Category</th>
                            <td>${r.category||""}</td>
                        </tr>

                        <tr>
                            <th>Payment Terms</th>
                            <td>${r.terms||""}</td>
                        </tr>

                        <tr>
                            <th>Nature of Business</th>
                            <td>${r.nature||""}</td>
                        </tr>

                    </table>

                </div>

                ${contactsTable}

                ${banksTable}

                ${attachmentsHTML}

            </div>

        </td>

        `;

        /*==========================
        EXPAND / COLLAPSE
        ==========================*/

        row.onclick=()=>{

            document.querySelectorAll(".detail-row").forEach(dr=>{

                if(dr!==detail){

                    dr.style.display="none";

                }

            });

            detail.style.display=
                detail.style.display==="table-row"
                ? "none"
                : "table-row";

        };

        tbody.appendChild(row);
        tbody.appendChild(detail);

    });

}
/*========================================
Modal
========================================*/

function openModal() {

    showSpinner();

    const modal = document.getElementById("addModal");
    const iframe = modal.querySelector("iframe");

    iframe.onload = function () {
        hideSpinner();
        modal.style.display = "block";
        iframe.onload = null;
    };

    iframe.src = "AddNew.html?id=";
}

function closeModal(){

    document.getElementById("addModal").style.display="none";

    refreshData();

}

window.onclick=function(e){

    const modal=document.getElementById("addModal");

    if(e.target===modal){

        modal.style.display="none";

    }

};

/*========================================
Edit
========================================*/

function openCompanyProfile(id) {

    showSpinner();

    const modal = document.getElementById("addModal");
    const iframe = modal.querySelector("iframe");

    // Prevent duplicate events
    iframe.onload = function () {
        hideSpinner();
        modal.style.display = "block";
        iframe.onload = null;
    };

    iframe.src = "EditCompany.html?id=" + encodeURIComponent(id);
}

/*========================================
Refresh
========================================*/

function refreshData(){

    localStorage.removeItem("supplierData");

    fetchSuppliers();

}
</script>

</body>
</html>
