<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Client & Supplier Management</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(100deg, orange, gold, orangered);
  }

  .container {
    margin: 20px auto;
    width: 95%;
    background: white;
    padding: 20px;
    border-radius: 8px;
  }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .section-title {
    font-size: 20px;
    font-weight: bold;
    border-left: 5px solid #1a73e8;
    padding-left: 10px;
  }

  #searchInput {
    width: 350px;
    padding: 10px 14px;
    font-size: 15px;
    border: 2px solid #1a73e8;
    border-radius: 5px;
    outline: none;
    transition: 0.2s;
  }

  #searchInput:focus {
    box-shadow: 0 0 5px #1a73e8;
  }

  .add-btn {
    background: #1a73e8;
    padding: 10px 18px;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }

  .add-btn:hover {
    background: #155fc7;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  table th, table td {
    border: 1px solid #ccc;
    padding: 8px;
  }

  table th {
    background: #e8eefc;
    text-align: center;
  }

  table td {
    text-align: left;
  }

  table tbody tr {
    transition: background 0.2s, transform 0.1s;
    cursor: pointer;
  }

  table tbody tr:hover {
    background: salmon;
    transform: scale(1.01);
  }

  /* -------------------------
     CENTERED SPINNER OVERLAY
     ------------------------- */
  #spinnerOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  #spinnerOverlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .loader {
    border: 8px solid #f3f3f3;
    border-top: 8px solid #1a73e8;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Modal styles */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.5);
  }

  .modal-content {
    background-color: #fefefe;
    margin: 50px auto;
    padding: 20px;
    border-radius: 8px;
    width: 90%;
    max-width: 900px;
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: 10px; right: 15px;
    font-size: 24px;
    font-weight: bold;
    color: #333;
    cursor: pointer;
  }

  iframe {
    width: 100%;
    height: 800px;
    border: none;
  }

  /* Fixed column width */
  table {
    table-layout: fixed;
  }

  table th:nth-child(1) { width: 1%; }
  table th:nth-child(2) { width: 3%; }
  table th:nth-child(3) { width: 8%; }
  table th:nth-child(4) { width: 25%; }
  table th:nth-child(5) { width: 25%; }
  table th:nth-child(6) { width: 5%; }
  table th:nth-child(7) { width: 15%; }

</style>
</head>

<body>

<!-- 🔵 SPINNER OVERLAY (CENTERED) -->
<div id="spinnerOverlay">
  <div class="loader"></div>
</div>

<div class="container">

  <div class="section-header">
    <div class="section-title">Client & Supplier Management</div>
    <div style="display:flex; gap:10px;">
      <input id="searchInput" placeholder="🔍 Search by Name, TIN, Address..." onkeyup="searchSupplier()">
      <button class="add-btn" onclick="openModal()">+ Add</button>
      <button class="add-btn" style="background:#28a745;" onclick="refreshData()">⟳ Refresh</button>
    </div>
  </div>

  <table id="supplierTable">
    <thead>
      <tr>
        <th>NO</th>
        <th>ID</th>
        <th>TIN</th>
        <th>BUSINESS NAME</th>
        <th>ADDRESS</th>
        <th>ROLE</th>
        <th>NATURE OF BUSINESS</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<!-- MODAL -->
<div id="addModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <iframe src="AddNew.html"></iframe>
  </div>
</div>

<script>
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwd_QA3xMJNBYJLP2w9NT38BxeIEQD1TBPYPOBIctyYeWtwJ9N408flzJ20ztfmkMRr7g/exec"; 
let supplierData = [];

// ------------------
// Spinner functions
// ------------------
function showSpinner() {
  document.getElementById("spinnerOverlay").classList.add("active");
}

function hideSpinner() {
  document.getElementById("spinnerOverlay").classList.remove("active");
}

// Load data on page load
window.onload = function() {
  const savedData = localStorage.getItem("supplierData");
  if (savedData) {
    supplierData = JSON.parse(savedData);
    displayTable(supplierData);
  } else {
    fetchSuppliers();
  }
};

function fetchSuppliers() {
  showSpinner();

  fetch(WEBAPP_URL, {
    method: "POST",
    body: JSON.stringify({ action: "loadData" })
  })
  .then(res => res.json())
  .then(data => {
    supplierData = data.sort((a, b) => (a.bname || "").localeCompare(b.bname || ""));
    localStorage.setItem("supplierData", JSON.stringify(supplierData));
    displayTable(supplierData);
  })
  .finally(hideSpinner);
}

function searchSupplier() {
  const value = document.getElementById("searchInput").value.toLowerCase();
  const filtered = supplierData.filter(r =>
    (r.bname || "").toLowerCase().includes(value) ||
    (r.tin || "").toLowerCase().includes(value) ||
    (r.address || "").toLowerCase().includes(value) ||
    (r.ctype || "").toLowerCase().includes(value) ||
    (r.nature || "").toLowerCase().includes(value)
  );
  displayTable(filtered);
}

function displayTable(data) {
  const tbody = document.querySelector("#supplierTable tbody");
  tbody.innerHTML = "";

  data.forEach((r, index) => {
    const row = document.createElement("tr");
    
    row.innerHTML = `
      <td>${index + 1}</td>
      <td>${r.supplierID || ""}</td>
      <td>${r.tin || ""}</td>
      <td>${r.bname || ""}</td>
      <td>${r.address || ""}</td>
      <td>${r.cType || ""}</td>
      <td>${r.nature || ""}</td>
    `;

    row.onclick = () => openCompanyProfile(r.supplierID);

    tbody.appendChild(row);
  });
}

function openModal() {
  const modal = document.getElementById("addModal");
  const iframe = modal.querySelector("iframe");

  iframe.src = "Supplier-Client.html?id=";
  modal.style.display = "block";
}

function openCompanyProfile(id) {
  const modal = document.getElementById("addModal");
  const iframe = modal.querySelector("iframe");

  iframe.src = "EditCompany.html?id=" + encodeURIComponent(id);
  modal.style.display = "block";
}

function closeModal() {
  document.getElementById("addModal").style.display = "none";
  refreshData();
}

window.onclick = function(event) {
  const modal = document.getElementById("addModal");
  if (event.target == modal) modal.style.display = "none";
}

function refreshData() {
  showSpinner();

  fetch(WEBAPP_URL, {
    method: "POST",
    body: JSON.stringify({ action: "loadData" })
  })
  .then(res => res.json())
  .then(data => {
    supplierData = data.sort((a, b) => (a.bname || "").localeCompare(b.bname || ""));
    localStorage.setItem("supplierData", JSON.stringify(supplierData));
    displayTable(supplierData);
  })
  .finally(hideSpinner);
}
</script>

</body>
</html>
