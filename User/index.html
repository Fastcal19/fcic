<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fast Cal Industrial Corp</title>

<style>
/* ===== YOUR ORIGINAL STYLES (UNCHANGED) ===== */
body{margin:0;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:orangered}
header{background:orangered;color:#000;padding:10px 20px;text-align:center;font-weight:bold;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
footer{background:darkgray;color:#fff;text-align:center;padding:10px;font-size:14px;box-shadow:0 -2px 6px rgba(0,0,0,.3)}
.sidebar{position:fixed;top:0;left:0;height:100vh;width:220px;background:linear-gradient(10deg,gold,orangered);padding:20px;transform:translateX(-100%);transition:.3s;z-index:2000}
.sidebar.active{transform:translateX(0)}
.main{flex:1;background:#ccc;display:flex;flex-direction:column;overflow:hidden}
iframe{flex:1;border:none}

/* ===== CHAT STYLES ===== */
#chatToggle{
position:fixed;bottom:70px;right:10px;width:55px;height:55px;
border-radius:50%;background:#333;color:#fff;font-size:22px;
display:flex;align-items:center;justify-content:center;z-index:6000;cursor:pointer
}
#chatBadge{
position:absolute;top:6px;right:6px;background:red;color:#fff;
font-size:11px;border-radius:50%;padding:2px 6px;display:none
}
#chatBox{
position:fixed;bottom:70px;right:10px;width:95%;height:80%;
background:#fff;border-radius:12px;display:none;flex-direction:column;
box-shadow:0 5px 20px rgba(0,0,0,.4);z-index:6000
}
#chatHeader{
padding:10px;font-weight:bold;background:orangered;
display:flex;justify-content:space-between;align-items:center
}
#chatBody{display:flex;flex:1;overflow:hidden}
#chatUsers{
width:140px;background:#f4f4f4;padding:8px;font-size:13px;
overflow-y:auto;border-right:1px solid #ccc
}
#chatUsers div{cursor:pointer;padding:4px}
#chatUsers div:hover{background:#ddd}
#chatMessages{flex:1;padding:8px;overflow-y:auto}
.chat-user{color:orangered;font-weight:bold}
#chatInput{display:flex;border-top:1px solid #ccc}
#chatInput input{flex:1;border:none;padding:8px}
#chatInput button{background:#333;color:#fff;border:none;padding:0 12px}
</style>
</head>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<script>
firebase.initializeApp({
apiKey:"AIzaSyAnulgPqKSI8Y_mMOTCof6joYscT4FLCXg",
authDomain:"fcic-7f3c1.firebaseapp.com",
databaseURL:"https://fcic-7f3c1-default-rtdb.firebaseio.com",
projectId:"fcic-7f3c1",
storageBucket:"fcic-7f3c1.appspot.com"
});
const db=firebase.database();
const storage=firebase.storage();
</script>

<!-- CHAT UI -->
<div id="chatToggle">💬<span id="chatBadge">0</span></div>

<div id="chatBox">
  <div id="chatHeader">
    <span id="roomTitle">Global Chat</span>
    <span id="chatClose">✖</span>
  </div>

  <div id="chatBody">
    <div id="chatUsers">
      <b>Users</b><hr>
      <button onclick="createGroup()">➕ Group</button><hr>
    </div>
    <div id="chatMessages"></div>
  </div>

  <div id="chatInput">
    <input type="file" id="fileInput" hidden>
    <button onclick="fileInput.click()">📎</button>
    <input id="chatText" placeholder="Type message...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
const username=localStorage.getItem("username")||"User";
let currentRoom="global";
let currentRef=null;
let chatOpen=false;

/* ===== ROOM HELPERS ===== */
function privateRoom(a,b){return "private_"+[a,b].sort().join("_")}
function groupRoom(n){return "group_"+n.replace(/\s+/g,"_")}

/* ===== OPEN CHAT ===== */
chatToggle.onclick=()=>{chatBox.style.display="flex";chatOpen=true;clearUnread(currentRoom)}
chatClose.onclick=()=>{chatBox.style.display="none";chatOpen=false}

/* ===== ONLINE USERS ===== */
db.ref("onlineUsers/"+username).set({name:username});
db.ref("onlineUsers/"+username).onDisconnect().remove();

db.ref("onlineUsers").on("value",s=>{
chatUsers.innerHTML="<b>Users</b><hr><button onclick='createGroup()'>➕ Group</button><hr>";
s.forEach(u=>{
if(u.key!==username){
const d=document.createElement("div");
d.textContent="👤 "+u.key;
d.onclick=()=>openPrivate(u.key);
chatUsers.appendChild(d);
}});
loadGroups();
});

/* ===== GROUPS ===== */
function createGroup(){
const name=prompt("Group name");
if(!name)return;
const r=groupRoom(name);
db.ref("chatRooms/"+r+"/members/"+username).set(true);
openRoom(r,name);
}

function loadGroups(){
db.ref("chatRooms").once("value",s=>{
s.forEach(r=>{
if(r.key.startsWith("group_")&&r.child("members/"+username).exists()){
const d=document.createElement("div");
d.textContent="👥 "+r.key.replace("group_","");
d.onclick=()=>openRoom(r.key,d.textContent);
chatUsers.appendChild(d);
}});
});
}

/* ===== OPEN ROOMS ===== */
function openPrivate(user){
openRoom(privateRoom(username,user),"Chat with "+user);
}

function openRoom(room,title){
currentRoom=room;
roomTitle.textContent=title;
chatMessages.innerHTML="";
clearUnread(room);
if(currentRef)currentRef.off();
currentRef=db.ref("chatRooms/"+room+"/messages").limitToLast(100);
currentRef.on("child_added",s=>renderMsg(s.val()));
}

/* ===== MESSAGES ===== */
function renderMsg(m){
const d=document.createElement("div");
if(m.file){
d.innerHTML=`<span class='chat-user'>${m.user}:</span>
<a href='${m.file}' target='_blank'>📎 File</a>`;
}else{
d.innerHTML=`<span class='chat-user'>${m.user}:</span> ${m.text}`;
}
chatMessages.appendChild(d);
chatMessages.scrollTop=chatMessages.scrollHeight;
if(!chatOpen&&m.user!==username)notify(currentRoom);
}

function sendMessage(){
if(!chatText.value.trim())return;
db.ref("chatRooms/"+currentRoom+"/messages").push({
user:username,text:chatText.value,time:Date.now()
});
chatText.value="";
}

/* ===== FILE ===== */
fileInput.onchange=()=>{
const f=fileInput.files[0];
if(!f)return;
storage.ref("chatFiles/"+Date.now()+"_"+f.name).put(f)
.then(s=>s.ref.getDownloadURL())
.then(url=>{
db.ref("chatRooms/"+currentRoom+"/messages").push({
user:username,file:url,time:Date.now()
});
});
};

/* ===== UNREAD ===== */
function notify(room){
db.ref("userUnread/"+username+"/"+room).transaction(v=>(v||0)+1);
}
function clearUnread(room){
db.ref("userUnread/"+username+"/"+room).remove();
}
db.ref("userUnread/"+username).on("value",s=>{
let t=0;s.forEach(r=>t+=r.val());
chatBadge.style.display=t? "block":"none";
chatBadge.textContent=t;
});

/* DEFAULT */
openRoom("global","Global Chat");
</script>

</body>
</html>
