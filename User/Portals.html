<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>Portals | Fast Cal Industrial Corp</title>

  <style>
    /* === Global Styles === */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background: gray;
      color: black;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* === Main Container === */
    .main-container {
      background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%);
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      width: 95%;
      max-width: 95%;
      margin: 20px auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
    }

    /* === Portals Grid === */
    #portalsPage {
      width: 100%;
    }

    #portalsPage h2 {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: bold;
      color: black;
      text-align: center;
    }

    .portals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .portal-card {
      background: #fff;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .portal-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    .portal-card img {
      max-width: 120px;
      max-height: 90px;
      object-fit: contain;
    }

    .portal-card p {
      font-size: 16px;
      font-weight: bold;
      color: #333;
      margin: 5px 0 0;
    }

    /* === Mobile Styles === */
    @media (max-width: 600px) {
      .main-container {
        margin: 10px auto;
        padding: 15px;
        border-radius: 12px;
      }

      .portals-grid {
        gap: 15px;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      }

      .portal-card {
  background: #fff;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  height: 150px;
  display: flex;
  flex-direction: column;
  justify-content: center;   /* centered vertically */
  align-items: center;       /* centered horizontally */
  gap: 10px;                 /* space between image and text */
}


      .portal-card img {
        max-width: 100px;
        max-height: 75px;
      }

      .portal-card p {
        font-size: 15px;
      }
    }

    @media (max-width: 400px) {
      .portals-grid {
        grid-template-columns: 1fr;
      }

      .portal-card {
        width: 90%;
        height: 150px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <div id="portalsPage">
      <h2></h2>
      <div class="portals-grid" id="portalsGrid"></div>
    </div>
  </div>

  <script>
    const PORTALS_URL = "https://script.google.com/macros/s/AKfycbwluhec5Un9_wn6ppcnqElGgjoB32TjNucR7ARjh2RBWpHvN3oG9FtT0_vcKxQMjkFD/exec";

    async function loadPortals() {
      try {
        const res = await fetch(PORTALS_URL);
        const portals = await res.json();
        const grid = document.getElementById("portalsGrid");
        grid.innerHTML = "";

        portals.forEach(p => {
          const card = document.createElement("div");
          card.className = "portal-card";
          card.onclick = () => window.open(p.url, "_blank");

          const imgSrc = p.thumb || p.logo || "default_logo.png";
          card.innerHTML = `
            <img src="${imgSrc}" alt="${p.name}">
            <p>${p.name}</p>
          `;

          grid.appendChild(card);
        });
      } catch (err) {
        console.error("Failed to load portals:", err);
        document.getElementById("portalsGrid").innerHTML =
          "<p style='color:#333; text-align:center;'>⚠️ Failed to load portals. Please try again later.</p>";
      }
    }

    loadPortals();
  </script>
</body>
</html>
